    abstract: |
      The OGC API — Processes Standard is a resource-oriented API that allows for the execution of computing processes and the retrieval of metadata describing those processes. It is the modern, RESTful successor to the older [Web Processing Service (WPS) 2.0 Interface Standard](https://docs.ogc.org/is/14-065/14-065r2.html). It utilizes OpenAPI, JSON and modern web architectural patterns to make geospatial processing more accessible to web developers.

      The key benefits of the Standard are:

      - **Developer friendly:** By default, the Standard uses JSON and integrates easily with modern web frameworks and tools like Swagger/ReDoc.
      - **Scalable:** The Standard is designed to work well with cloud-native architectures, microservices and containerized environments.
      - **Modular:** The “building-blocks” approach allows servers to implement only what they need (e.g. a server might support process execution but not dynamic process deployment).
      - **Interoperable:** Standardizing how parameters are passed to algorithms ensures that process execution can be triggered on any compliant server regardless of the underlying programming language (e.g. C, Python, Java, etc.)

      Like other OGC APIs (such as Features or Records), OGC API Processes uses a common core for landing pages, conformance declarations, and API definitions. This consistency allows developers to use similar patterns across different types of geospatial web services.

