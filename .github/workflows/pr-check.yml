name: Validate Building Blocks PR
on:
  pull_request:

permissions:
  contents: read

# Read-only validation: runs postprocessing against the PR to catch things
# like broken bblock dependencies before merge, but never commits, deploys,
# or pushes anything - see process-bblocks.yml for the workflow that does.
#
# NOTE: if this repo overrides items_dir/register_file/generated_docs_path/
# annotated_path/test_outputs_path/config_file in process-bblocks.yml below,
# pass the same overrides here, or this check will run against the wrong
# paths.
jobs:
  pr-check:
    name: Validate PR
    uses: opengeospatial/bblocks-postprocess/.github/workflows/pr-check.yml@master
    # The reusable workflow sets fail_on_error=true, enable_sparql=false and
    # deploy_viewer=false internally; these are not workflow_call inputs.
    # Installing/running the configured plugin is intentional (see README).
    with:
      skip_permissions: 'true'