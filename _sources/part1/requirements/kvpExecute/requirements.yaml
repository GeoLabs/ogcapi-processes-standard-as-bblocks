# Source of truth: OGC 18-062r3 draft, https://docs.ogc.org/DRAFTS/18-062r3.html (retrieved 2026-11-09).
# Text transcribed from the draft; regenerate the document with bblocks-specgen.
#
# Requirements class https://www.opengis.net/spec/ogcapi-processes-1/2.0/req/kvp-execute
# Statements are placed in description.md (or in another clause) with
# <!-- requirement|recommendation|permission: <id> --> markers; abstract tests
# are laid out by the Annex A block (part1/annexes/ats).

class-id: kvp-execute
title: "Requirements Class ‘KVP-Execute’"
standardization-target: "Web API"
depends-on:
- uri: "#bb-ogc-api-processes-part1-requirements-core"
  title: "/req/core"
conformance-class:
  title: "KVP-encoded Execute"
requirements:
- id: "kvp-execute/process-execute-op"
  statement: |-
    The server SHALL support the HTTP GET operation at the path `/processes/{processID}/execution`.
- id: "kvp-execute/f-definition"
  statement: |-
    The operation SHALL support a response parameter `response[f]` with the following characteristics:

    ```yaml
    name: response
    in: query
    required: false
    schema:
      type: object
      required:
        - f
      properties:
        f:
          type: string
          format: uri
    style: deepObject
    explode: true
    ```
- id: "kvp-execute/f-response"
  statement: |-
    The `response[f]` parameter SHALL behave in the same way that the [HTTP `Accept` header](https://datatracker.ietf.org/doc/html/rfc7231#section-5.3.2) behaves.
- id: "kvp-execute/prefer-definition"
  statement: |-
    The operation SHALL support a parameter `response[prefer]` with the following characteristics:

    ```yaml
    name: response
    in: query
    required: false
    schema:
      type: object
      required:
        - prefer
      properties:
        prefer:
          type: string
          format: uri
    style: deepObject
    explode: true
    ```
- id: "kvp-execute/prefer-response"
  statement: |-
    The `response[prefer]` parameter SHALL behave in the same way that the [HTTP `Prefer` header](https://datatracker.ietf.org/doc/html/rfc7240) behaves.
- id: "kvp-execute/input-query-parameters"
  parts:
  - |-
      Each input defined in a [process description](#sec-7.11) SHALL map to a URI query parameter on the [process execution endpoint](#req-kvp-execute-process-execute-op).
  - |-
      The name of this URI query parameter SHALL be the identifier of the corresponding process input as defined in the [process description](#sec-7.11).
  - "The name of this URI query parameter SHALL be case in-sensitive."
- id: "kvp-execute/input-query-parameter-values"
  parts:
  - |-
      The server SHALL support process input values specified in-line as the value of the corresponding URI query parameter in the KVP-encoded execute request (i.e. by value).
  - |-
      The server SHALL support process input values specified by reference as specified in [/req/kvp-execute/input-by-reference](#req-kvp-execute-input-by-reference).
- id: "kvp-execute/string-input-value"
  conditions: |-
    1. The process input value is specified in-line in an [execute request](#execute-request-body).
    2. A process input, with identifier `{inputID}`, is defined as type `string` in the [process description](#sec-7.11).
  parts:
  - |-
      The input parameter SHALL have the following characteristics:

      ```yaml
      name: {inputID}
      in: query
      required: false
      schema:
        type: string
      style: form
      explode: false
      ```

      where the token `{inputID}` represents the identifier of the input.
- id: "kvp-execute/string-input-value"
  type: "permission"
  parts:
  - |-
      The characteristics of a string-valued input parameter MAY include additional [validation keywords](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-6.3) (i.e. [`maxLength`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-6.3.1), [`minLength`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-6.3.2), [`pattern`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-6.3.3)).
  - |-
      The characteristics of a string-valued input parameter MAY include the [`format`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-7) validation keyword.
  - |-
      The characteristics of a string-valued input parameter MAY include additional [keywords for string-encoded data](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-8) (i.e. [`contentEncoding`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-8.3), [`contentMediaType`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-8.5), [`contentSchema`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-8.6)).
  - |-
      The characteristics of a string-valued input parameter MAY include additional [validation keywords](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-6.1) (i.e. [`enum`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-6.1.2), [`const`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-6.1.3)) that apply to any type.
  - |-
      The characteristics of a string-valued input parameter MAY include [basic meta-data annotations](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9) (i.e. [`title` and `description`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9.1), [`default`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9.2), [`deprecated`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9.3), [`readOnly`, `writeOnly`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9.4) and [`examples`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9.5).
- id: "kvp-execute/numeric-input-value"
  conditions: |-
    1. The process input value is specified in-line in an [execute request](#execute-request-body).
    2. A process input, with identifier `{inputID}`, is defined as a numeric type input in the [process description](#sec-7.11).
  parts:
  - |-
      The input parameter SHALL have the following characteristics:

      ```yaml
      name: {inputID}
      in: query
      required: false
      schema:
        type: {numeric-type}
      style: form
      explode: false
      ```

      where the token `{inputID}` represents the identifier of the input and the token {numeric-type} is the value `number` or `integer`.
- id: "kvp-execute/numeric-input-value"
  type: "permission"
  parts:
  - |-
      The characteristics of a numeric input parameter MAY include additional [validation keywords](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-6.3) (i.e. [`multipleOf`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-6.2.1), [`maximum`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-6.2.2), [`exclusiveMaximum`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-6.2.3), [`minimum`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-6.2.4), [`exclusiveMinimum`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-6.2.5)).
  - |-
      The characteristics of a numeric input parameter MAY include additional [validation keywords](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-6.1) (i.e. [`enum`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-6.1.2), [`const`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-6.1.2)) that apply to any type.
  - |-
      The characteristics of a numeric input parameter MAY include [basic meta-data annotations](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9) (i.e. [`title`, `description`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9.1), [`default`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9.2), [`deprecated`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9.3), [`readOnly`, `writeOnly`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9.4) and [`examples`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9.5)).
- id: "kvp-execute/boolean-input-value"
  conditions: |-
    1. The process input value is specified in-line in an [execute request](#execute-request-body).
    2. A process input, with identifier `{inputID}` is defined as type `boolean` in the [process description](#sec-7.11).
  parts:
  - |-
      The input parameter SHALL have the following characteristics:

      ```yaml
      name: {inputID}
      in: query
      required: false
      schema:
        type: boolean
      style: form
      explode: false
      ```

      where the token `{inputID}` represented the identifier of the input.
- id: "kvp-execute/boolean-input-value"
  type: "permission"
  parts:
  - |-
      The characteristics of a Boolean valued input parameter MAY include additional [validation keywords](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-6.1) (i.e. [`enum`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-6.1.2), [`const`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-6.1.3)) that apply to any type.
  - |-
      The characteristics definition of a Boolean valued input parameter MAY include [basic meta-data annotations](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9) (i.e. [`title` and `description`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9.1), [`default`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9.2), [`deprecated`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9.3), [`readOnly`, `writeOnly`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9.4) and [`examples`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9.5).
- id: "kvp-execute/complex-input-value"
  conditions: |-
    1. The process input value is specified in-line in an [execute request](#execute-request-body).
    2. A process input, with identifier `{inputID}`, is defined as type `object` in the [process description](#sec-7.11).
  parts:
  - |-
      Complex-valued inputs SHALL be encoded as [URL-encoded](https://datatracker.ietf.org/doc/html/rfc3986#section-2) string-data.
  - |-
      The input parameter SHALL have the following characteristics:

      ```yaml
      name: {inputID}
      in: query
      required: false
      schema:
        type: string
      style: form
      explode: false
      ```

      where the token `{inputID}` represents the identifier of the input.
- id: "kvp-execute/complex-input-value"
  type: "permission"
  parts:
  - |-
      The characteristics of a complex-valued input parameter MAY include additional [keywords for string-encoded data](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-8) (i.e. [`contentEncoding`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-8.3), [`contentMediaType`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-8.5), [`contentSchema`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-8.6)).
  - |-
      The characteristics of a complex-valued input parameter MAY include additional [validation keywords](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-6.1) (i.e. [`enum`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-6.1.2), [`const`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-6.1.3)) that apply to any type.
  - |-
      The characteristics of a complex-valued input parameter MAY include [basic meta-data annotations](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9) (i.e. [`title` and `description`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9.1), [`default`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9.2), [`deprecated`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9.3), [`readOnly`, `writeOnly`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9.4) and [`examples`](https://datatracker.ietf.org/doc/html/draft-bhutton-json-schema-validation-00#section-9.5).
- id: "kvp-execute/array-input-value"
  conditions: |-
    1. The process input value is specified in-line in an [execute request](#execute-request-body).
    2. A process input, with identifier `{inputID}`, is defined as type `array` in the [process description](#sec-7.11).
  parts:
  - |-
      Array-valued inputs SHALL be encoded as [URL-encoded](https://datatracker.ietf.org/doc/html/rfc3986#section-2) string-data.
  - |-
      The input parameter SHALL have the following characteristics:

      ```yaml
      name: {inputID}
      in: query
      required: false
      schema:
        type: string
      style: form
      explode: false
      ```

      where the token `{inputID}` represents the identifier of the input.
- id: "kvp-execute/binary-input-value"
  conditions: |-
    1. The process input value is specified in-line in an [execute request](#execute-request-body).
    2. A process input, with identifier `{inputID}`, is defined a binary type (i.e. `"type": "string", "contentEncoding": "base64"`) in the [process description](#sec-7.11).
    3. The input value does not need to be [qualified](#qualified-value-schema) with a [format](#format-schema) specification.
  parts:
  - |-
      The input parameter SHALL have the following characteristics:

      ```yaml
      name: {inputID}
      in: query
      required: false
      schema:
        type: string
        contentEncoding: base64
      style: form
      explode: false
      ```

      where the token `{inputID}` represents the identifier of the input.
- id: "kvp-execute/binary-input-value-qualified"
  conditions: |-
    1. The process input value is specified in-line in an [execute request](#execute-request-body).
    2. A process input, with identifier `{inputID}`, is defined as a binary value (i.e. `"type": "string"`, `"contentEncoding": "base64"`) in the [process description](#sec-7.11).
    3. The input value needs to be [qualified](#qualified-value-schema) with a [format](#format-schema) specification.
  parts:
  - |-
      The input parameter SHALL have the following characteristics:

      ```yaml
      name: {inputID}
      in: query
      required: false
      schema:
        type: object
        required:
          - value
        properties:
          value:
            type: string
            contentEncoding: base64
          mediaType:
            type: string
          encoding:
            type: string
          schema:
            oneOf:
              - type: string
                format: url
              - type: object
      style: deepObject
      explode: true
      ```

      where the token `{inputID}` represents the identifier of the input.
- id: "kvp-execute/bbox-input-value"
  conditions: |-
    1. The process input value is specified in-line in an [execute request](#execute-request-body).
    2. The process input parameter is defined as a bbox in the [process description](#sec-7.11).
  parts:
  - |-
      A bbox input parameter SHALL have the following characteristics:

      ```yaml
      name: {bbox-input-name}
      in: query
      description: |-
        Only features that have a geometry that intersects the bounding box are selected.
        The bounding box is provided as four or six numbers, depending on whether the
        coordinate reference system includes a vertical axis (height or depth):

        * Lower left corner, coordinate axis 1
        * Lower left corner, coordinate axis 2
        * Minimum value, coordinate axis 3 (optional)
        * Upper right corner, coordinate axis 1
        * Upper right corner, coordinate axis 2
        * Maximum value, coordinate axis 3 (optional)

        If the value consists of four numbers, the coordinate reference system is
        WGS 84 longitude/latitude (http://www.opengis.net/def/crs/OGC/1.3/CRS84)
        unless a different coordinate reference system is specified in the parameter `bbox-crs`.

        If the value consists of six numbers, the coordinate reference system is WGS 84
        longitude/latitude/ellipsoidal height (http://www.opengis.net/def/crs/OGC/0/CRS84h)
        unless a different coordinate reference system is specified in the parameter `bbox-crs`.

        The query parameter `bbox-crs` is specified in OGC API - Features - Part 2: Coordinate
        Reference Systems by Reference.

        For WGS 84 longitude/latitude the values are in most cases the sequence of
        minimum longitude, minimum latitude, maximum longitude and maximum latitude.
        However, in cases where the box spans the antimeridian the first value
        (west-most box edge) is larger than the third value (east-most box edge).

        If the vertical axis is included, the third and the sixth number are the
        bottom and the top of the 3-dimensional bounding box.

        If a feature has multiple spatial geometry properties, it is the decision of the
        server whether only a single spatial geometry property is used to determine
        the extent or all relevant geometries.
      required: false
      schema:
        type: array
        oneOf:
        - minItems: 4
          maxItems: 4
        - minItems: 6
          maxItems: 6
        items:
          type: number
      style: form
      explode: false
      ```

      where the token `{bbox-input-name}` represented the identifier of the input.
- id: "kvp-execute/bbox-crs-input-value"
  conditions: |-
    1. The server supports CRSs other than [https://www.opengis.net/def/crs/OGC/1.3/CRS84](https://www.opengis.net/def/crs/OGC/1.3/CRS84) or [https://www.opengis.net/def/crs/OGC/0/CRS84h](https://www.opengis.net/def/crs/OGC/0/CRS84h).
    2. The process input value is specified in-line in an [execute request](#execute-request-body).
    3. The process defines an input parameter named `{bbox-input-name}`.
  parts:
  - |-
      A `{bbox-input-name}` input parameter SHALL have the following characteristics:

      ```yaml
      name: inputsCrs
      description: |-
        Asserts the CRS used for the coordinate values of a bounding
        box input parameter. The name `inputsCrs` is just a generic
        name to avoid ambiguity.  It is ignored since explode is set
        to true.
      in: query
      description: |-
        Asserts the CRS used for the coordinate values of a bounding
        box input parameter.
      required: false
      schema:
        type: object
        patternProperties:
          "^.+[crs]$":
            $ref: "../../schemas/processes-core/bbox-def-crs.yaml"
      explode: true
      style: form
      ```

      where the token `{bbox-input-name}` represents the identifier of a bbox input parameter and the token `{bbox-input-name}[crs]` represents the identifier of a corresponding input that indicates which CRS is being used for the coordinates of the `{bbox-input-name}` parameter.
- id: "kvp-execute/input-by-reference"
  conditions: |-
    1. The process input value is specified by reference in an [execute request](#execute-request-body).
  parts:
  - |-
      If the input cardinality is 1 then the input parameter SHALL have the following characteristics:

      ```yaml
      name: {inputID}
      in: query
      required: false
      schema:
        type: object
        required:
          - href
        properties:
          href:
            type: string
          rel:
            type: string
            example: service
          type:
            type: string
            example: application/json
          hreflang:
            type: string
            example: en
          title:
            type: string
      style: deepObject
      explode: true
      ```

      where the token `{inputID}` represented the identifier of the input.
  - |-
      If the input cardinality is greater than 1 then the value of the input parameter SHALL be encoded as a [link object](#link-schema) and appropriately [URL-encoded](#sec-15.2.2.3.5) to a string.
- id: "kvp-execute/input-cardinality"
  conditions: |-
    1. The process input value is specified in-line in an [execute request](#execute-request-body).
    2. A process input, with identifier `{inputID}`, is defined as having a cardinality greater than one (i.e. `minOccurs` > 1) in the [process description](#sec-7.11).
    3. The number of input values specified for the `{inputID}` process input is greater than one.
  parts:
  - |-
      A process input having more than one value SHALL be encoded as a list of values according to the query parameter serialization rules of the [OpenAPI Specification v3.0.3](https://spec.openapis.org/oas/v3.0.3#parameter-object) or [OpenAPI Specification v3.1.2](https://spec.openapis.org/oas/v3.1.2.html#parameter-object) (depending on the server of OpenAPI the server implements). The default list value separator is the comma (“,”) but other values are possible too.
  - |-
      The input parameter SHALL have the following characteristics:

      ```yaml
      name: {inputID}
      in: query
      required: false
      schema:
        type: array
        items:
          oneOf:
            - type: string
            - type: number
            - type: integer
            - type: boolean
            - type: null
      style: form
      explode: false
      ```

      where the token `{inputID}` represents the identifier of the input.
  - |-
      List elements that are objects SHALL be encoded as [URL-encoded strings](#sec-15.2.2.3.5).
  - "List elements that are arrays SHALL be encoded as [URL-encoded strings](#sec-15.2.2.3.6)."
- id: "kvp-execute/output"
  conditions: |-
    1. A process output, with identifier `{outputID}`, is defined in the [process description](#sec-7.11).
  parts:
  - |-
      The output parameter SHALL have the following characteristics:

      ```yaml
      name: {outputID}
      in: query
      required: false
      schema:
        type: object
        required:
          - include
        properties:
          include:
            type: boolean
          mediaType:
            type: string
          encoding:
            type: string
          index:
            type: integer
          schema:
            oneOf:
              - type: string
                format: url
              - type: object
      style: deepObject
      explode: true
      ```

      where the token `{outputID}` represents the identifier of the output.
abstract-tests:
- id: "kvp-execute/numeric-input-value"
  requirement: "/req/kvp-execute/numeric-input-value"
  purpose: |-
    Verify that numeric-valued process inputs for KVP-encoded execute request are correctly handled.
  method: |-
    1. Get a list of processes as per test [/conf/core/process-list-op](#ats-core-process-list-op).
    2. Retrieve the description of each process according to test [/conf/core/process-description-op](#ats-core-process-description-op).
    3. Inspect the input definitions of each process and identify a process that has one or more numeric-typed inputs.
    4. Compose a KVP-encoded execute request encoding the numeric-typed input(s) according to [/req/kvp-execute/numeric-input-value](#req-kvp-execute-numeric-input-value).
    5. Execute the request using the HTTP `GET` method.
    6. Verify that the response of the process is the expected response (see tests: [/req/core/process-execute-success-async](#req-core-process-execute-success-async), [/req/core/process-execute-success-async-outputs](#req-core-process-execute-success-async-outputs), [/req/core/process-execute-success-async-outputs-empty](#req-core-process-execute-success-async-outputs-empty), [/req/core/process-execute-success-async-outputs-omitted](#req-core-process-execute-success-async-outputs-omitted), [/req/core/process-execute-success-sync-empty-outputs](#req-core-process-execute-success-sync-empty-outputs), [/req/core/process-execute-sync-many-json](#req-core-process-execute-sync-many-json), [/req/core/process-execute-sync-one](#req-core-process-execute-sync-one), [/req/core/process-execute-sync-one-default-content](#req-core-process-execute-sync-one-default-content))
- id: "kvp-execute/string-input-value"
  requirement: "/req/kvp-execute/string-input-value"
  purpose: |-
    Verify that string-valued process inputs for KVP-encoded execute request are correctly handled.
  method: |-
    1. Get a list of processes as per test [/conf/core/process-list-op](#ats-core-process-list-op).
    2. Retrieve the description of each process according to test [/conf/core/process-description-op](#ats-core-process-description-op).
    3. Inspect the input definitions of each process and identify a process that has at least one string-typed input.
