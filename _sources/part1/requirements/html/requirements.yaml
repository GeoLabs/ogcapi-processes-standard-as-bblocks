# Source of truth: OGC 18-062r3 draft, https://docs.ogc.org/DRAFTS/18-062r3.html (retrieved 2026-11-09).
# Text transcribed from the draft; regenerate the document with bblocks-specgen.
#
# Requirements class https://www.opengis.net/spec/ogcapi-processes-1/2.0/req/html
# Statements are placed in description.md (or in another clause) with
# <!-- requirement|recommendation|permission: <id> --> markers; abstract tests
# are laid out by the Annex A block (part1/annexes/ats).

class-id: html
title: "Requirements Class ‘HTML’"
standardization-target: "Web API"
depends-on:
- uri: "https://www.opengis.net/spec/ogcapi_common/1.0/req/html"
  title: "https://www.opengis.net/spec/ogcapi_common/1.0/req/html"
- uri: "#w3c-html5"
  title: "W3C HTML 5"
- uri: "#bb-ogc-api-processes-part1-requirements-html"
  title: "/req/html"
conformance-class:
  title: "HTML"
  prerequisites:
  - "[Conformance Class “Core”](#conf-core)"
requirements:
- id: "html/definition"
  statement: |-
    `200`-responses of the server SHALL support the following media type:

    - `text/html`

    for all supported API endpoints including:

    - [`/`](#sec-7.2),
    - [`/conformance`](#sec-7.4),
    - [`/processes`](#sec-7.10),
    - [`/processes/{processID}`](#sec-7.11),
    - [`/jobs/{jobID}`](#sec-7.13)
- id: "html/media-types"
  type: "permission"
  statement: |-
    A HTML media type MAY be further qualified with additional subtype, suffix and parameter components. For example, `test/html; charset=UTF-8`.
- id: "html/content"
  statement: |-
    Every `200`-response of the server with the media type “text/html” SHALL be a [W3C HTML 5](#w3c-html5) document that includes the following information in the HTML body:

    - All information identified in the schemas of the [Response Object](https://github.com/OAI/OpenAPI-Specification/blob/master/versions/3.0.0.md#responseObject) in the HTML `<body/>`, and
    - All links in HTML `<a/>` elements in the HTML `<body/>`.
abstract-tests:
- id: "html/content"
  requirement: "/req/html/content"
  purpose: "Verify the content of an HTML document given an input document and schema."
  method: |-
    1. Validate that the document is an [W3C HTML 5](#w3c-html5) document.

    2. Manually inspect the document and verify that the HTML body contains:

       1. all information in the schemas of the [Response Object](https://github.com/OAI/OpenAPI-Specification/blob/master/versions/3.0.0.md#responseObject) in the HTML `<body/>`,
       2. all links in HTML `<a/>` elements in the HTML `<body/>`.
- id: "html/definition"
  requirement: "/req/html/definition"
  purpose: "Verify support for HTML"
  method: |-
    Verify that every `200` response for every operation of the Processes API implementation for which HTML was requested is of media type `text/html`.
