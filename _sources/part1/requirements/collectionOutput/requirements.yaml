# Text transcribed from the draft; regenerate the document with bblocks-specgen.
#
# Requirements class https://www.opengis.net/spec/ogcapi-processes-1/2.0/req/collection-output
# Statements are placed in description.md (or in another clause) with
# <!-- requirement|recommendation|permission: <id> --> markers; abstract tests
# are laid out by the Annex A block (part1/annexes/ats).

class-id: collection-output
title: "Requirements Class ‘Collection Output’"
standardization-target: "WebAPI"
depends-on:
- uri: "https://www.opengis.net/spec/ogcapi-common-2/1.0/req/collections"
  title: "https://www.opengis.net/spec/ogcapi-common-2/1.0/req/collections"
- uri: "#bb-ogc-api-processes-part1-requirements-core"
  title: "/req/core"
conformance-class:
  title: "Collection Output"
requirements:
- id: "collection-output/response-definition"
  statement: |-
    The server SHALL, at the execution endpoint (path: `/processes/{processId}/execution`), support a `response` parameter that controls the selection of a [Collection Output](#bb-ogc-api-processes-part1-requirements-collectionoutput) response instead of the usual [Process Output](#sec-7.12.2.4) representations.
  parts:
  - |-
      If the request is performed with a [KVP-encoded Execute request](#sec-15) (HTTP GET), the `response` parameter SHALL be a query parameter with the following characteristics (using an OpenAPI Specification fragment):

      ```yaml
      name: response
      in: query
      required: false
      schema:
        type: string
        enum: [ collection ]
      ```
  - |-
      If the request is performed with a [Execution Body request](#sec-7.12) (HTTP POST), the `response` parameter SHALL be a property in request body with the following characteristics (using an OpenAPI Specification fragment):

      ```yaml
      type: object
      properties:
        response:
          type: string
          enum: [ collection ]
      ```
- id: "collection-output/response-query"
  type: "permission"
  statement: "Collection output can be requested by query on HTTP POST request"
  parts:
  - |-
      The server MAY support using the `?response=collection` query parameter representation of the [Collection Output Response Definition](#req-collection-output-response-definition) even when the request is performed as HTTP POST in combination with any necessary [Execution Body](#sec-7.12).
- id: "collection-output/response-output-one"
  conditions: |-
    1. The [Execution request](#sec-7.12) includes the `response` parameter by [query or property](#req-collection-output-response-definition) as appropriate for the HTTP request strategy.
    2. The value of the `response` parameter is `collection`.
    3. The number of implicitly or explicitly requested outputs is 1.
  parts:
  - |-
      The server SHALL respond with an HTTP status code of [303](https://datatracker.ietf.org/doc/html/rfc7231#section-6.4.4).
  - |-
      The response SHALL include a [`Location`](https://datatracker.ietf.org/doc/html/rfc7231#section-7.1.2) response header redirecting to a [collection description document](#sec-4.1.2).
  - |-
      The [profile URI](#profile-uris) SHALL be returned in the response with HTTP header [`Link: href="https://www.opengis.net/def/profile/OGC/0/ogc-collection", rel="profile"`](https://www.opengis.net/def/profile/OGC/0/ogc-collection).
- id: "collection-output/response-output-one"
  type: "permission"
  conditions: |-
    1. The execution request includes the `response` parameter by [query or property](#req-collection-output-response-definition) as appropriate for the HTTP request strategy.
    2. The value of the `response` parameter is `collection`.
    3. The number of [implicitly](#sec-4.1.19) or [explicitly](#sec-4.1.18) requested outputs is 1.
    4. The server implements [“Content negotiations by profile”](#sec-7.7) (e.g., `?profile=`, `Accept-Profile:`, etc.).
    5. The execution request includes the selected profile content negotiation parameter.
    6. The value of the [negotiated profile](#sec-17) is [`https://www.opengis.net/def/profile/OGC/0/ogc-results`](https://www.opengis.net/def/profile/OGC/0/ogc-results).
  parts:
  - |-
      The content of response MAY conform to the [results.yaml](#schema_results) schema, as if multiple outputs were requested (see [/req/collection-output/response-output-many-results](#req-collection-output-response-output-many-results)).
- id: "collection-output/response-output-many-results"
  conditions: |-
    1. The [Execution request](#sec-7.12) includes the `response` parameter by [query or property](#req-collection-output-response-definition) as appropriate for the HTTP request strategy.
    2. The value of the `response` parameter is `collection`.
    3. The number of requested outputs (whether [implicitly or explicitly](#implicit-explicit-outputs)) is more than one.
    4. The [negotiated profile](#sec-7.7) is [`https://www.opengis.net/def/profile/OGC/0/ogc-results`](https://www.opengis.net/def/profile/OGC/0/ogc-results).
  parts:
  - |-
      The server SHALL respond with an HTTP status code of [200](https://datatracker.ietf.org/doc/html/rfc7231#section-6.3.1).
  - "The media type of the response SHALL be `application/json`."
  - "The content of response SHALL conform to the [results.yaml](#schema_results) schema."
  - |-
      Each collection output in the response SHALL be a link to a [collection description document](#sec-4.1.2).
  - |-
      The [profile URI](#profile-uris) SHALL be returned in the response with HTTP header [`Link: href="https://www.opengis.net/def/profile/OGC/0/ogc-results", rel="profile"`](https://www.opengis.net/def/profile/OGC/0/ogc-results).
- id: "collection-output/response-output-many-grouped"
  conditions: |-
    1. The [Execution request](#sec-7.12) includes the `response` parameter by [query or property](#req-collection-output-response-definition) as appropriate for the HTTP request strategy.
    2. The value of the `response` parameter is `collection`.
    3. The number of requested outputs (whether [implicitly or explicitly](#implicit-explicit-outputs)) is more than one.
    4. The [negotiated profile](#sec-7.7) is [`https://www.opengis.net/def/profile/OGC/0/ogc-collection`](https://www.opengis.net/def/profile/OGC/0/ogc-collection) or omitted.
  parts:
  - |-
      The server SHALL respond with an HTTP status code of [303](https://datatracker.ietf.org/doc/html/rfc7231#section-6.4.4).
  - |-
      The response SHALL include a [`Location`](https://datatracker.ietf.org/doc/html/rfc7231#section-7.1.2) response header redirecting to a [collection description document](#sec-4.1.2).
  - |-
      The referenced [collection description document](#sec-4.1.2) SHALL include all requested outputs under the same collection, using any aggregation strategy deemed appropriate for their negotiated contents respectively.
  - |-
      The [profile URI](#profile-uris) SHALL be returned in the response with HTTP header [`Link: href="https://www.opengis.net/def/profile/OGC/0/ogc-collection", rel="profile"`](https://www.opengis.net/def/profile/OGC/0/ogc-collection).
- id: "collection-output/response-unsupported"
  statement: "Error response when the Collection Output request cannot be interpreted."
  condition: |-
    1. The server is unable to interpret the requested contents, either due to invalid combinations of media-types per requested output, from their aggregation strategy as a whole, or from incompatible formats leaving it incapable of representing the expected outcome as [collection](#sec-4.1.1) output.
    2. Alternatively or simultaneously, the requested outputs contain any output indicated as not supporting the collection output as per [Requirement 79: `/req/ogc-process-description/data-access-apis`](#req-ogc-process-description-data-access-apis) (i.e., omitted `dataAccessApis`).
  parts:
  - "The code of the response SHALL be `400 Bad Request`."
  - |-
      The content of that response SHALL validate against the following OpenAPI schema fragment:

      ```yaml
      title: Exception Schema
      description: JSON schema for exceptions based on RFC 7807
      type: object
      required:
        - type
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      additionalProperties: true
      ```
  - |-
      The `type` of the exception SHALL be `"https://www.opengis.net/def/exceptions/ogcapi-processes-1/2.0/collection-output-unsupported"`.
- id: "collection-output/data-access-mechanisms"
  description: |-
    For returning resulting output data as a response to [OGC API data access requests](#sec-4.1.10):
  parts:
  - |-
      The server SHALL support at least one [OGC API data access mechanisms](#sec-4.1.10) corresponding to the data access links included in the target [collection description document](#sec-4.1.2).
- id: "collection-output/static"
  type: "permission"
  statement: |-
    The server MAY perform all the requested processing up front resulting in a fully materialized and static [output collection](#sec-4.1.1).
- id: "collection-output/dynamic"
  type: "permission"
  statement: |-
    The server MAY arrange for the [output collection](#sec-4.1.1) to be a “virtual” collection with processing being triggered at run-time each time the data of the collection is accessed using an [OGC API data access mechanisms](#sec-4.1.10) and taking into account any spatial, temporal and other filters specified on that data access request.
- id: "collection-output/expiry"
  type: "permission"
  statement: "Collection output resources are ephemeral in nature:"
  parts:
  - |-
      The server MAY return a [*410 Gone*](https://datatracker.ietf.org/doc/html/rfc7231#section-6.5.9) HTTP status code for resources associated with a previous *Collection Output* response if a significant period of time has elapsed since both the original request and any further associated data access requests have been made.
  - |-
      An Implementation MAY redirect a client re-posting an identical or equivalent process execution request for *Collection Output* (e.g., after having received a 410 gone status) to the same location as a previous execution (expired and reinstated, or still valid), or to a new location.
abstract-tests:
- id: "collection-output/response-definition"
  requirement: "/req/collection-output/response-definition"
  purpose: "Validate that the `response` query parameter is constructed correctly."
  method: |-
    Verify that the `response` query parameter complies with its definition in requirement [/req/collection-output/response-definition](#req-collection-output-response-definition).
- id: "collection-output/response-output-many-grouped"
  requirement: "/req/collection-output/response-output-many-grouped"
  purpose: |-
    Validate that the response for multiple [explicitly or implicitly](#implicit-explicit-outputs) requested outputs combines the outputs into a single [collection description](#sec-4.1.2) reference.
  method: |-
    1. Obtain a process description for one or more processes offered by the server as per test [/conf/core/process-description-op](#ats-core-process-description-op).
    2. Inspect the description of the outputs of each process and identify those outputs that support multiple collection outputs (e.g. see test [/conf/ogc-process-description/data-access-apis](#ats-ogc-process-description-data-access-apis)).
    3. Compose an execute request (see: [/conf/core/process-execute-op](#ats-core-process-execute-op)) for each identified process and request multiple outputs identified in Step 2. Ensure that the execution endpoint (i.e. `/processes/{processID}/execution`) includes the `response=collection` query parameter.
    4. Verify that the server responds with an HTTP status code of 303.
    5. Verify that the response includes a `Location` header referring to the produced [collection description](#sec-4.1.2) output.
    6. Verify that the response includes a HTTP header [`Link: href="https://www.opengis.net/def/profile/OGC/0/ogc-collection", rel="profile"`](https://www.opengis.net/def/profile/OGC/0/ogc-collection).
    7. Verify that the referenced [collection description](#sec-4.1.2) includes all requested outputs.
- id: "collection-output/response-output-many-results"
  requirement: "/req/collection-output/response-output-many-results"
  purpose: |-
    Validate that the response for multiple [explicitly or implicitly](#implicit-explicit-outputs) requested outputs is a [results.yaml](#schema_results) document containing references to [collection description documents](#sec-4.1.2).
  method: |-
    1. Obtain a process description for one or more processes offered by the server as per test [/conf/core/process-description-op](#ats-core-process-description-op).
    2. Inspect the description of the outputs of each process and identify those outputs that support multiple collection outputs (e.g. see test [/conf/ogc-process-description/data-access-apis](#ats-ogc-process-description-data-access-apis)).
    3. Compose an execute request (see: [/conf/core/process-execute-op](#ats-core-process-execute-op)) for each identified process and request multiple outputs identified in Step 2. Ensure that the execution endpoint (i.e. `/processes/{processID}/execution`) includes the `response=collection` query parameter and negotiates the [`https://www.opengis.net/def/profile/OGC/0/ogc-results`](https://www.opengis.net/def/profile/OGC/0/ogc-results) profile.
    4. Verify that the server responds with an HTTP status code of 200.
    5. Verify that the media type of the response is `application/json`.
    6. Verify that the body of the response conforms to the [results.yaml](#schema_results) schema.
    7. Verify that that value of each collection output is a link to a [collection description document](#sec-4.1.2).
- id: "collection-output/response-output-one"
  requirement: "/req/collection-output/response-output-one"
  purpose: |-
    Validate that the collection output for a single [explicitly or implicitly](#implicit-explicit-outputs) requested output is a reference to a [collection description document](#sec-4.1.2).
  method: |-
    1. Obtain a process description for one or more processes offered by the server as per test [/conf/core/process-description-op](#ats-core-process-description-op).
    2. Inspect the description of the outputs of each process and identify those outputs that support collection output (e.g. see test [/conf/ogc-process-description/data-access-apis](#ats-ogc-process-description-data-access-apis)).
    3. Compose an execute request (see: [/conf/core/process-execute-op](#ats-core-process-execute-op)) for each identified process and request exactly one of the outputs identified in Step 2. Ensure that the execution endpoint (i.e. `/processes/{processID}/execution`) includes the `response=collection` query parameter.
    4. Verify that the server responds with an HTTP status code of 303.
    5. Verify that the response includes a [`Location`](https://datatracker.ietf.org/doc/html/rfc7231#section-7.1.2) response header redirecting to a [collection description document](#sec-4.1.2)
    6. Verify that the response includes a HTTP header [`Link: href="https://www.opengis.net/def/profile/OGC/0/ogc-collection", rel="profile"`](https://www.opengis.net/def/profile/OGC/0/ogc-collection).
- id: "collection-output/response-unsupported"
  requirement: "/req/collection-output/response-unsupported"
  purpose: |-
    Validate that the collection output responds with the proper error message for unsupported format or data access combinations.
  method: |-
    1. Obtain a process description for one or more processes offered by the server as per test [/conf/core/process-description-op](#ats-core-process-description-op).
    2. Inspect the description of the outputs of each process and identify outputs that do not support collection output (i.e., `dataAccessApis` omitted).
    3. Compose an execute request (see: [/conf/core/process-execute-op](#ats-core-process-execute-op)) for each identified process and request outputs containing at least one identified output in Step 2. Ensure that the execution endpoint (i.e. `/processes/{processID}/execution`) includes the `response=collection` query parameter.
    4. Verify that the server responds with an HTTP status code of 400.
    5. Verify that the response a `type` asserting `"https://www.opengis.net/def/exceptions/ogcapi-processes-1/2.0/collection-output-unsupported"`.
    6. If provided, verify that the indicated `detail` describes an error that corresponds to a problem related to an unsupported collection format or data access mechanism.
- id: "collection-output/data-access-mechanisms"
  requirement: "/req/collection-output/data-access-mechanisms"
  purpose: |-
    Verify that the [description document](#sec-4.1.2) for an output collection includes data access links using at least one supported [OGC API data access mechanisms](#sec-4.1.10).
  method: |-
    1. Retrieve the [description document](#sec-4.1.2) for an output collection.
    2. Verify that the [description document](#sec-4.1.2) includes at least one data access link using a supported [OGC API data access mechanisms](#sec-4.1.10) (e.g. features, coverages);
