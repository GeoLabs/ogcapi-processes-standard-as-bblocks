# Source of truth: OGC 18-062r3 draft, https://docs.ogc.org/DRAFTS/18-062r3.html (retrieved 2026-11-09).
# Text transcribed from the draft; regenerate the document with bblocks-specgen.
#
# Requirements class https://www.opengis.net/spec/ogcapi-processes-1/2.0/req/json
# Statements are placed in description.md (or in another clause) with
# <!-- requirement|recommendation|permission: <id> --> markers; abstract tests
# are laid out by the Annex A block (part1/annexes/ats).

class-id: json
title: "Requirements Class ‘JSON’"
standardization-target: "Web API"
depends-on:
- uri: "#rfc8259"
  title: "JSON"
- uri: "#bb-ogc-api-processes-part1-requirements-core"
  title: "/req/core"
conformance-class:
  title: "JSON"
requirements:
- id: "json/definition"
  statement: |-
    `200`-responses of the server SHALL support the following media type:

    - `application/json`

    for all supported API endpoints including:

    - [`/`](#sec-7.2),
    - [`/conformance`](#sec-7.4),
    - [`/processes`](#sec-7.10),
    - [`/processes/{processID}`](#sec-7.11),
    - [`/jobs/{jobID}`](#sec-7.13)
- id: "json/media-types"
  type: "permission"
  statement: |-
    A JSON media type MAY be further qualified with additional subtype, suffix and parameter components. For example, `application/ld+json; charset=UTF-8`.
abstract-tests:
- id: "json/definition"
  requirement: "/req/json/definition"
  purpose: "Verify support for JSON."
  method: |-
    1. A resource is requested with response media type of `application/json`.
    2. All `200` responses SHALL support the following media types: `application/json` for all resources.
