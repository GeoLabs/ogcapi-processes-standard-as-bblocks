# Source of truth: OGC 18-062r3 draft, https://docs.ogc.org/DRAFTS/18-062r3.html (retrieved 2026-11-09).
# Text transcribed from the draft; regenerate the document with bblocks-specgen.
#
# Requirements class https://www.opengis.net/spec/ogcapi-processes-1/2.0/req/oas
# Statements are placed in description.md (or in another clause) with
# <!-- requirement|recommendation|permission: <id> --> markers; abstract tests
# are laid out by the Annex A block (part1/annexes/ats).

class-id: oas
title: "Requirements Class ‘OpenAPI’"
standardization-target: "Web API"
depends-on:
- uri: "#bb-ogc-api-processes-part1-requirements-core"
  title: "/req/core"
conformance-class:
  title: "OpenAPI"
  prerequisites:
  - "[Conformance Class “Core”](#conf-core)"
requirements:
- id: "oas/definition"
  statement: |-
    The content of the response of the HTTP GET operation at the landing page SHALL include the following links to the API definition:

    - Relation type `service-desc` and content type `application/vnd.oai.openapi+json;version=x.y` (where `x.y` is the version of the OpenAPI specification used);
    - Relation type `service-doc` and content type `text/html`.
- id: "oas/oas-impl"
  statement: "The server SHALL implement all capabilities specified in the OpenAPI definition."
- id: "oas/completeness"
  statement: |-
    The OpenAPI definition SHALL specify for each operation all HTTP Status Codes and Response Objects that the server uses in responses. This includes the successful execution of an operation as well as all error situations that originate from the server.
- id: "oas/exceptions-codes"
  statement: |-
    For error situations that originate from the server, the API definition SHALL cover all applicable HTTP Status Codes.
- id: "oas/security"
  statement: |-
    For cases where the operations of the server are access-controlled, the security scheme(s) SHALL be documented in the OpenAPI definition.
# The draft gives no abstract tests for this conformance class
abstract-tests: []
