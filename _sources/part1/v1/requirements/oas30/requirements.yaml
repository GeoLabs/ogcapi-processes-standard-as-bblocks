  source-table-html: |-
    <table class="recommend" id="req_oas30_exceptions-codes" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 62</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/oas30/exceptions-codes</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_35d88097-4ea8-c36c-80cb-0ea78d3af595">For error situations that originate from the server, the API definition
    SHALL cover all applicable HTTP Status Codes.</p></td></tr></tbody></table>
  statement: |-
    <p id="_35d88097-4ea8-c36c-80cb-0ea78d3af595">For error situations that originate from the server, the API definition
    SHALL cover all applicable HTTP Status Codes.</p>
- id: oas30/security
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/req/oas30/security
  type: requirement
  source-anchor: req_oas30_security
  source-label: Requirement 63
  source-uri: /req/oas30/security
  source-table-html: |-
    <table class="recommend" id="req_oas30_security" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 63</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/oas30/security</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_1e76e084-f272-59e7-c46f-53140b544782">For cases, where the operations of the server are access-controlled,
    the security scheme(s) SHALL be documented in the OpenAPI definition.</p></td></tr></tbody></table>
  statement: |-
    <p id="_1e76e084-f272-59e7-c46f-53140b544782">For cases, where the operations of the server are access-controlled,
    the security scheme(s) SHALL be documented in the OpenAPI definition.</p>
