- id: oas30/completeness
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/req/oas30/completeness
  type: requirement
  source-anchor: req_oas30_completeness
  source-label: Requirement 61
  source-uri: /req/oas30/completeness
  source-table-html: |-
    <table class="recommend" id="req_oas30_completeness" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 61</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/oas30/completeness</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_ec46806d-9a61-1030-5d41-0a215da2210e">The OpenAPI definition SHALL specify for each operation all
    <a href="https://github.com/OAI/OpenAPI-Specification/blob/master/versions/3.0.0.md#httpCodes">HTTP Status Codes</a>
    and
    <a href="https://github.com/OAI/OpenAPI-Specification/blob/master/versions/3.0.0.md#responseObject">Response Objects</a>
    that the server uses in responses.</p><p id="_16f0fcfb-aed6-ccce-9bd8-b95e5d7bb496">This includes the successful execution of an operation as well as all error
    situations that originate from the server.</p></td></tr></tbody></table>
  statement: |-
    <p id="_ec46806d-9a61-1030-5d41-0a215da2210e">The OpenAPI definition SHALL specify for each operation all
    <a href="https://github.com/OAI/OpenAPI-Specification/blob/master/versions/3.0.0.md#httpCodes">HTTP Status Codes</a>
    and
    <a href="https://github.com/OAI/OpenAPI-Specification/blob/master/versions/3.0.0.md#responseObject">Response Objects</a>
    that the server uses in responses.</p><p id="_16f0fcfb-aed6-ccce-9bd8-b95e5d7bb496">This includes the successful execution of an operation as well as all error
    situations that originate from the server.</p>
