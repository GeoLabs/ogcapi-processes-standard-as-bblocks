    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test purpose</td><td class="recommend" style="vertical-align:top;">
    <p id="_59f530f3-07b8-7389-93c2-77000655a235">Verify that all capabilities specified in the OpenAPI definition are implemented by the API.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test method</td><td class="recommend" style="vertical-align:top;"><ol type="1">
    <li>
    <p id="_631ee005-09cc-2a45-b992-190d04f8cb3e">Construct a path from each URL template including all server URL options and all enumerated path parameters.</p>
    </li>
