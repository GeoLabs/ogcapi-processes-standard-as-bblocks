    <table class="recommend" id="req_oas30_oas-definition-1" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 58</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/oas30/oas-definition-1</p></td></tr><tr><td class="recommend" style="vertical-align:top;">A</td><td class="recommend" style="vertical-align:top;">
    <p id="_cf8716af-a2f2-8c28-5aab-2e49f228b32d">An OpenAPI definition in JSON using the media type <tt>application/vnd.oai.openapi+json;version=3.0</tt> and a HTML version of the API definition using the media type <tt>text/html</tt> SHALL be available.</p>
    </td></tr></tbody></table>
  statement: ''
  parts:
  - <p id="_cf8716af-a2f2-8c28-5aab-2e49f228b32d">An OpenAPI definition in JSON using the media type <tt>application/vnd.oai.openapi+json;version=3.0</tt> and a HTML version of the API definition using the media type <tt>text/html</tt> SHALL be available.</p>
