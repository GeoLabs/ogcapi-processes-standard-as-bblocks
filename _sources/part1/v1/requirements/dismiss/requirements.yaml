    response with a HTTP status code 200.
    The content of that response SHALL be based upon the OpenAPI
    3.0 schema <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/statusInfo.yaml">statusInfo.yaml</a>. The status SHALL be set to “dismissed”.</p>
