requirements:
- id: ogc-process-description/json-encoding
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/req/ogc-process-description/json-encoding
  type: requirement
  source-anchor: req_ogc-process-description_json-encoding
  source-label: Requirement 47
  source-uri: /req/ogc-process-description/json-encoding
  source-table-html: '<table class="recommend" id="req_ogc-process-description_json-encoding" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 47</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/ogc-process-description/json-encoding</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_c4f15113-dcda-ccd2-7366-fc60c8aedf5f">A JSON-encoded OGC process description SHALL validate against the JSON Schema: <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/process.yaml">process.yaml</a>.</p></td></tr></tbody></table>'
  statement: '<p id="_c4f15113-dcda-ccd2-7366-fc60c8aedf5f">A JSON-encoded OGC process description SHALL validate against the JSON Schema: <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/process.yaml">process.yaml</a>.</p>'
- id: ogc-process-description/inputs-def
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/req/ogc-process-description/inputs-def
  type: requirement
  source-anchor: req_ogc-process-description_inputs-def
  source-label: Requirement 48
  source-uri: /req/ogc-process-description/inputs-def
  source-table-html: |-
    <table class="recommend" id="req_ogc-process-description_inputs-def" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 48</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/ogc-process-description/inputs-def</p></td></tr><tr><td class="recommend" style="vertical-align:top;">A</td><td class="recommend" style="vertical-align:top;">
    <p id="_61f0270b-1254-08fa-0279-b6cfdc1876d2">Each process input definition SHALL be listed in the <tt>inputs</tt> section according to the JSON Schema: <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/inputDescription.yaml">inputDescription.yaml</a>.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">B</td><td class="recommend" style="vertical-align:top;">
    <p id="_f8b04065-acbf-41a2-2421-6fc8c0e5a922">The key of each process input in the <tt>inputs</tt> section of the process definition SHALL be the identifier for that input.</p>
    </td></tr></tbody></table>
  statement: ''
  parts:
  - '<p id="_61f0270b-1254-08fa-0279-b6cfdc1876d2">Each process input definition SHALL be listed in the <tt>inputs</tt> section according to the JSON Schema: <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/inputDescription.yaml">inputDescription.yaml</a>.</p>'
  - <p id="_f8b04065-acbf-41a2-2421-6fc8c0e5a922">The key of each process input in the <tt>inputs</tt> section of the process definition SHALL be the identifier for that input.</p>
- id: ogc-process-description/input-def
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/req/ogc-process-description/input-def
  type: requirement
  source-anchor: req_ogc-process-description_input-def
  source-label: Requirement 49
  source-uri: /req/ogc-process-description/input-def
  source-table-html: |-
    <table class="recommend" id="req_ogc-process-description_input-def" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 49</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/ogc-process-description/input-def</p></td></tr><tr><td class="recommend" style="vertical-align:top;">A</td><td class="recommend" style="vertical-align:top;">
    <p id="_4ccfb3bb-0df1-948a-32fe-c6c8939025d4">The schema of each <a href="#input-value-schema">process <b>input</b> value</a> SHALL be specified using the <tt>schema</tt> parameter.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">B</td><td class="recommend" style="vertical-align:top;">
    <p id="_c63238f2-2567-42d5-25ef-7b9d4bfead57">The value of the <tt>schema</tt> parameter SHALL be a JSON fragment that validates according to the JSON Schema: <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/schema.yaml">schema.yaml</a>.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">C</td><td class="recommend" style="vertical-align:top;">
    <p id="_28113e4c-6134-f17d-7073-08fe3c35b324">Servers SHALL use this schema fragment to validate the components of a <a href="#sc_process_inputs">process input</a> in an <a href="#execute-request-body">execute request</a> that is an instance of <a href="#input-value-schema">inputValue.yaml</a>.</p>
    </td></tr></tbody></table>
  statement: ''
  parts:
  - <p id="_4ccfb3bb-0df1-948a-32fe-c6c8939025d4">The schema of each <a href="#input-value-schema">process <b>input</b> value</a> SHALL be specified using the <tt>schema</tt> parameter.</p>
  - '<p id="_c63238f2-2567-42d5-25ef-7b9d4bfead57">The value of the <tt>schema</tt> parameter SHALL be a JSON fragment that validates according to the JSON Schema: <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/schema.yaml">schema.yaml</a>.</p>'
  - <p id="_28113e4c-6134-f17d-7073-08fe3c35b324">Servers SHALL use this schema fragment to validate the components of a <a href="#sc_process_inputs">process input</a> in an <a href="#execute-request-body">execute request</a> that is an instance of <a href="#input-value-schema">inputValue.yaml</a>.</p>
- id: ogc-process-description/input-binary
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/req/ogc-process-description/input-binary
  type: requirement
  source-anchor: req_ogc-process-description_input-binary
  source-label: Requirement 50
  source-uri: /req/ogc-process-description/input-binary
  source-table-html: '<table class="recommend" id="req_ogc-process-description_input-binary" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 50</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/ogc-process-description/input-binary</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_d77bc7f0-4e42-377d-9e33-24dfc89c55b6">A server SHALL support the following schema for binary include values:</p><pre class="prettyprint" id="_dba41f21-f0dc-ccf6-3c2b-cb4cfbfe14df">type: string<br/>format: byte</pre></td></tr></tbody></table>'
  statement: '<p id="_d77bc7f0-4e42-377d-9e33-24dfc89c55b6">A server SHALL support the following schema for binary include values:</p><pre class="prettyprint" id="_dba41f21-f0dc-ccf6-3c2b-cb4cfbfe14df">type: string<br/>format: byte</pre>'
- id: ogc-process-description/input-mixed-type
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/req/ogc-process-description/input-mixed-type
  type: requirement
  source-anchor: req_ogc-process-description_input-mixed-type
  source-label: Requirement 51
  source-uri: /req/ogc-process-description/input-mixed-type
  source-table-html: |-
    <table class="recommend" id="req_ogc-process-description_input-mixed-type" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 51</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/ogc-process-description/input-mixed-type</p></td></tr><tr><td class="recommend" style="vertical-align:top;">A</td><td class="recommend" style="vertical-align:top;">
    <p id="_0ab122d4-7085-2ffe-2307-d489c570f8b7">An input that can be of mixed type SHALL be defined using the <a href="https://tools.ietf.org/html/draft-bhutton-json-schema-00#section-10.2.1.3"><tt>oneOf</tt></a> JSON Schema keyword.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">B</td><td class="recommend" style="vertical-align:top;">
    <p id="_e914fd44-6edd-a489-49b6-aec3cc4f05c9">Each sub-schema SHALL be a JSON fragment that validates according to the JSON Schema: <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/schema.yaml">schema.yaml</a>.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">C</td><td class="recommend" style="vertical-align:top;">
    <p id="_1c81fe46-1cc0-0e3e-e337-27d907637465">The first sub-schema in the <a href="https://tools.ietf.org/html/draft-bhutton-json-schema-00#section-10.2.1.3"><tt>oneOf</tt></a> array SHALL be considered the default format.</p>
    </td></tr></tbody></table>
  statement: ''
  parts:
  - <p id="_0ab122d4-7085-2ffe-2307-d489c570f8b7">An input that can be of mixed type SHALL be defined using the <a href="https://tools.ietf.org/html/draft-bhutton-json-schema-00#section-10.2.1.3"><tt>oneOf</tt></a> JSON Schema keyword.</p>
  - '<p id="_e914fd44-6edd-a489-49b6-aec3cc4f05c9">Each sub-schema SHALL be a JSON fragment that validates according to the JSON Schema: <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/schema.yaml">schema.yaml</a>.</p>'
  - <p id="_1c81fe46-1cc0-0e3e-e337-27d907637465">The first sub-schema in the <a href="https://tools.ietf.org/html/draft-bhutton-json-schema-00#section-10.2.1.3"><tt>oneOf</tt></a> array SHALL be considered the default format.</p>
