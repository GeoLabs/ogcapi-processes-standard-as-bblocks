  statement: '<p id="_b0501ada-b3f0-b38c-192b-4d122795366d">If the parameter is specified with the operation, only jobs that have a value for the <tt>created</tt> property (see: <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/statusInfo.yaml">statusInfo.yaml</a> that intersects the temporal information in the <tt>datetime</tt> parameter SHALL be included in the response.</p>'
