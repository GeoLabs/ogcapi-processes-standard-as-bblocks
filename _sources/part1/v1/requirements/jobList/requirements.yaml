  - |-
    <p id="_4dae47db-5f86-4bd8-f3bc-8ca8dfd4b815">The operation SHALL support a parameter <tt>maxDuration</tt> with the following characteristics (using an OpenAPI Specification 3.0 fragment):</p>
    <pre class="prettyprint" id="_57230e40-5bbe-040b-985c-965ca946e5e2">name: maxDuration<br/>in: query<br/>required: false<br/>schema:<br/>  type: array<br/>  items:<br/>    type: integer<br/>style: form<br/>explode: false</pre>
- id: job-list/status-response--published-requirement-75
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/req/job-list/status-response
  type: requirement
  source-anchor: req_job-list_duration-response
  source-label: Requirement 75
  source-uri: /req/job-list/status-response
  source-table-html: |-
    <table class="recommend" id="req_job-list_duration-response" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 75</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/job-list/status-response</p></td></tr><tr><td class="recommend" style="vertical-align:top;">Conditions</td><td class="recommend" style="vertical-align:top;">
    <ol id="_71b67bd6-11af-3dca-c09f-fc379f65a713" type="1">
    <li>
    <p id="_45e77789-973a-fbae-e98b-94cc34893031">If the <tt>status</tt> parameter is not specified then only jobs that are running (status: <tt>running</tt>) or have completed execution (<tt>successful</tt>, <tt>failed</tt> or <tt>dismissed</tt>) SHALL be considered for inclusion in the response.</p>
    </li>
    <li>
    <p id="_e582331c-559e-badd-6d71-57f327552cad">If the <tt>status</tt> parameter is specified, then only jobs with the specified status SHALL be considered for inclusion in the response.</p>
    </li>
    </ol>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">A</td><td class="recommend" style="vertical-align:top;">
    <p id="_8ec6b881-8ae5-cd07-6569-f29d179eee5e">If only the <tt>minDuration</tt> parameter is specified with the operation, only jobs with the appropriate status and a duration of at least the specified <tt>minDuration</tt> value SHALL be included in the response.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">B</td><td class="recommend" style="vertical-align:top;">
    <p id="_6d528fcc-8c4f-5528-fd22-6ce5f8954ec0">If only the <tt>maxDuration</tt> parameter is specified with the operation, only jobs with the appropriate status and a duration of no longer than the specified <tt>maxDuration</tt> value SHALL be included in the response.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">C</td><td class="recommend" style="vertical-align:top;">
    <p id="_96ee161d-cab2-3099-9b33-881ae6d3d584">If both the <tt>minDuration</tt> and <tt>maxDuration</tt> parameters are specified with the operation, only jobs with the appropriate status and a duration of at least the specified <tt>minDuration</tt> value and no longer than the specified <tt>maxDuration</tt> value SHALL be included in the response.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">D</td><td class="recommend" style="vertical-align:top;">
    <p id="_c407458b-ce97-061e-b1c8-94d2963e74fc">The value of the <tt>minDuration</tt> and <tt>maxDuration</tt> parameters SHALL be number of seconds.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">E</td><td class="recommend" style="vertical-align:top;">
    <p id="_3b988bdc-b9e0-a436-e9b5-6c26037b5bc9">For running jobs, the duration SHALL be computed at runtime as the time the operation was invoked minus the value of the <tt>started</tt> parameter  (see: <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/statusInfo.yaml">statusInfo.yaml</a>).</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">F</td><td class="recommend" style="vertical-align:top;">
    <p id="_f5447ef1-0002-9c45-d97a-f1cf31cb30b3">For completed jobs, the duration SHALL be computed as the value of the <tt>finished</tt> parameter minus the value of the <tt>started</tt> parameter  (see: <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/statusInfo.yaml">statusInfo.yaml</a>).</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">G</td><td class="recommend" style="vertical-align:top;">
    <p id="_ed78d8c1-ed3e-d82a-16a4-de910783b308">Jobs for which runtime statistics are not included in the <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/statusInfo.yaml">status information</a> or are incomplete for computing the duration of the job SHALL be omitted from the response.</p>
    </td></tr></tbody></table>
  condition: |-
    <ol id="_71b67bd6-11af-3dca-c09f-fc379f65a713" type="1">
    <li>
    <p id="_45e77789-973a-fbae-e98b-94cc34893031">If the <tt>status</tt> parameter is not specified then only jobs that are running (status: <tt>running</tt>) or have completed execution (<tt>successful</tt>, <tt>failed</tt> or <tt>dismissed</tt>) SHALL be considered for inclusion in the response.</p>
    </li>
    <li>
    <p id="_e582331c-559e-badd-6d71-57f327552cad">If the <tt>status</tt> parameter is specified, then only jobs with the specified status SHALL be considered for inclusion in the response.</p>
    </li>
    </ol>
  statement: ''
  parts:
  - <p id="_8ec6b881-8ae5-cd07-6569-f29d179eee5e">If only the <tt>minDuration</tt> parameter is specified with the operation, only jobs with the appropriate status and a duration of at least the specified <tt>minDuration</tt> value SHALL be included in the response.</p>
  - <p id="_6d528fcc-8c4f-5528-fd22-6ce5f8954ec0">If only the <tt>maxDuration</tt> parameter is specified with the operation, only jobs with the appropriate status and a duration of no longer than the specified <tt>maxDuration</tt> value SHALL be included in the response.</p>
  - <p id="_96ee161d-cab2-3099-9b33-881ae6d3d584">If both the <tt>minDuration</tt> and <tt>maxDuration</tt> parameters are specified with the operation, only jobs with the appropriate status and a duration of at least the specified <tt>minDuration</tt> value and no longer than the specified <tt>maxDuration</tt> value SHALL be included in the response.</p>
  - <p id="_c407458b-ce97-061e-b1c8-94d2963e74fc">The value of the <tt>minDuration</tt> and <tt>maxDuration</tt> parameters SHALL be number of seconds.</p>
  - '<p id="_3b988bdc-b9e0-a436-e9b5-6c26037b5bc9">For running jobs, the duration SHALL be computed at runtime as the time the operation was invoked minus the value of the <tt>started</tt> parameter  (see: <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/statusInfo.yaml">statusInfo.yaml</a>).</p>'
  - '<p id="_f5447ef1-0002-9c45-d97a-f1cf31cb30b3">For completed jobs, the duration SHALL be computed as the value of the <tt>finished</tt> parameter minus the value of the <tt>started</tt> parameter  (see: <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/statusInfo.yaml">statusInfo.yaml</a>).</p>'
  - <p id="_ed78d8c1-ed3e-d82a-16a4-de910783b308">Jobs for which runtime statistics are not included in the <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/statusInfo.yaml">status information</a> or are incomplete for computing the duration of the job SHALL be omitted from the response.</p>
