- id: job-list/datetime-definition
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/req/job-list/datetime-definition
  type: requirement
  source-anchor: req_job-list_datetime-definition
  source-label: Requirement 72
  source-uri: /req/job-list/datetime-definition
  source-table-html: |-
    <table class="recommend" id="req_job-list_datetime-definition" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 72</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/job-list/datetime-definition</p></td></tr><tr><td class="recommend" style="vertical-align:top;">A</td><td class="recommend" style="vertical-align:top;"><p id="_fde269b5-e713-3fe7-e3b4-ad01274c0dd8">The operation SHALL support a parameter <tt>datetime</tt> with the following characteristics (using an OpenAPI Specification 3.0 fragment):</p>
    <pre class="prettyprint" id="_763e1e92-ab22-39ce-b9d2-bc9ffdbfab46">name: datetime<br/>in: query<br/>required: false<br/>schema:<br/>  type: string</pre>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">B</td><td class="recommend" style="vertical-align:top;"><p id="_8734b17e-2bc9-565c-f046-1dcfdea7a714">The value of the <tt>datetime</tt> parameter is either a date-time value or a time interval. The parameter value SHALL conform to the following syntax (using <a href="https://tools.ietf.org/html/rfc2234">ABNF</a>):</p>
    <pre class="prettyprint" id="_f4523aac-b6c1-6068-35b6-05a3f0d4ac0e">interval-closed     = date-time "/" date-time<br/>interval-open-start = [".."] "/" date-time<br/>interval-open-end   = date-time "/" [".."]<br/>interval            = interval-closed / interval-open-start / interval-open-end<br/>datetime            = date-time / interval</pre>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">C</td><td class="recommend" style="vertical-align:top;">
    <p id="_86aeb368-275a-39bc-ea1f-b62257e38279">The syntax of <tt>date-time</tt> is specified by <a href="https://tools.ietf.org/html/rfc3339#section-5.6">RFC 3339, 5.6</a>.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">D</td><td class="recommend" style="vertical-align:top;">
    <p id="_dff8cb41-30be-5e67-692d-d9ef92118089">Open ranges in time intervals at the start or end are supported using a double-dot (<tt>..</tt>) or an empty string for the start/end.</p>
    </td></tr></tbody></table>
  statement: ''
  parts:
  - |-
    <p id="_fde269b5-e713-3fe7-e3b4-ad01274c0dd8">The operation SHALL support a parameter <tt>datetime</tt> with the following characteristics (using an OpenAPI Specification 3.0 fragment):</p>
    <pre class="prettyprint" id="_763e1e92-ab22-39ce-b9d2-bc9ffdbfab46">name: datetime<br/>in: query<br/>required: false<br/>schema:<br/>  type: string</pre>
  - |-
    <p id="_8734b17e-2bc9-565c-f046-1dcfdea7a714">The value of the <tt>datetime</tt> parameter is either a date-time value or a time interval. The parameter value SHALL conform to the following syntax (using <a href="https://tools.ietf.org/html/rfc2234">ABNF</a>):</p>
    <pre class="prettyprint" id="_f4523aac-b6c1-6068-35b6-05a3f0d4ac0e">interval-closed     = date-time "/" date-time<br/>interval-open-start = [".."] "/" date-time<br/>interval-open-end   = date-time "/" [".."]<br/>interval            = interval-closed / interval-open-start / interval-open-end<br/>datetime            = date-time / interval</pre>
  - <p id="_86aeb368-275a-39bc-ea1f-b62257e38279">The syntax of <tt>date-time</tt> is specified by <a href="https://tools.ietf.org/html/rfc3339#section-5.6">RFC 3339, 5.6</a>.</p>
  - <p id="_dff8cb41-30be-5e67-692d-d9ef92118089">Open ranges in time intervals at the start or end are supported using a double-dot (<tt>..</tt>) or an empty string for the start/end.</p>
