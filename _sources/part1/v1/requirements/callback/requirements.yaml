    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test purpose</td><td class="recommend" style="vertical-align:top;">
    <p id="_07c623b6-fa00-a81e-0c36-b33e8d267a2b">Validate the passing of a subscriber-URL in an execute request.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test method</td><td class="recommend" style="vertical-align:top;"><ol type="1">
    <li>
    <p id="_e587c999-0d74-5a7a-30c1-762ae9242646">Configure a URL endpoint to accept message body from the server.</p>
    </li>
    <li>
    <p id="_0340ede8-2b3d-35f2-6adc-082b6b0f488f">Create an asynchronous execute request that includes the optional <tt>subscriber</tt> key (see <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/execute.yaml">execute.yaml</a>.</p>
    </li>
    <li>
    <p id="_aa379bf4-d01d-9003-57a3-06bce333bd43">Execute the asynchronous job using test <a href="#ats_core_job-creation-op">/conf/core/job-creation-request</a>.</p>
    </li>
    <li>
    <p id="_b2d13311-4e4e-ba5a-8dd7-e20486678d2b">Validate the job results are received by the specified callback URL.</p>
    </li>
    </ol>
    </td></tr></tbody></table>
