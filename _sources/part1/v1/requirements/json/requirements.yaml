- id: json/definition
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/req/json/definition
  type: requirement
  source-anchor: req_json_definition
  source-label: Requirement 55
  source-uri: /req/json/definition
  source-table-html: |-
    <table class="recommend" id="req_json_definition" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 55</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/json/definition</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_720d9280-4ef4-abb6-2d15-ab6f6fd47f67"><tt>200</tt>-responses of the server SHALL support the following media type:</p><ul id="_477827ef-b6e5-7541-9c00-ad45020be50d">
    <li>
    <p id="_23a1bf0c-7bde-70fa-74ce-d8f644cdc375">
    <tt>application/json</tt>
    </p>
    </li>
    </ul><p id="_6eed019b-8673-24d6-aee9-b39f9b0956d6">for the following API endpoints:</p><ul id="_f8f1593c-830f-13f7-40d5-490f966418ea">
    <li>
    <p id="_34adbace-eb8f-9d9d-7823-51b8c7362633">
    <a href="#sc_landing_page">
    <tt>/</tt>
    </a>
    </p>
    </li>
    <li>
    <p id="_d33c1942-270c-6da9-5712-07c3002686a1">
    <a href="#sc_conformance_classes">
    <tt>/conformance</tt>
    </a>
    </p>
    </li>
    <li>
    <p id="_65b58390-2fbe-174d-796b-bfc8916cf132">
    <a href="#sc_process_list">
    <tt>/processes</tt>
    </a>
    </p>
    </li>
    <li>
    <p id="_2d5b4707-3c39-6db2-3f93-18dc3ceff63e">
    <a href="#sc_process_description">
    <tt>/processes/{processID}</tt>
    </a>
    </p>
    </li>
    <li>
    <p id="_1e00100d-b1d8-ab33-2dcf-cf61d8eea46f">
    <a href="#sc_retrieve_status_info">
    <tt>/jobs/{jobID}</tt>
    </a>
    </p>
    </li>
    </ul><p id="_4328c690-f0a3-a38d-81c7-e863cf6acbbc">and for the following API endpoint:</p><ul id="_86dd1282-d67e-a364-675c-3ed76a640514">
    <li>
    <p id="_e6a614b4-bc35-3e2f-4198-be988f8374f8">
    <a href="#sc_create_job">
    <tt>/processes/{processID}/execution</tt>
    </a>
    </p>
    </li>
    </ul><p id="_5bf2fcf4-d81e-9ab4-9f26-d562a45c31e1">when the <a href="#sc_response_parameter"><tt>response</tt></a> parameter is set to the value <tt>document</tt> and/or the <a href="#sc_execution_mode">negotiated execution mode</a> is asynchronous.</p></td></tr></tbody></table>
