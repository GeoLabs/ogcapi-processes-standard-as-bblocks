  source-label: Requirement 56
  source-uri: /req/html/definition
  source-table-html: |-
    <table class="recommend" id="req_html_definition" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 56</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/html/definition</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_094e51ad-1172-8964-16e7-8cac4633794f">Every <tt>200</tt>-response of an operation of the server
    SHALL support the media type <tt>text/html</tt>.</p></td></tr></tbody></table>
  statement: |-
    <p id="_094e51ad-1172-8964-16e7-8cac4633794f">Every <tt>200</tt>-response of an operation of the server
    SHALL support the media type <tt>text/html</tt>.</p>
- id: html/content
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/req/html/content
  type: requirement
  source-anchor: req_html_content
  source-label: Requirement 57
  source-uri: /req/html/content
  source-table-html: |-
    <table class="recommend" id="req_html_content" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 57</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/html/content</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_b5d7fc9d-49ab-ccf9-f20e-4e4bd3816710">Every <tt>200</tt>-response of the server with the media type “text/html” SHALL be a
    <a href="#w3c-html5">W3C HTML 5</a> document that includes the following
    information in the HTML body:</p><ul id="_1af6c1cc-e3d3-5f80-ab56-21396e5941a1">
    <li>
    <p id="_4bb5d365-58d3-8bb8-1bb3-048b857da361">all information identified in the schemas of the
    <a href="https://github.com/OAI/OpenAPI-Specification/blob/master/versions/3.0.0.md#responseObject">Response Object</a>
    in the HTML <tt>&lt;body/&gt;</tt>, and</p>
    </li>
    <li>
    <p id="_fe849fe6-f129-5819-5981-39aa6e812b4e">all links in HTML <tt>&lt;a/&gt;</tt> elements in the HTML <tt>&lt;body/&gt;</tt>.</p>
    </li>
    </ul></td></tr></tbody></table>
  statement: |-
    <p id="_b5d7fc9d-49ab-ccf9-f20e-4e4bd3816710">Every <tt>200</tt>-response of the server with the media type “text/html” SHALL be a
    <a href="#w3c-html5">W3C HTML 5</a> document that includes the following
    information in the HTML body:</p><ul id="_1af6c1cc-e3d3-5f80-ab56-21396e5941a1">
    <li>
    <p id="_4bb5d365-58d3-8bb8-1bb3-048b857da361">all information identified in the schemas of the
    <a href="https://github.com/OAI/OpenAPI-Specification/blob/master/versions/3.0.0.md#responseObject">Response Object</a>
    in the HTML <tt>&lt;body/&gt;</tt>, and</p>
    </li>
    <li>
    <p id="_fe849fe6-f129-5819-5981-39aa6e812b4e">all links in HTML <tt>&lt;a/&gt;</tt> elements in the HTML <tt>&lt;body/&gt;</tt>.</p>
    </li>
    </ul>
