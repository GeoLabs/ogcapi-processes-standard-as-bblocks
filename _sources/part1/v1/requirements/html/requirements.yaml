  source-uri: /conf/html/content
  source-table-html: |-
    <table class="recommendtest" id="ats_html_content" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTestTitle">Abstract test A.56</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/conf/html/content</p></td></tr><tr><td class="recommend" style="vertical-align:top;">Requirement</td><td class="recommend" style="vertical-align:top;">
    <a href="#req_html_content">/req/html/content</a>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test purpose</td><td class="recommend" style="vertical-align:top;">
    <p id="_3a17845a-e7d0-325e-1082-a60b8b958d1b">Verify the content of an HTML document given an input document and schema.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test method</td><td class="recommend" style="vertical-align:top;"><ol type="1">
    <li>
    <p id="_414d7270-89c8-4b5a-2131-ac0b8c0eff2f">Validate that the document is an <a href="#w3c-html5">W3C HTML 5</a> document</p>
    </li>
    <li><p id="_dfedc9ad-8aa2-1d1b-7ea0-14f2dce5c40d">Manually inspect the document and verify that the HTML body contains:</p>
    <ol type="a">
    <li>
    <p id="_b3f1330f-701a-e24a-c7c3-1285341c80ba">all information in the schemas of the <a href="https://github.com/OAI/OpenAPI-Specification/blob/master/versions/3.0.0.md#responseObject">Response Object</a> in the HTML <tt>&lt;body/&gt;</tt></p>
    </li>
    <li>
    <p id="_413f8f04-e041-2177-882b-9f8170a307d0">all links in HTML <tt>&lt;a/&gt;</tt> elements in the HTML <tt>&lt;body/&gt;</tt>.</p>
    </li>
    </ol>
    </li>
    </ol>
    </td></tr></tbody></table>
  purpose: <p id="_3a17845a-e7d0-325e-1082-a60b8b958d1b">Verify the content of an HTML document given an input document and schema.</p>
  requirement:
