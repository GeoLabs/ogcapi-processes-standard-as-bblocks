    <p id="_8ada1ff4-eba3-87f2-2ada-c5bce3db8447">If the link exists, get the job status as per test <a href="#ats_core_job-op">/conf/core/job-op</a> and ensure that the job status is set to <tt>successful</tt>.</p>
    </li>
    <li>
    <p id="_5379f493-a01d-d2be-e5c8-529e47de2e70">Get the results as per test <a href="#ats_core_job-results-op">/conf/core/job-results</a> and verify that they conform to the test <a href="#ats_core_job-results-async-raw-value-multi">/conf/core/job-results-async-raw-value-multi</a>.</p>
    </li>
    <li>
    <p id="_579f9086-bd91-1d11-a3a1-9b83be22de92">If the link does not exist then verify that the synchronous response conforms to requirement <a href="#req_core_job-creation-sync-raw-value-multi">/req/core/job-creation-sync-raw-value-multi</a>.</p>
    </li>
    </ol>
    </td></tr></tbody></table>
