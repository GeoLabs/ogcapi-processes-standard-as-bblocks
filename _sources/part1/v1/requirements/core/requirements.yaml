  source-table-html: |-
    <table class="recommend" id="rec_core_api_definition-oas" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Recommendation 2</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/rec/core/api-definition-oas</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_ed8890b6-4885-c624-0cdf-114f53d38109">If the API definition document uses the OpenAPI Specification 3.0,
    the document SHOULD conform to the
    <a href="#rc_oas30">OpenAPI Specification 3.0 requirements class</a>.</p></td></tr></tbody></table>
  statement: |-
    <p id="_ed8890b6-4885-c624-0cdf-114f53d38109">If the API definition document uses the OpenAPI Specification 3.0,
    the document SHOULD conform to the
    <a href="#rc_oas30">OpenAPI Specification 3.0 requirements class</a>.</p>
- id: core/problem-details
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/rec/core/problem-details
  type: recommendation
  source-anchor: rec_core_problem-details
  source-label: Recommendation 3
  source-uri: /rec/core/problem-details
  source-table-html: <table class="recommend" id="rec_core_problem-details" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Recommendation 3</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/rec/core/problem-details</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_e4deb5c8-0860-c46a-e09e-12a34f0f1480">A server SHOULD include a “Problem Details” report in an error response in accordance with <a href="https://datatracker.ietf.org/doc/html/rfc7807">RFC 7807</a>.</p></td></tr></tbody></table>
  statement: <p id="_e4deb5c8-0860-c46a-e09e-12a34f0f1480">A server SHOULD include a “Problem Details” report in an error response in accordance with <a href="https://datatracker.ietf.org/doc/html/rfc7807">RFC 7807</a>.</p>
- id: core/cross-origin
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/rec/core/cross-origin
  type: recommendation
  source-anchor: rec_core_cross-origin
  source-label: Recommendation 4
  source-uri: /rec/core/cross-origin
  source-table-html: |-
    <table class="recommend" id="rec_core_cross-origin" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Recommendation 4</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/rec/core/cross-origin</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_617befed-dd6c-ef7f-5e1a-2d69bdf93697">If the server is intended to be accessed from the browser, cross-origin
    requests SHOULD be supported. Note that support can also be added in a
    proxy layer on top of the server.</p></td></tr></tbody></table>
  statement: |-
    <p id="_617befed-dd6c-ef7f-5e1a-2d69bdf93697">If the server is intended to be accessed from the browser, cross-origin
    requests SHOULD be supported. Note that support can also be added in a
    proxy layer on top of the server.</p>
- id: core/access-control-expose-headers
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/rec/core/access-control-expose-headers
  type: recommendation
  source-anchor: rec_core_access-control-expose-headers
  source-label: Recommendation 5
  source-uri: /rec/core/access-control-expose-headers
  source-table-html: <table class="recommend" id="rec_core_access-control-expose-headers" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Recommendation 5</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/rec/core/access-control-expose-headers</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_cf8e7e58-193a-042f-86d8-ada1542bec40">If the server is intended to be accessed from the browser and if Cross-origin resource sharing is supported, the <tt>Access-Control-Expose-Headers</tt> header SHOULD be used and the header SHOULD contain the value <tt>location</tt> to enable the browser to access the <tt>location</tt> header of the response.</p></td></tr></tbody></table>
  statement: <p id="_cf8e7e58-193a-042f-86d8-ada1542bec40">If the server is intended to be accessed from the browser and if Cross-origin resource sharing is supported, the <tt>Access-Control-Expose-Headers</tt> header SHOULD be used and the header SHOULD contain the value <tt>location</tt> to enable the browser to access the <tt>location</tt> header of the response.</p>
- id: core/html
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/rec/core/html
  type: recommendation
  source-anchor: rec_core_html
  source-label: Recommendation 6
  source-uri: /rec/core/html
  source-table-html: |-
    <table class="recommend" id="rec_core_html" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Recommendation 6</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/rec/core/html</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_971c540d-47c6-8c39-1f27-0e3e31532176">To support browsing an implementation of OGC API — Processes with a web browser and to enable search engines to crawl
    and index a process, implementations SHOULD consider to support an HTML encoding.</p></td></tr></tbody></table>
  statement: |-
    <p id="_971c540d-47c6-8c39-1f27-0e3e31532176">To support browsing an implementation of OGC API — Processes with a web browser and to enable search engines to crawl
    and index a process, implementations SHOULD consider to support an HTML encoding.</p>
- id: core/link-header
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/rec/core/link-header
  type: recommendation
  source-anchor: rec_core_link-header
  source-label: Recommendation 7
  source-uri: /rec/core/link-header
  source-table-html: |-
    <table class="recommend" id="rec_core_link-header" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Recommendation 7</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/rec/core/link-header</p></td></tr><tr><td class="recommend" style="vertical-align:top;">A</td><td class="recommend" style="vertical-align:top;"><p id="_aa6ea58c-2e01-ab95-b4a8-0dd35796f59d">Links included in payload of responses SHOULD also be included as <tt>Link</tt> headers in the HTTP response according to <a href="#rfc8288">RFC 8288, Clause 3</a>.</p>
    <p id="_75653621-1af7-5a59-b7ee-102efa1ffef0">This recommendation does not apply, if there are a large number of links included in a response or a link is not known when the HTTP headers of the response are created.</p></td></tr></tbody></table>
  statement: ''
  parts:
  - |-
    <p id="_aa6ea58c-2e01-ab95-b4a8-0dd35796f59d">Links included in payload of responses SHOULD also be included as <tt>Link</tt> headers in the HTTP response according to <a href="#rfc8288">RFC 8288, Clause 3</a>.</p>
    <p id="_75653621-1af7-5a59-b7ee-102efa1ffef0">This recommendation does not apply, if there are a large number of links included in a response or a link is not known when the HTTP headers of the response are created.</p>
