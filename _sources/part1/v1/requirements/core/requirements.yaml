    <p id="_4cf76623-0fec-f3ec-bd9e-bd23ff7c9b5f">Validate that an invalid process identifier is handled correctly.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test method</td><td class="recommend" style="vertical-align:top;"><ol type="1">
    <li>
    <p id="_0a8ff588-6098-8470-8b43-aa5b90140856">Issue an HTTP GET request to a URL that includes the <tt>{processID}</tt> as a path element using a non-existent process identifier.</p>
    </li>
    <li>
    <p id="_8374d162-9299-1174-728d-7e6e7c35975a">Validate that the document was returned with a 404.</p>
    </li>
    <li>
    <p id="_9aaf9f10-d4f7-cebb-a894-0dd372e1085b">Validate that the document contains the exception <tt>type</tt> “http://www.opengis.net/def/exceptions/ogcapi-processes-1/1.0/no-such-process”.</p>
    </li>
    <li>
    <p id="_6353b2b6-69e5-f6d6-9246-bb05d8653ee2">Validate the document for all supported media types using the resources and tests identified in <a href="#no-such-process">Table A.4</a></p>
    </li>
    </ol>
    </td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_2ed155b0-2527-5c0e-a53d-45dd51e5a5fa">An exception response caused by the use of an invalid process identifier may be retrieved in a number of different formats. The following table identifies the applicable schema document for each format and the test to be used to validate the response. All supported formats should be exercised.</p></td></tr></tbody></table>
