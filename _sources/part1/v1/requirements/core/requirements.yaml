    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test purpose</td><td class="recommend" style="vertical-align:top;">
    <p id="_462b7694-a67b-c6d5-baf3-449640d03fde">Validate that the server responds as expected when asynchronous execution is <a href="#sc_execution_mode">negotiated</a>, one output is requested, the response type is <tt>raw</tt> and the output transmission is <tt>value</tt>.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test method</td><td class="recommend" style="vertical-align:top;"><ol type="1">
    <li>
    <p id="_75764180-6b73-1bee-5603-b1051a48d3b3">Get a description of each process offered by the server using test <a href="#ats_core_process">/conf/core/process</a>.</p>
    </li>
    <li>
    <p id="_039211dc-375a-f09a-f3a9-d6b039bd8d7b">Inspect the description of each process and identify the subset of processes that generate at least one output and that support the <tt>async-execute</tt> job control option and the <tt>value</tt> output transmission.</p>
    </li>
    <li>
    <p id="_3b207cf8-92b2-f6b1-0f52-8b7968996557">For each identified process construct an execute request according to test <a href="#ats_core_job-creation-request">/conf/core/job-creation-request</a> ensuring that asynchronous execution is <a href="#sc_execution_mode">negotiated</a> according to test <a href="#ats_core_job-creation-auto-execution-mode">/conf/core/job-creation-auto-execution-mode</a>, that the requested response type is <tt>raw</tt> (i.e. <tt>"response": "raw"</tt>) and that the output transmission is set to <tt>value</tt> (i.e. <tt>"outputTransmission": "value"</tt>) according to requirement <a href="#req_core_job-creation-async-raw-value-one">/req/core/job-creation-async-raw-value-one</a>.</p>
    </li>
    <li>
    <p id="_58954101-88b5-e850-bb0f-207c42998b17">If the server responds asynchronously, periodically retrieve the status of the asynchronously executed job as per test <a href="#ats_core_job-op">/conf/core/job-op</a>.</p>
    </li>
    <li>
    <p id="_9a12913f-6479-072b-454b-d71b183d49d8">When the job status is <tt>successful</tt>, get the results as per test <a href="#ats_core_job-results-op">/conf/core/job-results</a> and verify that they conform to requirement <a href="#req_core_job-results-async-raw-value-one">/req/core/job-results-async-raw-value-one</a>.</p>
    </li>
    </ol>
    </td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><div class="Note" id="_15f56576-402f-ddc9-3a51-8a2a348d714e"><p><span class="note_label">NOTE  1</span>  In the case where a process supports both <tt>async-execute</tt> and <tt>sync-execute</tt> job control options there is a possibility that the server responds synchronously even though the <tt>Prefer</tt> headers asserts a <tt>respond-async</tt> preference.  In this case, the following additional test should be performed.</p></div></td></tr><tr><td class="recommend" style="vertical-align:top;">Test method</td><td class="recommend" style="vertical-align:top;"><ol type="1">
    <li>
    <p id="_66715236-56ce-bdc6-ceb1-43f4e3c9f473">Inspect the headers of the synchronous response and see if a <tt>Link</tt> header is included with <tt>rel=monitor</tt>.</p>
    </li>
    <li>
    <p id="_9856b075-2eff-488c-333c-db2589dc12a0">If the link exists, get the job status as per test <a href="#ats_core_job-op">/conf/core/job-op</a> and ensure that the job status is set to <tt>successful</tt>.</p>
    </li>
    <li>
    <p id="_cd3befe3-cfd0-8b62-d338-57aabd292c9c">Get the results as per test <a href="#ats_core_job-results-op">/conf/core/job-results</a> and verify that they conform to the test <a href="#ats_core_job-results-async-raw-value-multi">/conf/core/job-results-async-raw-value-multi</a>.</p>
    </li>
    <li>
    <p id="_98901c58-4d5d-27f1-cbed-0cb627c7900a">If the link does not exist then verify that the synchronous response conforms to requirement <a href="#req_core_job-creation-sync-raw-value-one">/req/core/job-creation-sync-raw-value-one</a>.</p>
    </li>
    </ol>
    </td></tr></tbody></table>
  purpose: <p id="_462b7694-a67b-c6d5-baf3-449640d03fde">Validate that the server responds as expected when asynchronous execution is <a href="#sc_execution_mode">negotiated</a>, one output is requested, the response type is <tt>raw</tt> and the output transmission is <tt>value</tt>.</p>
