  source-table-html: <table class="recommend" id="per_core_creation-input-inline-bbox" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Permission 6</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/per/core/process-execute-input-inline-bbox</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_d921b9ee-e9b4-21f6-44ae-a6e5c394d7ef">Servers MAY copy the contents of <a href="#bbox-schema">bbox.yaml</a> into another file and adjust the <tt>default</tt> and <tt>enum</tt> values are required.</p></td></tr></tbody></table>
