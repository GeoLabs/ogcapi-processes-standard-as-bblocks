    <div class="Note" id="_dd1d2271-a56d-fde6-0e5b-c88f2c47473f"><p><span class="note_label">NOTE  4</span>  In the case where a process supports both <tt>async-execute</tt> and <tt>sync-execute</tt> job control options there is a possibility that the server responds synchronously even though the <tt>Prefer</tt> headers asserts a <tt>respond-async</tt> preference.  In this case, the following additional test should be performed.</p></div>
