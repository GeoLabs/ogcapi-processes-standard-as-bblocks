    </td></tr><tr><td class="recommend" style="vertical-align:top;">A</td><td class="recommend" style="vertical-align:top;">
    <p id="_8473c621-177e-1566-bfd5-68a64b8db9c8">The server SHALL support process input values encoded as qualified values (<a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/qualifiedValue.yaml">qualifiedValue.yaml</a>).</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">B</td><td class="recommend" style="vertical-align:top;">
    <p id="_a6e133f8-8698-c967-30a4-fdf21884813d">The value of the <tt>value</tt> key SHALL be an <i>object</i> instance of <a href="#input-value-schema">inputValue.yaml</a>.</p>
