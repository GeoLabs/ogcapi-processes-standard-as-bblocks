    <ol type="1">
    <li>
    <p id="_452bcd22-0710-739f-4b21-5d53fed9051e">Create a job as per <a href="#ats_core_job-creation-op">/req/core/job-creation-op</a> but arrange a priori that the job will fail; note the {jobID} assigned to the job.</p>
    </li>
    <li>
    <p id="_9fa5c2eb-5621-ebdd-e4b1-f1e5d56ea69f">Ensure that the failed job will not result in an HTTP error code of 404.</p>
    </li>
    <li>
    <p id="_b74f0fcb-3040-b48b-a2d4-a7b6fcd9142c">Issue an HTTP GET request to the URL ‘/jobs/{jobID}/results’.</p>
    </li>
    <li>
    <p id="_be873506-3022-e787-52c5-e522c690993b">Validate that the document was returned with a HTTP error code (4XX or 5XX).</p>
    </li>
    <li>
    <p id="_51e5e067-c369-e62f-c24c-c90e7b739131">Validate that the document contains an exception <tt>type</tt> that corresponds to the reason the job failed (e.g. InvalidParameterValue for invalid input data).</p>
    </li>
    <li>
    <p id="_2f32e3d2-dd82-fa2e-2825-6b397cf44291">Validate the document for all supported media types using the resources and tests identified in <a href="#job-results-failed-schema">Table A.9</a></p>
    </li>
    </ol>

    <p id="_a8e80134-53c8-4fec-7875-ce1197564a32">The job results page for a job may be retrieved in a number of different formats. The following table identifies the applicable schema document for each format and the test to be used to validate the job results for a failed job against that schema.  All supported formats should be exercised.</p>
published-statements:
- id: core/api-definition-oas
