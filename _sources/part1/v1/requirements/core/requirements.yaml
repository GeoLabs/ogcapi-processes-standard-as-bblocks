    </li>
    <li>
    <p id="_9856b075-2eff-488c-333c-db2589dc12a0">If the link exists, get the job status as per test <a href="#ats_core_job-op">/conf/core/job-op</a> and ensure that the job status is set to <tt>successful</tt>.</p>
