- id: core/job-creation-auto-execution-mode
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/conf/core/job-creation-auto-execution-mode
  source-anchor: ats_core_job-creation-auto-execution-mode
  source-label: Abstract test A.17
  source-uri: /conf/core/job-creation-auto-execution-mode
  source-table-html: |-
    <table class="recommendtest" id="ats_core_job-creation-auto-execution-mode" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTestTitle">Abstract test A.17</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/conf/core/job-creation-auto-execution-mode</p></td></tr><tr><td class="recommend" style="vertical-align:top;">Requirement</td><td class="recommend" style="vertical-align:top;">
    <a href="#req_core_job-creation-op">/req/core/job-creation-op</a>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test purpose</td><td class="recommend" style="vertical-align:top;">
    <p id="_aeb8ac32-5ed4-d95a-8ceb-66bdfb2791d9">Validate that the server correctly handles the execution mode for a process.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test method</td><td class="recommend" style="vertical-align:top;"><ol type="1">
    <li>
    <p id="_eb8c1d46-7036-74dc-25ad-a4506875240f">Get a description of each process offered by the server using test <a href="#ats_core_process">/conf/core/process</a>.</p>
    </li>
    <li>
    <p id="_b592943c-b9bc-919d-6088-fb9bc5ec4c0d">Inspect the description of each process and take note of the job control options for the process.</p>
    </li>
    <li>
    <p id="_68b9f608-171e-03a6-3f90-dc1d27bd88c5">Setting the HTTP <tt>Prefer</tt> header to include the <tt>respond-sync</tt> preference, construct an execute request according to test <a href="#ats_core_job-creation-request">/conf/core/job-creation-request</a>.</p>
    </li>
    <li>
    <p id="_2018c027-2fc6-d572-87c3-a7e319db111d">For processes that are supposed to execute asynchronously according to the <a href="#req_core_job-creation-auto-execution-mode">/req/core/job-creation-auto-execution-mode</a> requirement, verify the successful execution according to the <a href="#ats_core_job-creation-success-async">/conf/core/job-creation-success-async</a> test.</p>
    </li>
    <li>
    <p id="_e7cfbb08-4e0e-3466-1352-67a00e913fac">For processes that are supposed to execute synchronously according to the <a href="#req_core_job-creation-auto-execution-mode">/req/core/job-creation-auto-execution-mode</a> requirement, verify the successful execution according to the <a href="#ats-job-creation-success-sync">relevant requirement based on the combination of execute parameters.</a></p>
    </li>
    <li>
    <p id="_45cb3251-9e35-abe1-1374-4dab266067bc">For processes that may execute either synchronously or asynchronously according to the <a href="#req_core_job-creation-auto-execution-mode">/req/core/job-creation-auto-execution-mode</a> requirement, verify that successful execution according to the <a href="#ats-job-creation-success-sync">relevant requirement based on the combination of execute parameters.</a></p>
    </li>
    </ol>
    </td></tr></tbody></table>
  purpose: <p id="_aeb8ac32-5ed4-d95a-8ceb-66bdfb2791d9">Validate that the server correctly handles the execution mode for a process.</p>
  requirement:
  - ref: /req/core/job-creation-op
    text: <a data-source-href="#req_core_job-creation-op" href="https://docs.ogc.org/is/18-062r2/18-062r2.html#ats_core_job-creation-op" title="Unresolved reference in the published standard; opens its official source context, not an inferred target.">/req/core/job-creation-op</a>
  method: |-
    <ol type="1">
    <li>
    <p id="_eb8c1d46-7036-74dc-25ad-a4506875240f">Get a description of each process offered by the server using test <a href="#ats_core_process">/conf/core/process</a>.</p>
    </li>
    <li>
    <p id="_b592943c-b9bc-919d-6088-fb9bc5ec4c0d">Inspect the description of each process and take note of the job control options for the process.</p>
    </li>
    <li>
    <p id="_68b9f608-171e-03a6-3f90-dc1d27bd88c5">Setting the HTTP <tt>Prefer</tt> header to include the <tt>respond-sync</tt> preference, construct an execute request according to test <a href="#ats_core_job-creation-request">/conf/core/job-creation-request</a>.</p>
    </li>
    <li>
    <p id="_2018c027-2fc6-d572-87c3-a7e319db111d">For processes that are supposed to execute asynchronously according to the <a data-source-href="#req_core_job-creation-auto-execution-mode" href="https://docs.ogc.org/is/18-062r2/18-062r2.html#_9e5cc646-0e24-3fe1-78a3-f44bf7f1a33f" title="Unresolved reference in the published standard; opens its official source context, not an inferred target.">/req/core/job-creation-auto-execution-mode</a> requirement, verify the successful execution according to the <a href="#ats_core_job-creation-success-async">/conf/core/job-creation-success-async</a> test.</p>
    </li>
    <li>
    <p id="_e7cfbb08-4e0e-3466-1352-67a00e913fac">For processes that are supposed to execute synchronously according to the <a data-source-href="#req_core_job-creation-auto-execution-mode" href="https://docs.ogc.org/is/18-062r2/18-062r2.html#_9e5cc646-0e24-3fe1-78a3-f44bf7f1a33f" title="Unresolved reference in the published standard; opens its official source context, not an inferred target.">/req/core/job-creation-auto-execution-mode</a> requirement, verify the successful execution according to the <a href="#ats-job-creation-success-sync">relevant requirement based on the combination of execute parameters.</a></p>
    </li>
    <li>
    <p id="_45cb3251-9e35-abe1-1374-4dab266067bc">For processes that may execute either synchronously or asynchronously according to the <a data-source-href="#req_core_job-creation-auto-execution-mode" href="https://docs.ogc.org/is/18-062r2/18-062r2.html#_9e5cc646-0e24-3fe1-78a3-f44bf7f1a33f" title="Unresolved reference in the published standard; opens its official source context, not an inferred target.">/req/core/job-creation-auto-execution-mode</a> requirement, verify that successful execution according to the <a href="#ats-job-creation-success-sync">relevant requirement based on the combination of execute parameters.</a></p>
    </li>
    </ol>
