    </ol>
    </td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><div class="Note" id="_b7d3e8a4-8542-d593-b1fd-1bd8dc51fa21"><p><span class="note_label">NOTE  2</span>  In the case where a process supports both <tt>async-execute</tt> and <tt>sync-execute</tt> job control options there is a possibility that the server responds synchronously even though the <tt>Prefer</tt> headers asserts a <tt>respond-async</tt> preference.  In this case, the following additional test should be performed.</p></div></td></tr><tr><td class="recommend" style="vertical-align:top;">Test method</td><td class="recommend" style="vertical-align:top;"><ol type="1">
    <li>
    <p id="_02b2110c-f6f4-410e-095b-8882b67d25fc">Inspect the headers of the synchronous response and see if a <tt>Link</tt> header is included with <tt>rel=monitor</tt>.</p>
