  source-table-html: |-
    <table class="recommendtest" id="ats_core_job-results-exception-no-such-job" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTestTitle">Abstract test A.45</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/conf/core/job-results-failed</p></td></tr><tr><td class="recommend" style="vertical-align:top;">Requirement</td><td class="recommend" style="vertical-align:top;">
    <a href="#req_core_job-results-exception_no-such-job">/req/core/job-results-exception-no-such-job</a>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test purpose</td><td class="recommend" style="vertical-align:top;">
    <p id="_62e4fb34-4259-6f42-0364-511e0fc834b1">Validate that the job results retrieved using an invalid job identifier complies with the require structure and contents.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test method</td><td class="recommend" style="vertical-align:top;"><ol type="1">
    <li>
    <p id="_c2a48347-e7a2-f91e-c4f0-a04f3fca85f7">Issue an HTTP GET request to the URL ‘/jobs/{jobID}/results’ using an invalid {jobID}.</p>
    </li>
    <li>
    <p id="_47aa95c7-c987-fc6b-3b19-e18c5cff0aea">Validate that the document was returned with a 404.</p>
    </li>
    <li>
    <p id="_02bc3676-fe7d-07e2-e286-56e762745ac3">Validate that the document contains the exception type “http://www.opengis.net/def/exceptions/ogcapi-processes-1/1.0/no-such-job”.</p>
    </li>
    <li>
    <p id="_e22b85b3-a49f-498c-fcf3-09a2d7963eba">Validate the document for all supported media types using the resources and tests identified in <a href="#job-results-exception-no-such-job">Table A.7</a></p>
    </li>
    </ol>
    </td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_d6d96565-e693-3f06-bf20-6dd3935c24c2">The job results page for a job may be retrieved in a number of different formats. The following table identifies the applicable schema document for each format and the test to be used to validate the job results for a non-existent job against that schema.  All supported formats should be exercised.</p></td></tr></tbody></table>
  purpose: <p id="_62e4fb34-4259-6f42-0364-511e0fc834b1">Validate that the job results retrieved using an invalid job identifier complies with the require structure and contents.</p>
  requirement:
  - ref: /req/core/job-results-exception-no-such-job
    text: <a href="#req_core_job-results-exception_no-such-job">/req/core/job-results-exception-no-such-job</a>
  method: |-
    <ol type="1">
    <li>
    <p id="_c2a48347-e7a2-f91e-c4f0-a04f3fca85f7">Issue an HTTP GET request to the URL ‘/jobs/{jobID}/results’ using an invalid {jobID}.</p>
    </li>
    <li>
    <p id="_47aa95c7-c987-fc6b-3b19-e18c5cff0aea">Validate that the document was returned with a 404.</p>
    </li>
