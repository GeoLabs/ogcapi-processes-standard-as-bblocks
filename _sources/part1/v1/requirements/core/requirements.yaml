    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test purpose</td><td class="recommend" style="vertical-align:top;">
    <p id="_2d4bac66-7e77-92d0-55cc-7a9dbb6d9b59">Verify that the server correctly validates process input values according to the definition obtained from the <a href="#sc_process_description">process description</a>.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test method</td><td class="recommend" style="vertical-align:top;"><ol type="1">
    <li>
    <p id="_6a301001-343c-5b49-6c3a-3bbfff3a3652">Get a description of each process offered by the server using test <a href="#ats_core_process">/conf/core/process</a>.</p>
    </li>
    <li>
    <p id="_12adeded-2575-7eab-ba94-62ea67e8c609">Inspect the description of each process taking note of the definition of each process input and specifically the schema of each process input.</p>
    </li>
    <li>
    <p id="_b3c3b437-b9ee-7e7f-9467-e38fec5c5936">For each process construct an execute request according to test <a href="#ats_core_job-creation-request">/conf/core/job-creation-request</a> taking care to encode the input values according to the schema from the definition of each input.</p>
    </li>
    <li>
    <p id="_a1402b40-e09d-263c-57c2-79eb4d43749f">Verify that each process executes successfully according to the <a href="#ats-job-creation-success-sync">relevant requirement based on the combination of execute parameters.</a></p>
    </li>
    <li>
    <p id="_fcba39b2-e35a-cfd3-7f56-f7f2d727287b">For each process construct an execute request according to test <a href="#ats_core_job-creation-request">/conf/core/job-creation-request</a> taking care to encode some of the input values in violation of the schema from the definition of the selected input.</p>
    </li>
    <li>
    <p id="_dd0755b9-af22-498e-c085-9a6d4a6c60dd">Verify that each process generates an exception report that identifies the improperly specified input value(s).</p>
    </li>
    </ol>
    </td></tr></tbody></table>
