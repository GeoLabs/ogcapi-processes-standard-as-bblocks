    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test purpose</td><td class="recommend" style="vertical-align:top;">
    <p id="_17a7546a-9b5b-e2bd-da5b-57a5992fbb76">Validate that the server responds as expected when asynchronous execution is <a href="#sc_execution_mode">negotiated</a>, more than one output is requested, the response type is <tt>raw</tt> and the output transmission is a mix of <tt>value</tt> and <tt>reference</tt>.</p>
