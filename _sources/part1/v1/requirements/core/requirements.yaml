  type: requirement
  source-anchor: req_core_job-results-exception_no-such-job
  source-label: Requirement 44
  source-uri: /req/core/job-results-exception/no-such-job
  source-table-html: |-
    <table class="recommend" id="req_core_job-results-exception_no-such-job" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 44</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/core/job-results-exception/no-such-job</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_49ee0bd9-dd5d-ef96-7089-f0fe8534f79f">If the operation is executed using an invalid job identifier, the response SHALL have HTTP status code 404.
    The content of that response SHALL be based upon the OpenAPI
    3.0 schema <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/exception.yaml">exception.yaml</a>.
    The <tt>type</tt> of the exception SHALL be “http://www.opengis.net/def/exceptions/ogcapi-processes-1/1.0/no-such-job”.</p></td></tr></tbody></table>
  statement: |-
    <p id="_49ee0bd9-dd5d-ef96-7089-f0fe8534f79f">If the operation is executed using an invalid job identifier, the response SHALL have HTTP status code 404.
    The content of that response SHALL be based upon the OpenAPI
    3.0 schema <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/exception.yaml">exception.yaml</a>.
    The <tt>type</tt> of the exception SHALL be “http://www.opengis.net/def/exceptions/ogcapi-processes-1/1.0/no-such-job”.</p>
- id: core/job-results-exception/results-not-ready
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/req/core/job-results-exception/results-not-ready
  type: requirement
  source-anchor: req_core_job-results-exception_results-not-ready
  source-label: Requirement 45
  source-uri: /req/core/job-results-exception/results-not-ready
  source-table-html: |-
    <table class="recommend" id="req_core_job-results-exception_results-not-ready" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 45</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/core/job-results-exception/results-not-ready</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_cacc9b04-6861-472c-d5ea-8b2cf13fe546">If the operation is executed on a running job with a valid job identifier, the response SHALL have HTTP status code 404.
    The content of that response SHALL be based upon the OpenAPI
    3.0 schema <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/exception.yaml">exception.yaml</a>.
    The <tt>type</tt> of the exception SHALL be “http://www.opengis.net/def/exceptions/ogcapi-processes-1/1.0/result-not-ready”.</p></td></tr></tbody></table>
  statement: |-
    <p id="_cacc9b04-6861-472c-d5ea-8b2cf13fe546">If the operation is executed on a running job with a valid job identifier, the response SHALL have HTTP status code 404.
    The content of that response SHALL be based upon the OpenAPI
    3.0 schema <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/exception.yaml">exception.yaml</a>.
    The <tt>type</tt> of the exception SHALL be “http://www.opengis.net/def/exceptions/ogcapi-processes-1/1.0/result-not-ready”.</p>
- id: core/job-results-failed
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/req/core/job-results-failed
  type: requirement
  source-anchor: req_core_job-results-failed
  source-label: Requirement 46
  source-uri: /req/core/job-results-failed
  source-table-html: |-
    <table class="recommend" id="req_core_job-results-failed" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 46</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/core/job-results-failed</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_28514064-b9f8-d879-0c79-7455e470f9da">If the operation is executed on a failed job using a valid job identifier, the response SHALL have a HTTP error code that corresponds to the reason of the failure.
    The content of that response SHALL be based upon the OpenAPI
    3.0 schema <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/exception.yaml">exception.yaml</a>.
    The <tt>type</tt> of the exception SHALL correspond to the reason of the failure, e.g. InvalidParameterValue for invalid input data.</p></td></tr></tbody></table>
  statement: |-
    <p id="_28514064-b9f8-d879-0c79-7455e470f9da">If the operation is executed on a failed job using a valid job identifier, the response SHALL have a HTTP error code that corresponds to the reason of the failure.
    The content of that response SHALL be based upon the OpenAPI
    3.0 schema <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/exception.yaml">exception.yaml</a>.
    The <tt>type</tt> of the exception SHALL correspond to the reason of the failure, e.g. InvalidParameterValue for invalid input data.</p>
