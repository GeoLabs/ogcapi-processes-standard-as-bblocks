    <ol type="1">
    <li>
    <p id="_cfd18dd6-35b9-d4e0-c7f5-285b8666ca40">Inspect the headers of the synchronous response and see if a <tt>Link</tt> header is included with <tt>rel=monitor</tt>.</p>
    </li>
    <li>
    <p id="_6775606a-be17-0e99-1893-3cb13928c581">If the link exists, get the job status as per test <a href="#ats_core_job-op">/conf/cor e/job-op</a> and ensure that the job status is set to <tt>successful</tt>.</p>
    </li>
    <li>
    <p id="_ced0ffac-36d2-549a-1331-7b16d78c6448">Get the results as per test <a href="#ats_core_job-results-op">/conf/core/job-results</a> and verify that they conform to the test <a href="#ats_core_job-results-async-document">/conf/core/job-results-async-document</a>.</p>
    </li>
    <li>
    <p id="_a2b481c6-88b4-583c-60ac-048dc66d727e">If the link does not exist then verify that the synchronous response conforms to the requirement <a data-source-href="#req_core_job-creation-sync-document" href="https://docs.ogc.org/is/18-062r2/18-062r2.html#_89d14442-31b3-e5a3-5464-a43b883e3c4a" title="Unresolved reference in the published standard; opens its official source context, not an inferred target.">/req/core/job-creation-sync-documen</a>.</p>
    </li>
    </ol>
- id: core/job-results-failed
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/conf/core/job-results-failed
