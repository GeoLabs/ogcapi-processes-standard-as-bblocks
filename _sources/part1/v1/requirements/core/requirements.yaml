    <li>
    <p id="_9a12913f-6479-072b-454b-d71b183d49d8">When the job status is <tt>successful</tt>, get the results as per test <a href="#ats_core_job-results-op">/conf/core/job-results</a> and verify that they conform to requirement <a href="#req_core_job-results-async-raw-value-one">/req/core/job-results-async-raw-value-one</a>.</p>
    </li>
    </ol>
    <div class="Note" id="_15f56576-402f-ddc9-3a51-8a2a348d714e"><p><span class="note_label">NOTE  1</span>  In the case where a process supports both <tt>async-execute</tt> and <tt>sync-execute</tt> job control options there is a possibility that the server responds synchronously even though the <tt>Prefer</tt> headers asserts a <tt>respond-async</tt> preference.  In this case, the following additional test should be performed.</p></div>
