    </li>
    <li>
    <p id="_9003be0f-6a60-98a2-b0a3-555552a96874">For each identified process construct an execute request according to test <a href="#ats_core_job-creation-request">/conf/core/job-creation-request</a> ensuring that asynchronous execution is <a href="#sc_execution_mode">negotiated</a> according to test <a href="#ats_core_job-creation-auto-execution-mode">/conf/core/job-creation-auto-execution-mode</a>, that the requested response type is <tt>raw</tt> (i.e. <tt>"response": "raw"</tt>) and that the output transmission is set to <tt>value</tt> (i.e. <tt>"outputTransmission": "value"</tt>) according to requirement <a href="#req_core_job-creation-async-raw-value-multi">/req/core/job-creation-async-raw-value-multi</a>.</p>
