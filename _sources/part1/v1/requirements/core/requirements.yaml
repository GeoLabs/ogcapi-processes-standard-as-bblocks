  source-uri: /rec/core/next-1
  source-table-html: |-
    <table class="recommend" id="rec_core_next-1" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Recommendation 8</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/rec/core/next-1</p></td></tr><tr><td class="recommend" style="vertical-align:top;">A</td><td class="recommend" style="vertical-align:top;">
    <p id="_f8f53dbb-7a10-54ea-7232-41da09bd1645">A <tt>200</tt>-response SHOULD include a link to the next page (relation: <tt>next</tt>) of process summaries, if more process summaries have been selected than returned in the response.</p>
    </td></tr></tbody></table>
  statement: ''
  parts:
  - '<p id="_f8f53dbb-7a10-54ea-7232-41da09bd1645">A <tt>200</tt>-response SHOULD include a link to the next page (relation: <tt>next</tt>) of process summaries, if more process summaries have been selected than returned in the response.</p>'
- id: core/next-2
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/rec/core/next-2
  type: recommendation
  source-anchor: rec_core_next-2
  source-label: Recommendation 9
  source-uri: /rec/core/next-2
  source-table-html: |-
    <table class="recommend" id="rec_core_next-2" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Recommendation 9</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/rec/core/next-2</p></td></tr><tr><td class="recommend" style="vertical-align:top;">A</td><td class="recommend" style="vertical-align:top;">
    <p id="_9a7139b1-3afb-6d9a-fd5a-55f4a7af66c3">Dereferencing a next page link (relation: <tt>next</tt>) SHOULD return additional process summaries from the set of selected process summaries that have not yet been returned.</p>
    </td></tr></tbody></table>
  statement: ''
  parts:
  - '<p id="_9a7139b1-3afb-6d9a-fd5a-55f4a7af66c3">Dereferencing a next page link (relation: <tt>next</tt>) SHOULD return additional process summaries from the set of selected process summaries that have not yet been returned.</p>'
- id: core/next-3
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/rec/core/next-3
  type: recommendation
  source-anchor: rec_core_next-3
  source-label: Recommendation 10
  source-uri: /rec/core/next-3
  source-table-html: |-
    <table class="recommend" id="rec_core_next-3" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Recommendation 10</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/rec/core/next-3</p></td></tr><tr><td class="recommend" style="vertical-align:top;">A</td><td class="recommend" style="vertical-align:top;">
    <p id="_3dad80a2-2c0e-6b00-d44e-18be2117501c">The number of process summaries in a response to dereferencing a next page link (relation: <tt>next</tt>) SHOULD follow the same rules as for the response to the original query and again include a next page link (relation: <tt>next</tt>), if there are more process summaries in the selection that have not yet been returned.</p>
    </td></tr></tbody></table>
  statement: ''
  parts:
  - '<p id="_3dad80a2-2c0e-6b00-d44e-18be2117501c">The number of process summaries in a response to dereferencing a next page link (relation: <tt>next</tt>) SHOULD follow the same rules as for the response to the original query and again include a next page link (relation: <tt>next</tt>), if there are more process summaries in the selection that have not yet been returned.</p>'
- id: core/ogc-process-description
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/rec/core/ogc-process-description
  type: recommendation
  source-anchor: rec_core_ogc-process-description
  source-label: Recommendation 11
  source-uri: /rec/core/ogc-process-description
  source-table-html: <table class="recommend" id="rec_core_ogc-process-description" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Recommendation 11</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/rec/core/ogc-process-description</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_051dc2f8-d821-e5c5-9ba3-41bd39666456">Implementations SHOULD consider supporting the <a href="#ogc_process_description">OGC process description</a>.</p></td></tr></tbody></table>
  statement: <p id="_051dc2f8-d821-e5c5-9ba3-41bd39666456">Implementations SHOULD consider supporting the <a href="#ogc_process_description">OGC process description</a>.</p>
- id: core/process-execute-honor-prefer
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/rec/core/process-execute-honor-prefer
  type: recommendation
  source-anchor: rec_core_process-execute-honor-prefer
  source-label: Recommendation 12
  source-uri: /rec/core/process-execute-honor-prefer
  source-table-html: |-
    <table class="recommend" id="rec_core_process-execute-honor-prefer" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Recommendation 12</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/rec/core/process-execute-honor-prefer</p></td></tr><tr><td class="recommend" style="vertical-align:top;">A</td><td class="recommend" style="vertical-align:top;">
    <p id="_b17d5814-714e-88f1-fac9-19bd833cb84a">If an execute request is accompanied with the HTTP <a href="https://datatracker.ietf.org/doc/html/rfc7240#section-2"><tt>Prefer</tt></a> header asserting a <a href="https://tools.ietf.org/html/rfc7240#section-4.1"><tt>respond-async</tt></a> preference, then the server SHOULD honor that preference and response asynchronously if, according to the job control options in the <a href="#sc_process_description">process description</a>, the process can be executed asynchronously.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">B</td><td class="recommend" style="vertical-align:top;">
    <p id="_5a57370f-28bb-2104-ccb3-89c690bedd83">If an execute request is accompanied with the HTTP <a href="https://datatracker.ietf.org/doc/html/rfc7240#section-2"><tt>Prefer</tt></a> header asserting a <a href="https://tools.ietf.org/html/rfc7240#section-4.3"><tt>wait</tt></a> preference, then the server SHOULD honor that preference in the decision to execute the process asynchronously if, according to the job control options in the <a href="#sc_process_description">process description</a>, the process can be executed asynchronously.</p>
    </td></tr></tbody></table>
  statement: ''
  parts:
  - <p id="_b17d5814-714e-88f1-fac9-19bd833cb84a">If an execute request is accompanied with the HTTP <a href="https://datatracker.ietf.org/doc/html/rfc7240#section-2"><tt>Prefer</tt></a> header asserting a <a href="https://tools.ietf.org/html/rfc7240#section-4.1"><tt>respond-async</tt></a> preference, then the server SHOULD honor that preference and response asynchronously if, according to the job control options in the <a href="#sc_process_description">process description</a>, the process can be executed asynchronously.</p>
  - <p id="_5a57370f-28bb-2104-ccb3-89c690bedd83">If an execute request is accompanied with the HTTP <a href="https://datatracker.ietf.org/doc/html/rfc7240#section-2"><tt>Prefer</tt></a> header asserting a <a href="https://tools.ietf.org/html/rfc7240#section-4.3"><tt>wait</tt></a> preference, then the server SHOULD honor that preference in the decision to execute the process asynchronously if, according to the job control options in the <a href="#sc_process_description">process description</a>, the process can be executed asynchronously.</p>
- id: core/process-execute-handle-prefer
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/rec/core/process-execute-handle-prefer
  type: recommendation
  source-anchor: rec_core_process-execute-handle-prefer
  source-label: Recommendation 13
  source-uri: /rec/core/process-execute-handle-prefer
  source-table-html: <table class="recommend" id="rec_core_process-execute-handle-prefer" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Recommendation 13</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/rec/core/process-execute-handle-prefer</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_0f792e89-235d-c807-0b27-813d6b7f7fd4">A client that accompanies an execute request with the HTTP <a href="https://datatracker.ietf.org/doc/html/rfc7240#section-2"><tt>Prefer</tt></a> header asserting a <a href="https://tools.ietf.org/html/rfc7240#section-4.1"><tt>respond-async</tt></a> preference and/or a <a href="https://tools.ietf.org/html/rfc7240#section-4.3"><tt>wait</tt></a> preference SHOULD be prepared to receive either an asynchronous or a synchronous response.</p></td></tr></tbody></table>
  statement: <p id="_0f792e89-235d-c807-0b27-813d6b7f7fd4">A client that accompanies an execute request with the HTTP <a href="https://datatracker.ietf.org/doc/html/rfc7240#section-2"><tt>Prefer</tt></a> header asserting a <a href="https://tools.ietf.org/html/rfc7240#section-4.1"><tt>respond-async</tt></a> preference and/or a <a href="https://tools.ietf.org/html/rfc7240#section-4.3"><tt>wait</tt></a> preference SHOULD be prepared to receive either an asynchronous or a synchronous response.</p>
- id: core/process-execute-preference-applied
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/rec/core/process-execute-preference-applied
  type: recommendation
  source-anchor: rec_core_process-execute-preference-applied
  source-label: Recommendation 14
  source-uri: /rec/core/process-execute-preference-applied
  source-table-html: <table class="recommend" id="rec_core_process-execute-preference-applied" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Recommendation 14</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/rec/core/process-execute-preference-applied</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_1daed5f5-d51b-bcc3-703f-c4287ec28536">If an execute request is accompanied with the HTTP <a href="https://datatracker.ietf.org/doc/html/rfc7240#section-2"><tt>Prefer</tt></a> header then, in the <a href="#sc_execute_response">response</a>, servers SHOULD include the HTTP <a href="https://datatracker.ietf.org/doc/html/rfc7240#section-3"><tt>Preference-Applied</tt></a> response header as an indication as to which <a href="https://datatracker.ietf.org/doc/html/rfc7240#section-2">‘Prefer`</a>
    tokens were honoured by the server.</p></td></tr></tbody></table>
  statement: <p id="_1daed5f5-d51b-bcc3-703f-c4287ec28536">If an execute request is accompanied with the HTTP <a href="https://datatracker.ietf.org/doc/html/rfc7240#section-2"><tt>Prefer</tt></a> header then, in the <a href="#sc_execute_response">response</a>, servers SHOULD include the HTTP <a href="https://datatracker.ietf.org/doc/html/rfc7240#section-3"><tt>Preference-Applied</tt></a> response header as an indication as to which <a href="https://datatracker.ietf.org/doc/html/rfc7240#section-2">‘Prefer`</a> tokens were honoured by the server.</p>
- id: core/process-execute-sync-document-ref
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/rec/core/process-execute-sync-document-ref
  type: recommendation
  source-anchor: rec_core_process-execute-sync-document-ref
  source-label: Recommendation 15
  source-uri: /rec/core/process-execute-sync-document-ref
  source-table-html: |-
    <table class="recommend" id="rec_core_process-execute-sync-document-ref" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Recommendation 15</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/rec/core/process-execute-sync-document-ref</p></td></tr><tr><td class="recommend" style="vertical-align:top;">Conditions</td><td class="recommend" style="vertical-align:top;">
    <ol id="_123fc16d-1bda-cb4f-5dec-73b476a98e45" type="1">
    <li>
    <p id="_babc670f-0ed9-da89-50e4-6861d8e6750a">The <a href="#sc_execution_mode">negotiated execution mode</a> is synchronous, <tt>response=document</tt>, <tt>transmissionMode=reference</tt></p>
    </li>
    <li>
    <p id="_8658163a-f1d1-2ed3-b3f5-6975e548fcb6">The number of outputs requested is 1 or more.</p>
    </li>
    <li>
    <p id="_67126855-767a-030b-82ac-2e67c366eb30">The requested output value is a simple scalar value.</p>
    </li>
    </ol>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">A</td><td class="recommend" style="vertical-align:top;">
    <p id="_275c26a8-c9c9-a81a-6ff7-778dfd15b090">For a simple scalar values servers SHOULD consider supporting links to <tt>text/plain</tt> files that contain the output values.</p>
    </td></tr></tbody></table>
  condition: |-
    <ol id="_123fc16d-1bda-cb4f-5dec-73b476a98e45" type="1">
    <li>
    <p id="_babc670f-0ed9-da89-50e4-6861d8e6750a">The <a href="#sc_execution_mode">negotiated execution mode</a> is synchronous, <tt>response=document</tt>, <tt>transmissionMode=reference</tt></p>
    </li>
    <li>
    <p id="_8658163a-f1d1-2ed3-b3f5-6975e548fcb6">The number of outputs requested is 1 or more.</p>
    </li>
    <li>
    <p id="_67126855-767a-030b-82ac-2e67c366eb30">The requested output value is a simple scalar value.</p>
    </li>
    </ol>
  statement: ''
  parts:
  - <p id="_275c26a8-c9c9-a81a-6ff7-778dfd15b090">For a simple scalar values servers SHOULD consider supporting links to <tt>text/plain</tt> files that contain the output values.</p>
- id: core/job-status
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/rec/core/job-status
  type: recommendation
  source-anchor: rec_core_job-status
  source-label: Recommendation 16
  source-uri: /rec/core/job-status
  source-table-html: |-
    <table class="recommend" id="rec_core_job-status" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Recommendation 16</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/rec/core/job-status</p></td></tr><tr><td class="recommend" style="vertical-align:top;">A</td><td class="recommend" style="vertical-align:top;">
    <p id="_19088dd3-1f0e-e7e3-c1a7-4df578d1e7d6">Servers SHOULD set the value of the <tt>processID</tt> field if it is known.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">B</td><td class="recommend" style="vertical-align:top;">
    <p id="_246faba0-46d5-ebf0-8341-48424ea2813e">Servers SHOULD set the value of the <tt>created</tt> field when a job has been accepted and queued for execution.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">C</td><td class="recommend" style="vertical-align:top;">
    <p id="_53d27122-b859-1483-0b77-47bff4ffec0a">Servers SHOULD set the value of the <tt>started</tt> field when a job begins execution and is consuming compute resources.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">D</td><td class="recommend" style="vertical-align:top;">
    <p id="_080980d0-b4ba-b813-57da-e5c52b8c352c">Servers SHOULD set the value of the <tt>finished</tt> field when the execution of a job has completed and the process is no longer consuming compute resources.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">E</td><td class="recommend" style="vertical-align:top;">
    <p id="_01623c38-101d-f3d5-fa79-88c6d24c7564">Whenever the <tt>status</tt> field of the job changes, servers SHOULD revise the value of the <tt>updated</tt> field.</p>
    </td></tr></tbody></table>
  statement: ''
  parts:
  - <p id="_19088dd3-1f0e-e7e3-c1a7-4df578d1e7d6">Servers SHOULD set the value of the <tt>processID</tt> field if it is known.</p>
  - <p id="_246faba0-46d5-ebf0-8341-48424ea2813e">Servers SHOULD set the value of the <tt>created</tt> field when a job has been accepted and queued for execution.</p>
  - <p id="_53d27122-b859-1483-0b77-47bff4ffec0a">Servers SHOULD set the value of the <tt>started</tt> field when a job begins execution and is consuming compute resources.</p>
  - <p id="_080980d0-b4ba-b813-57da-e5c52b8c352c">Servers SHOULD set the value of the <tt>finished</tt> field when the execution of a job has completed and the process is no longer consuming compute resources.</p>
  - <p id="_01623c38-101d-f3d5-fa79-88c6d24c7564">Whenever the <tt>status</tt> field of the job changes, servers SHOULD revise the value of the <tt>updated</tt> field.</p>
