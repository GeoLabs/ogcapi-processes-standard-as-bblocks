    <li>
    <p id="_ba533f6f-7d52-9809-a9bf-4c704d9f9657">When the job status is <tt>successful</tt>, get the results as per test <a href="#ats_core_job-results-op">/conf/core/job-results</a> and verify that they conform to requirement <a href="#req_core_job-results-async-raw-value-multi">/conf/core/job-results-async-raw-value-multi</a>.</p>
