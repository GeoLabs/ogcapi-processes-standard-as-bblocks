  - <p id="_a6e133f8-8698-c967-30a4-fdf21884813d">The value of the <tt>value</tt> key SHALL be an <i>object</i> instance of <a href="#input-value-schema">inputValue.yaml</a>.</p>
- id: core/process-execute-input-mixed-type
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/req/core/process-execute-input-mixed-type
  type: requirement
  source-anchor: req_core_process-execute-input-inline-mixed
  source-label: Requirement 21
  source-uri: /req/core/process-execute-input-mixed-type
  source-table-html: |-
    <table class="recommend" id="req_core_process-execute-input-inline-mixed" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 21</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/core/process-execute-input-mixed-type</p></td></tr><tr><td class="recommend" style="vertical-align:top;">Conditions</td><td class="recommend" style="vertical-align:top;">
    <ol id="_6c874945-6308-68e5-78db-1f6686054ebf" type="1">
    <li>
    <p id="_727a9a33-1026-12e0-7287-4ff5a4e2f554">The process input value is specified in-line in an execute request.</p>
    </li>
    <li>
    <p id="_fbde1c12-e622-d804-d0bd-7bb027fc0197">The schema of the process input from the <a href="#sc_process_description">process description</a> indicates that a value instance can be one of multiple input media types.<br/>
    In JSON Schema this is denoted by the use of the <tt>oneOf</tt> construct.</p>
    </li>
    </ol>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">A</td><td class="recommend" style="vertical-align:top;">
    <p id="_54bac9b6-1e34-b28e-c1f5-99ab633aa221">The server SHALL support process input values encoded as qualified values (<a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/qualifiedValue.yaml">qualifiedValue.yaml</a>).</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">B</td><td class="recommend" style="vertical-align:top;">
    <p id="_3c1066a8-493e-7e4c-8955-82f87798a2d1">The value of the <tt>value</tt> key SHALL be an instance of <a href="#input-value-schema">inputValue.yaml</a>.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">C</td><td class="recommend" style="vertical-align:top;">
    <p id="_1590e208-fbdd-30a4-78ed-5c37f99d6cda">The <tt>format</tt> parameter of the qualified value (<a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/qualifiedValue.yaml">qualifiedValue.yaml</a>) SHALL be used to indicate, for this value instance, the specific input type selected from the list of type choices defined by the input value’s schema from the <a href="#sc_process_description">process description</a>.</p>
    </td></tr></tbody></table>
  condition: |-
    <ol id="_6c874945-6308-68e5-78db-1f6686054ebf" type="1">
    <li>
    <p id="_727a9a33-1026-12e0-7287-4ff5a4e2f554">The process input value is specified in-line in an execute request.</p>
    </li>
    <li>
    <p id="_fbde1c12-e622-d804-d0bd-7bb027fc0197">The schema of the process input from the <a href="#sc_process_description">process description</a> indicates that a value instance can be one of multiple input media types.<br/>
    In JSON Schema this is denoted by the use of the <tt>oneOf</tt> construct.</p>
    </li>
    </ol>
  statement: ''
  parts:
  - <p id="_54bac9b6-1e34-b28e-c1f5-99ab633aa221">The server SHALL support process input values encoded as qualified values (<a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/qualifiedValue.yaml">qualifiedValue.yaml</a>).</p>
  - <p id="_3c1066a8-493e-7e4c-8955-82f87798a2d1">The value of the <tt>value</tt> key SHALL be an instance of <a href="#input-value-schema">inputValue.yaml</a>.</p>
  - <p id="_1590e208-fbdd-30a4-78ed-5c37f99d6cda">The <tt>format</tt> parameter of the qualified value (<a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/qualifiedValue.yaml">qualifiedValue.yaml</a>) SHALL be used to indicate, for this value instance, the specific input type selected from the list of type choices defined by the input value’s schema from the <a href="#sc_process_description">process description</a>.</p>
