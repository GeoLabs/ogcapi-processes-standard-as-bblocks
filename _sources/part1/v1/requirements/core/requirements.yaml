  source-table-html: |-
    <table class="recommend" id="req_core_process-execute-sync-raw-value-one" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 28</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/core/process-execute-sync-raw-value-one</p></td></tr><tr><td class="recommend" style="vertical-align:top;">Conditions</td><td class="recommend" style="vertical-align:top;">
    <ol id="_95a7dc90-14b8-b149-cb46-1b1992cd9bf8" type="1">
    <li>
    <p id="_037d42b0-13d5-a60a-2523-6fb87c526e87">The <a href="#sc_execution_mode">negotiated execution mode</a> is synchronous, <tt>response=raw</tt>, <tt>transmissionMode=value</tt></p>
    </li>
    <li>
    <p id="_bbfa9331-65c0-6df9-76d0-afdb321be6d0">The number of requested outputs is 1.</p>
    </li>
    </ol>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">A</td><td class="recommend" style="vertical-align:top;">
    <p id="_ac63f948-a958-c6f0-3de2-e84b9a30d246">The server SHALL respond with an HTTP status code of 200.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">B</td><td class="recommend" style="vertical-align:top;">
    <p id="_7d2c6bd7-91b8-ccef-690c-62e59819ec56">The media type of the response SHALL be as specified by the output definition from the <a href="#sc_process_description">process description</a>.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">C</td><td class="recommend" style="vertical-align:top;">
    <p id="_1f8a727e-b877-b6c5-9352-5fd40e372ba7">The content of response SHALL be the requested process output in the requested output format.</p>
    </td></tr></tbody></table>
  condition: |-
    <ol id="_95a7dc90-14b8-b149-cb46-1b1992cd9bf8" type="1">
    <li>
    <p id="_037d42b0-13d5-a60a-2523-6fb87c526e87">The <a href="#sc_execution_mode">negotiated execution mode</a> is synchronous, <tt>response=raw</tt>, <tt>transmissionMode=value</tt></p>
    </li>
    <li>
    <p id="_bbfa9331-65c0-6df9-76d0-afdb321be6d0">The number of requested outputs is 1.</p>
    </li>
    </ol>
  statement: ''
  parts:
  - <p id="_ac63f948-a958-c6f0-3de2-e84b9a30d246">The server SHALL respond with an HTTP status code of 200.</p>
  - <p id="_7d2c6bd7-91b8-ccef-690c-62e59819ec56">The media type of the response SHALL be as specified by the output definition from the <a href="#sc_process_description">process description</a>.</p>
  - <p id="_1f8a727e-b877-b6c5-9352-5fd40e372ba7">The content of response SHALL be the requested process output in the requested output format.</p>
- id: core/process-execute-sync-raw-value-multi
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/req/core/process-execute-sync-raw-value-multi
  type: requirement
  source-anchor: req_core_process-execute-sync-raw-value-multi
  source-label: Requirement 29
  source-uri: /req/core/process-execute-sync-raw-value-multi
  source-table-html: |-
    <table class="recommend" id="req_core_process-execute-sync-raw-value-multi" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 29</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/core/process-execute-sync-raw-value-multi</p></td></tr><tr><td class="recommend" style="vertical-align:top;">Conditions</td><td class="recommend" style="vertical-align:top;">
    <ol id="_041498a1-bda9-cb31-46dd-0836c63e8e88" type="1">
    <li>
    <p id="_e28b2df3-2575-c5e0-aa4a-67a0020e15ea">The <a href="#sc_execution_mode">negotiated execution mode</a> is synchronous, <tt>response=raw</tt>, <tt>transmissionMode=value</tt></p>
    </li>
    <li>
    <p id="_111ac4f3-9690-6bbe-d75e-facdfad8197a">The number of requested outputs is greater than 1.</p>
    </li>
