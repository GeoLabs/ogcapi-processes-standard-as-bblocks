    </td></tr><tr><td class="recommend" style="vertical-align:top;">A</td><td class="recommend" style="vertical-align:top;">
    <p id="_ae4e78d0-7c0f-e2a2-5e48-bb8cf42fa037">The server SHALL respond with an HTTP status code of 200.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">B</td><td class="recommend" style="vertical-align:top;">
    <p id="_4f12341d-ac2d-c565-d28f-f05a0f9a7af7">The media type of the response SHALL be <tt>multipart/related</tt>.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">C</td><td class="recommend" style="vertical-align:top;">
    <p id="_c75c0f4f-4f63-105c-4550-0e2a2a80aacd">The content of response shall conform to <a href="https://datatracker.ietf.org/doc/html/rfc2387">RFC 2387, The MIME Multipart/Related Content-type</a>.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">D</td><td class="recommend" style="vertical-align:top;">
    <p id="_09c3389e-79a0-ec9e-2ae1-e6d136641aa2">Each requested output shall be encoded into one part of the response.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">E</td><td class="recommend" style="vertical-align:top;">
    <p id="_4d0b6cd1-ed8c-6c50-fb91-2de68f587997">The <tt>Content-ID</tt> header for each part SHALL be the corresponding output identifier.</p>
