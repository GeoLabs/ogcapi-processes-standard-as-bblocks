    </li>
    </ol>

    <p id="_d6d96565-e693-3f06-bf20-6dd3935c24c2">The job results page for a job may be retrieved in a number of different formats. The following table identifies the applicable schema document for each format and the test to be used to validate the job results for a non-existent job against that schema.  All supported formats should be exercised.</p>
- id: core/job-results-exception-results-not-ready
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/conf/core/job-results-exception-results-not-ready
  source-anchor: ats_core_job-results-exception-results-not-ready
  source-label: Abstract test A.46
  source-uri: /conf/core/job-results-exception-results-not-ready
  source-table-html: |-
    <table class="recommendtest" id="ats_core_job-results-exception-results-not-ready" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTestTitle">Abstract test A.46</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/conf/core/job-results-exception-results-not-ready</p></td></tr><tr><td class="recommend" style="vertical-align:top;">Requirement</td><td class="recommend" style="vertical-align:top;">
    <a href="#req_core_job-results-exception_results-not-ready">/req/core/job-results-exception-results-not-ready</a>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test purpose</td><td class="recommend" style="vertical-align:top;">
    <p id="_f7da29db-e00b-795e-2372-1e79f00b4731">Validate that the job results retrieved for an incomplete job complies with the require structure and contents.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test method</td><td class="recommend" style="vertical-align:top;"><ol type="1">
    <li>
    <p id="_e2a9c494-e85d-11b7-ed93-8987e4861b5e">Create a job as per <a href="#ats_core_job-creation-op">/req/core/job-creation-op</a> and note the {jobID} assigned to the job; ensure that the job is long-running.</p>
    </li>
    <li>
    <p id="_691c66b3-f93f-209a-1f9a-847aacc66548">Issue an HTTP GET request to the URL ‘/jobs/{jobID}/results’ before the job completes execution.</p>
    </li>
    <li>
    <p id="_4355236c-b584-238d-8bf3-b71c21968ace">Validate that the document was returned with a 404.</p>
    </li>
    <li>
    <p id="_bfdb66d9-fae0-ffa6-a806-7ded7fdcd3dd">Validate that the document contains the exception <tt>type</tt> “http://www.opengis.net/def/exceptions/ogcapi-processes-1/1.0/result-not-ready”.</p>
    </li>
    <li>
    <p id="_3ffabdc5-3f18-2c16-657f-f4e57aca547c">Validate the document for all supported media types using the resources and tests identified in <a href="#job-results-exception-results-not-ready">Table A.8</a></p>
    </li>
    </ol>
    </td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_9664e34f-3a90-316a-b11d-aef2c96efde0">The job results page for a job may be retrieved in a number of different formats. The following table identifies the applicable schema document for each format and the test to be used to validate the job results for an incomplete job against that schema.  All supported formats should be exercised.</p></td></tr></tbody></table>
  purpose: <p id="_f7da29db-e00b-795e-2372-1e79f00b4731">Validate that the job results retrieved for an incomplete job complies with the require structure and contents.</p>
  requirement:
  - ref: /req/core/job-results-exception-results-not-ready
    text: <a href="#req_core_job-results-exception_results-not-ready">/req/core/job-results-exception-results-not-ready</a>
  method: |-
    <ol type="1">
    <li>
    <p id="_e2a9c494-e85d-11b7-ed93-8987e4861b5e">Create a job as per <a href="#ats_core_job-creation-op">/req/core/job-creation-op</a> and note the {jobID} assigned to the job; ensure that the job is long-running.</p>
    </li>
    <li>
    <p id="_691c66b3-f93f-209a-1f9a-847aacc66548">Issue an HTTP GET request to the URL ‘/jobs/{jobID}/results’ before the job completes execution.</p>
    </li>
    <li>
    <p id="_4355236c-b584-238d-8bf3-b71c21968ace">Validate that the document was returned with a 404.</p>
    </li>
