- id: core/job-creation-sync-raw-value-one
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/conf/core/job-creation-sync-raw-value-one
  source-anchor: ats_core_job-creation-sync-raw-value-one
  source-label: Abstract test A.29
  source-uri: /conf/core/job-creation-sync-raw-value-one
  source-table-html: |-
    <table class="recommendtest" id="ats_core_job-creation-sync-raw-value-one" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTestTitle">Abstract test A.29</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/conf/core/job-creation-sync-raw-value-one</p></td></tr><tr><td class="recommend" style="vertical-align:top;">Requirement</td><td class="recommend" style="vertical-align:top;">
    <a href="#req_core_job-creation-sync-raw-value-one">/req/core/job-creation-sync-raw-value-one</a>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test purpose</td><td class="recommend" style="vertical-align:top;">
    <p id="_eb97c7e0-a449-4504-aeca-f6ab21743ba3">Validate that the server responds as expected when synchronous execution is <a href="#sc_execution_mode">negotiated</a>, a single output value is requested, the response type is <tt>raw</tt> and the output transmission is <tt>value</tt>.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test method</td><td class="recommend" style="vertical-align:top;"><ol type="1">
    <li>
    <p id="_89cc9d45-b2f5-c4f3-4bd6-be6482e2f570">Get a description of each process offered by the server using test <a href="#ats_core_process">/conf/core/process</a>.</p>
    </li>
    <li>
    <p id="_f4a19178-1589-56ca-63dd-e483d7c94dcb">Inspect the description of each process and identify the subset of processes that generate at least one output and support the <tt>sync-execute</tt> job control option and the <tt>value</tt> output transmission.</p>
    </li>
    <li>
    <p id="_a0ab15ba-def1-2caf-2cf5-d674189ec0f1">For each identified process construct an execute request according to test <a href="#ats_core_job-creation-request">/conf/core/job-creation-request</a> ensuring that synchronous execution is <a href="#sc_execution_mode">negotiated</a> according to test <a href="#ats_core_job-creation-default-execution-mode">/conf/core/job-creation-default-execution-mode</a>, that only one output is requested, that the requested response type is <tt>raw</tt> (i.e. <tt>"response": "raw"</tt>) and that the output transmission is set to <tt>value</tt> (i.e. <tt>"transmissionMode": "value"</tt>) according to requirement <a href="#req_core_job-creation-sync-raw-value-one">/req/core/job-creation-sync-raw-value-one</a>.</p>
    </li>
    <li>
    <p id="_68993881-3dfe-307a-45c6-b68fc4ee72d4">Verify that each process executes successfully according to requirement <a href="#req_core_job-creation-sync-raw-value-one">/req/core/job-creation-sync-raw-value-one</a>.</p>
    </li>
    </ol>
    </td></tr></tbody></table>
