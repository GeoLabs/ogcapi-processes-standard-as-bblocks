  source-table-html: <table class="recommend" id="req-creation-input-inline-bbox" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 23</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/core/process-execute-input-inline-bbox</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_8bc8d6f8-2a4f-ab51-0f0e-efe31fbe4481">Servers SHALL support process input values that conform to the <a href="#bbox-schema">bbox.yaml</a> schema.</p></td></tr></tbody></table>
