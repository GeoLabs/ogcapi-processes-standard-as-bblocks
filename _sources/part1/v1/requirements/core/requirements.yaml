    <li>
    <p id="_caf2a74f-ed1b-1a18-6c1d-82c82e859f89">For each output requested with <tt>"transmissionMode": "reference"</tt> verify that the body of the corresponding part is empty and the <tt>Content-Location</tt> header is included that points to the output value.</p>
