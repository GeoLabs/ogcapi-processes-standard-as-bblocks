    <li>
    <p id="_e28b2df3-2575-c5e0-aa4a-67a0020e15ea">The <a href="#sc_execution_mode">negotiated execution mode</a> is synchronous, <tt>response=raw</tt>, <tt>transmissionMode=value</tt></p>
