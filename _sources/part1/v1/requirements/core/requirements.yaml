  source-table-html: <table class="recommend" id="req_core_landingpage-op" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 1</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/core/landingpage-op</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_0c1fe6e3-ca33-cd4b-cada-14cb676c571f">The server SHALL support the HTTP GET operation at the path <tt>/</tt>.</p></td></tr></tbody></table>
  statement: <p id="_0c1fe6e3-ca33-cd4b-cada-14cb676c571f">The server SHALL support the HTTP GET operation at the path <tt>/</tt>.</p>
- id: core/landingpage-success
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/req/core/landingpage-success
  type: requirement
  source-anchor: req_core_landingpage-success
  source-label: Requirement 2
  source-uri: /req/core/landingpage-success
  source-table-html: |-
    <table class="recommend" id="req_core_landingpage-success" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 2</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/core/landingpage-success</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_77a79fac-e250-0a4a-871a-92cefaebee7a">A successful execution of the operation SHALL be reported as a response with a
    HTTP status code <tt>200</tt>.</p><p id="_70f8a64d-59cf-356c-9825-c4d9adec9c70">The content of that response SHALL be based upon the OpenAPI 3.0 schema <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/landingPage.yaml">landingPage.yaml</a>
    and include at least links to the following resources:</p><ul id="_1944a62f-ed4c-f551-7ac7-cd06948be131">
    <li>
    <p id="_2c150674-389f-b6d2-1fa1-0c4f52b8eb98">the API definition (relation type ‘service-desc’ or ‘service-doc’)</p>
    </li>
    <li>
    <p id="_3d91cca4-251f-dbb4-6161-575b20a4dba1"><tt>/conformance</tt> (relation type ‘http://www.opengis.net/def/rel/ogc/1.0/conformance’)</p>
    </li>
    <li>
    <p id="_5129ed71-daf8-9d85-9f99-92818d0b79ec"><tt>/processes</tt> (relation type ‘http://www.opengis.net/def/rel/ogc/1.0/processes’)</p>
    </li>
    </ul></td></tr></tbody></table>
  statement: |-
    <p id="_77a79fac-e250-0a4a-871a-92cefaebee7a">A successful execution of the operation SHALL be reported as a response with a
    HTTP status code <tt>200</tt>.</p><p id="_70f8a64d-59cf-356c-9825-c4d9adec9c70">The content of that response SHALL be based upon the OpenAPI 3.0 schema <a href="http://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/landingPage.yaml">landingPage.yaml</a>
    and include at least links to the following resources:</p><ul id="_1944a62f-ed4c-f551-7ac7-cd06948be131">
    <li>
    <p id="_2c150674-389f-b6d2-1fa1-0c4f52b8eb98">the API definition (relation type ‘service-desc’ or ‘service-doc’)</p>
    </li>
    <li>
    <p id="_3d91cca4-251f-dbb4-6161-575b20a4dba1"><tt>/conformance</tt> (relation type ‘http://www.opengis.net/def/rel/ogc/1.0/conformance’)</p>
    </li>
    <li>
    <p id="_5129ed71-daf8-9d85-9f99-92818d0b79ec"><tt>/processes</tt> (relation type ‘http://www.opengis.net/def/rel/ogc/1.0/processes’)</p>
    </li>
    </ul>
- id: core/api-definition-op
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/req/core/api-definition-op
  type: requirement
  source-anchor: req_core_api-definition-op
  source-label: Requirement 3
  source-uri: /req/core/api-definition-op
  source-table-html: |-
    <table class="recommend" id="req_core_api-definition-op" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 3</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/core/api-definition-op
    The URIs of all API definitions referenced from the landing page
    SHALL support the HTTP GET method.</p></td></tr></tbody></table>
  statement: |-
    <p>The URIs of all API definitions referenced from the landing page
    SHALL support the HTTP GET method.</p>
- id: core/api-definition-uri
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/per/core/api-definition-uri
  type: permission
  source-anchor: per_core_api-definition-uri
  source-label: Permission 1
  source-uri: /per/core/api-definition-uri
  source-table-html: |-
    <table class="recommend" id="per_core_api-definition-uri" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Permission 1</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/per/core/api-definition-uri</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_ce274f2d-e094-06b3-3f9f-8775879e9ed9">The API definition is metadata about the API and strictly not part of the API
    itself, but it MAY be hosted as a sub-resource to the base path of the API, for example, at path <tt>/api</tt>. There is no need to include the path of the API definition in the API definition itself.</p></td></tr></tbody></table>
  statement: |-
    <p id="_ce274f2d-e094-06b3-3f9f-8775879e9ed9">The API definition is metadata about the API and strictly not part of the API
    itself, but it MAY be hosted as a sub-resource to the base path of the API, for example, at path <tt>/api</tt>. There is no need to include the path of the API definition in the API definition itself.</p>
- id: core/api-definition-success
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/req/core/api-definition-success
  type: requirement
  source-anchor: req_core_api-definition-success
  source-label: Requirement 4
  source-uri: /req/core/api-definition-success
  source-table-html: |-
    <table class="recommend" id="req_core_api-definition-success" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 4</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/core/api-definition-success
    A successful execution of the operation to get the API definition document SHALL be reported as a
    response with a HTTP status code <tt>200</tt>.</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_d143b336-93cf-8391-a66f-74df6bfc8035">The server SHALL return an API definition document.</p></td></tr></tbody></table>
  statement: |-
    <p>A successful execution of the operation to get the API definition document SHALL be reported as a
    response with a HTTP status code <tt>200</tt>.</p>

    <p id="_d143b336-93cf-8391-a66f-74df6bfc8035">The server SHALL return an API definition document.</p>
