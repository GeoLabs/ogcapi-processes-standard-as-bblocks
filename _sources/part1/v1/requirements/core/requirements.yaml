    </li>
    <li>
    <p id="_3b207cf8-92b2-f6b1-0f52-8b7968996557">For each identified process construct an execute request according to test <a href="#ats_core_job-creation-request">/conf/core/job-creation-request</a> ensuring that asynchronous execution is <a href="#sc_execution_mode">negotiated</a> according to test <a href="#ats_core_job-creation-auto-execution-mode">/conf/core/job-creation-auto-execution-mode</a>, that the requested response type is <tt>raw</tt> (i.e. <tt>"response": "raw"</tt>) and that the output transmission is set to <tt>value</tt> (i.e. <tt>"outputTransmission": "value"</tt>) according to requirement <a data-source-href="#req_core_job-creation-async-raw-value-one" href="https://docs.ogc.org/is/18-062r2/18-062r2.html#_3b207cf8-92b2-f6b1-0f52-8b7968996557" title="Unresolved reference in the published standard; opens its official source context, not an inferred target.">/req/core/job-creation-async-raw-value-one</a>.</p>
