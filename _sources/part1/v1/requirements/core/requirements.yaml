    <p id="_877472a9-3c20-9f8a-d2d0-5005becb5682">Get the results as per test <a href="#ats_core_job-results-op">/conf/core/job-results</a> and verify that they conform to the test <a href="#ats_core_job-results-async-document">/conf/core/job-results-async-document</a>.</p>
    </li>
    <li>
    <p id="_88df918c-a953-f397-fcdd-0b9f185629a1">If the link does not exist then verify that the synchronous response conforms to requirement <a href="#req_core_job-creation-sync-raw-ref">/req/core/job-creation-sync-raw-ref</a>.</p>
    </li>
    </ol>
    </td></tr></tbody></table>
  purpose: <p id="_23d2df8c-c4dd-3070-864f-b2fdd12c9f32">Validate that the server responds as expected when asynchronous execution is <a href="#sc_execution_mode">negotiated</a>, the response type is <tt>raw</tt> and the output transmission is <tt>reference</tt>.</p>
  requirement:
  - ref: /req/core/job-results-async-raw-ref
    text: <a href="#req_core_job-results-async-raw-ref">/req/core/job-results-async-raw-ref</a>
  method: |-
    <ol type="1">
    <li>
    <p id="_22862b04-7f66-eaa6-5a8c-d1837ff8d2f3">Get a description of each process offered by the server using test <a href="#ats_core_process">/conf/core/process</a>.</p>
    </li>
    <li>
    <p id="_3231b60f-5237-659e-8483-cf06bfb51ba0">Inspect the description of each process and identify the subset of processes that support the <tt>async-execute</tt> job control option and the <tt>reference</tt> output transmission.</p>
    </li>
    <li>
    <p id="_06d6ec93-2130-5925-e6f8-ec81c2c5d29f">For each identified process construct an execute request according to test <a href="#ats_core_job-creation-request">/conf/core/job-creation-request</a> ensuring that synchronous execution is <a href="#sc_execution_mode">negotiated</a> according to test <a href="#ats_core_job-creation-auto-execution-mode">/conf/core/job-creation-auto-execution-mode</a>, that the requested response type is <tt>raw</tt> (i.e. <tt>"response": "raw"</tt>) and that the output transmission is set to <tt>reference</tt> (i.e. <tt>"outputTransmission": "reference"</tt>) according to requirement <a data-source-href="#req_core_job-creation-async-raw-ref" href="https://docs.ogc.org/is/18-062r2/18-062r2.html#_06d6ec93-2130-5925-e6f8-ec81c2c5d29f" title="Unresolved reference in the published standard; opens its official source context, not an inferred target.">/req/core/job-creation-async-raw-ref</a>.</p>
    </li>
    <li>
    <p id="_bccc82f6-d698-915e-b015-5f9708ece30d">If the server responds asynchronously, periodically retrieve the status of the asynchronously executed job as per test <a href="#ats_core_job-op">/conf/core/job-op</a>.</p>
    </li>
    <li>
    <p id="_8a2830d1-50c7-a94e-e43d-38ce608add89">When the job status is <tt>successful</tt>, get the results as per test <a href="#ats_core_job-results-op">/conf/core/job-results</a> and verify that they conform to requirement <a href="#req_core_job-results-async-raw-ref">/req/core/job-results-async-ref</a>.</p>
    </li>
    </ol>
    <div class="Note" id="_755f0ef9-77a1-abae-ccdd-6daa39ec8fdd"><p><span class="note_label">NOTE  3</span>  In the case where a process supports both <tt>async-execute</tt> and <tt>sync-execute</tt> job control options there is a possibility that the server responds synchronously even though the <tt>Prefer</tt> headers asserts a <tt>respond-async</tt> preference.  In this case, the following additional test should be performed.</p></div>
    <ol type="1">
    <li>
    <p id="_e17d0b64-ba2d-ef39-d4ca-d0db5b8805d7">Inspect the headers of the synchronous response and see if a <tt>Link</tt> header is included with <tt>rel=monitor</tt>.</p>
    </li>
    <li>
    <p id="_6a0f2fd3-b735-2a3d-55f2-e3013f25ea97">If the link exists, get the job status as per test <a href="#ats_core_job-op">/conf/core/job-op</a> and ensure that the job status is set to <tt>successful</tt>.</p>
    </li>
    <li>
    <p id="_877472a9-3c20-9f8a-d2d0-5005becb5682">Get the results as per test <a href="#ats_core_job-results-op">/conf/core/job-results</a> and verify that they conform to the test <a href="#ats_core_job-results-async-document">/conf/core/job-results-async-document</a>.</p>
    </li>
    <li>
    <p id="_88df918c-a953-f397-fcdd-0b9f185629a1">If the link does not exist then verify that the synchronous response conforms to requirement <a data-source-href="#req_core_job-creation-sync-raw-ref" href="https://docs.ogc.org/is/18-062r2/18-062r2.html#_89d14442-31b3-e5a3-5464-a43b883e3c4a" title="Unresolved reference in the published standard; opens its official source context, not an inferred target.">/req/core/job-creation-sync-raw-ref</a>.</p>
    </li>
    </ol>
