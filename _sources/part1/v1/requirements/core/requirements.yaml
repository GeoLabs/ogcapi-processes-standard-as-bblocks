    <pre class="prettyprint" id="_da0c3bff-4331-ecdb-f9af-ffea7d45f81a">name: limit<br/>in: query<br/>required: false<br/>schema:<br/>  type: integer<br/>  minimum: 1<br/>  maximum: 10000<br/>  default: 10<br/>style: form<br/>explode: false</pre>
