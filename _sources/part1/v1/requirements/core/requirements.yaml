    <p id="_bfdb66d9-fae0-ffa6-a806-7ded7fdcd3dd">Validate that the document contains the exception <tt>type</tt> “http://www.opengis.net/def/exceptions/ogcapi-processes-1/1.0/result-not-ready”.</p>
    </li>
    <li>
    <p id="_3ffabdc5-3f18-2c16-657f-f4e57aca547c">Validate the document for all supported media types using the resources and tests identified in <a href="#job-results-exception-results-not-ready">Table A.8</a></p>
    </li>
    </ol>

    <p id="_9664e34f-3a90-316a-b11d-aef2c96efde0">The job results page for a job may be retrieved in a number of different formats. The following table identifies the applicable schema document for each format and the test to be used to validate the job results for an incomplete job against that schema.  All supported formats should be exercised.</p>
- id: core/job-results-failed--published-abstract-test-a-47
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/conf/core/job-results-failed
  source-anchor: ats_core_job-results-failed
  source-label: Abstract test A.47
  source-uri: /conf/core/job-results-failed
  source-table-html: |-
    <table class="recommendtest" id="ats_core_job-results-failed" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTestTitle">Abstract test A.47</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/conf/core/job-results-failed</p></td></tr><tr><td class="recommend" style="vertical-align:top;">Requirement</td><td class="recommend" style="vertical-align:top;">
    <a href="#req_core_job-results-failed">/req/core/job-results-failed</a>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test purpose</td><td class="recommend" style="vertical-align:top;">
    <p id="_ee0e8dde-bc5e-cdeb-d5eb-fd57b599c016">Validate that the job results for a failed job complies with the require structure and contents.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test method</td><td class="recommend" style="vertical-align:top;"><ol type="1">
    <li>
    <p id="_452bcd22-0710-739f-4b21-5d53fed9051e">Create a job as per <a href="#ats_core_job-creation-op">/req/core/job-creation-op</a> but arrange a priori that the job will fail; note the {jobID} assigned to the job.</p>
    </li>
    <li>
    <p id="_9fa5c2eb-5621-ebdd-e4b1-f1e5d56ea69f">Ensure that the failed job will not result in an HTTP error code of 404.</p>
    </li>
    <li>
    <p id="_b74f0fcb-3040-b48b-a2d4-a7b6fcd9142c">Issue an HTTP GET request to the URL ‘/jobs/{jobID}/results’.</p>
    </li>
    <li>
    <p id="_be873506-3022-e787-52c5-e522c690993b">Validate that the document was returned with a HTTP error code (4XX or 5XX).</p>
    </li>
    <li>
    <p id="_51e5e067-c369-e62f-c24c-c90e7b739131">Validate that the document contains an exception <tt>type</tt> that corresponds to the reason the job failed (e.g. InvalidParameterValue for invalid input data).</p>
    </li>
    <li>
    <p id="_2f32e3d2-dd82-fa2e-2825-6b397cf44291">Validate the document for all supported media types using the resources and tests identified in <a href="#job-results-failed-schema">Table A.9</a></p>
    </li>
    </ol>
    </td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_a8e80134-53c8-4fec-7875-ce1197564a32">The job results page for a job may be retrieved in a number of different formats. The following table identifies the applicable schema document for each format and the test to be used to validate the job results for a failed job against that schema.  All supported formats should be exercised.</p></td></tr></tbody></table>
  purpose: <p id="_ee0e8dde-bc5e-cdeb-d5eb-fd57b599c016">Validate that the job results for a failed job complies with the require structure and contents.</p>
