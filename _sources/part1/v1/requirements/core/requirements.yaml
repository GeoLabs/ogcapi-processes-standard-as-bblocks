- id: core/process-execute-input-validation
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/req/core/process-execute-input-validation
  type: requirement
  source-anchor: req_core_process-execute-input-validation
  source-label: Requirement 24
  source-uri: /req/core/process-execute-input-validation
  source-table-html: |-
    <table class="recommend" id="req_core_process-execute-input-validation" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 24</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/core/process-execute-input-validation</p></td></tr><tr><td class="recommend" style="vertical-align:top;">A</td><td class="recommend" style="vertical-align:top;">
    <p id="_086aaeb3-4a0e-2189-b825-4776694907bb">For process input values specified in-line in an execute request, the server SHALL validate each component of a process input value that is an instance of <a href="#input-value-schema">inputValue.yaml</a> using the definition of the corresponding input from the <a href="#sc_process_description">process description</a>.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">B</td><td class="recommend" style="vertical-align:top;">
    <p id="_3ecce2d2-28c2-3c3a-e180-9de422f9386d">For process input values specified by reference in an execute request, the server SHALL resolve the value and then validate it as if the value had been specified in-line in the execute request (i.e. as per requirement <b><i>A</i></b>).</p>
    </td></tr></tbody></table>
  statement: ''
  parts:
  - <p id="_086aaeb3-4a0e-2189-b825-4776694907bb">For process input values specified in-line in an execute request, the server SHALL validate each component of a process input value that is an instance of <a href="#input-value-schema">inputValue.yaml</a> using the definition of the corresponding input from the <a href="#sc_process_description">process description</a>.</p>
  - <p id="_3ecce2d2-28c2-3c3a-e180-9de422f9386d">For process input values specified by reference in an execute request, the server SHALL resolve the value and then validate it as if the value had been specified in-line in the execute request (i.e. as per requirement <b><i>A</i></b>).</p>
- id: core/process-execute-default-execution-mode
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/req/core/process-execute-default-execution-mode
  type: requirement
  source-anchor: req_core_process-execute-default-execution-mode
  source-label: Requirement 25
  source-uri: /req/core/process-execute-default-execution-mode
  source-table-html: |-
    <table class="recommend" id="req_core_process-execute-default-execution-mode" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 25</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/core/process-execute-default-execution-mode</p></td></tr><tr><td class="recommend" style="vertical-align:top;">Conditions</td><td class="recommend" style="vertical-align:top;">
    <p id="_be920aee-24f1-8ccb-0d65-9e494c3a5a71">The execute request <b>is not</b> accompanied with the HTTP <a href="https://datatracker.ietf.org/doc/html/rfc7240#section-2"><tt>Prefer</tt></a> header.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">A</td><td class="recommend" style="vertical-align:top;">
    <p id="_fa474a40-6489-8342-a5eb-3adf8dee9259">The server SHALL respond asynchronously if, according to the job control options in the <a href="#sc_process_description">process description</a>, the process can only be executed asynchronously.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">B</td><td class="recommend" style="vertical-align:top;">
    <p id="_7bc131fd-1ac3-b438-8a83-db993ed2a5f3">The server SHALL respond synchronously if, according to the job control options in the <a href="#sc_process_description">process description</a>, the process can only be executed synchronously.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">C</td><td class="recommend" style="vertical-align:top;">
    <p id="_e6f856a2-d26a-39c7-6219-03086906c8aa">The server SHALL respond synchronously if, according to the job control options in the <a href="#sc_process_description">process description</a>, the process can be executed in either mode.</p>
    </td></tr></tbody></table>
  condition: <p id="_be920aee-24f1-8ccb-0d65-9e494c3a5a71">The execute request <b>is not</b> accompanied with the HTTP <a href="https://datatracker.ietf.org/doc/html/rfc7240#section-2"><tt>Prefer</tt></a> header.</p>
  statement: ''
  parts:
  - <p id="_fa474a40-6489-8342-a5eb-3adf8dee9259">The server SHALL respond asynchronously if, according to the job control options in the <a href="#sc_process_description">process description</a>, the process can only be executed asynchronously.</p>
  - <p id="_7bc131fd-1ac3-b438-8a83-db993ed2a5f3">The server SHALL respond synchronously if, according to the job control options in the <a href="#sc_process_description">process description</a>, the process can only be executed synchronously.</p>
  - <p id="_e6f856a2-d26a-39c7-6219-03086906c8aa">The server SHALL respond synchronously if, according to the job control options in the <a href="#sc_process_description">process description</a>, the process can be executed in either mode.</p>
- id: core/process-execute-auto-execution-mode
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/req/core/process-execute-auto-execution-mode
  type: requirement
  source-anchor: req_core_process-execute-auto-execution-mode
  source-label: Requirement 26
  source-uri: /req/core/process-execute-auto-execution-mode
  source-table-html: |-
    <table class="recommend" id="req_core_process-execute-auto-execution-mode" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 26</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/core/process-execute-auto-execution-mode</p></td></tr><tr><td class="recommend" style="vertical-align:top;">Conditions</td><td class="recommend" style="vertical-align:top;">
    <p id="_3367f99c-8f78-df17-8e0c-412af6949e4a">The execute request <b>is</b> accompanied with the HTTP <a href="https://datatracker.ietf.org/doc/html/rfc7240#section-2"><tt>Prefer</tt></a> header asserting a <a href="https://tools.ietf.org/html/rfc7240#section-4.1"><tt>respond-async</tt></a> preference.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">A</td><td class="recommend" style="vertical-align:top;">
    <p id="_e9d7502a-b866-14ab-cc7c-15c50b4684ce">The server SHALL respond asynchronously if, according to the job control options in the <a href="#sc_process_description">process description</a>, the process can only be executed asynchronously.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">B</td><td class="recommend" style="vertical-align:top;">
    <p id="_5a2ac415-134f-588d-f49c-f7dc20a70035">The server SHALL respond synchronously if, according to the job control options in the <a href="#sc_process_description">process description</a>, the process can only be executed synchronously.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">C</td><td class="recommend" style="vertical-align:top;">
    <p id="_602126b4-e19a-5681-49cc-1870d068ba94">The server SHALL respond, at its discretion, either synchronously or asynchronously if, according to the job control options in the <a href="#sc_process_description">process description</a>, the process can be executed in either mode.</p>
    </td></tr></tbody></table>
  condition: <p id="_3367f99c-8f78-df17-8e0c-412af6949e4a">The execute request <b>is</b> accompanied with the HTTP <a href="https://datatracker.ietf.org/doc/html/rfc7240#section-2"><tt>Prefer</tt></a> header asserting a <a href="https://tools.ietf.org/html/rfc7240#section-4.1"><tt>respond-async</tt></a> preference.</p>
  statement: ''
  parts:
  - <p id="_e9d7502a-b866-14ab-cc7c-15c50b4684ce">The server SHALL respond asynchronously if, according to the job control options in the <a href="#sc_process_description">process description</a>, the process can only be executed asynchronously.</p>
  - <p id="_5a2ac415-134f-588d-f49c-f7dc20a70035">The server SHALL respond synchronously if, according to the job control options in the <a href="#sc_process_description">process description</a>, the process can only be executed synchronously.</p>
  - <p id="_602126b4-e19a-5681-49cc-1870d068ba94">The server SHALL respond, at its discretion, either synchronously or asynchronously if, according to the job control options in the <a href="#sc_process_description">process description</a>, the process can be executed in either mode.</p>
- id: core/process-execute-default-outputs
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/req/core/process-execute-default-outputs
  type: requirement
  source-anchor: req_core_process-execute-default-outputs
  source-label: Requirement 27
  source-uri: /req/core/process-execute-default-outputs
  source-table-html: <table class="recommend" id="req_core_process-execute-default-outputs" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 27</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/core/process-execute-default-outputs</p></td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p id="_9857ee20-ed8b-0cbc-c278-dbdbd3e3f948">If a process is defined as having one or more outputs and the <tt>outputs</tt> parameter is omitted in an <a href="#execute-request-body">execute request</a>, this SHALL be equivalent to having requested all the defined outputs in the <a href="#execute-request-body">execute request</a>.</p></td></tr></tbody></table>
  statement: <p id="_9857ee20-ed8b-0cbc-c278-dbdbd3e3f948">If a process is defined as having one or more outputs and the <tt>outputs</tt> parameter is omitted in an <a href="#execute-request-body">execute request</a>, this SHALL be equivalent to having requested all the defined outputs in the <a href="#execute-request-body">execute request</a>.</p>
- id: core/process-execute-sync-raw-value-one
  uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/req/core/process-execute-sync-raw-value-one
  type: requirement
  source-anchor: req_core_process-execute-sync-raw-value-one
  source-label: Requirement 28
