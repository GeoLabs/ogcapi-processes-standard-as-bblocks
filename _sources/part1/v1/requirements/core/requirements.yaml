    <p id="_eaa1f5c5-82fb-d95b-f7ac-1a766b6c12f3">Validate that the server responds as expected when getting results from a job for a process that has been executed synchronously.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test method</td><td class="recommend" style="vertical-align:top;"><ol type="1">
    <li>
    <p id="_dc86a7ba-f5e9-4082-3237-018f7d37712b">Get a description of each process offered by the server using test <a href="#ats_core_process">/conf/core/process</a>.</p>
    </li>
    <li>
    <p id="_2fea6d2e-7745-9af8-db44-b74551edf0f4">Inspect the description of each process and identify the subset of processes that support the <tt>sync-execute</tt> job control option.</p>
    </li>
    <li>
    <p id="_d67ac604-3046-738c-fcd5-f8b2d13bdcec">For each identified process construct an execute request according to test <a href="#ats_core_job-creation-request">/conf/core/job-creation-request</a> ensuring that synchronous execution is <a href="#sc_execution_mode">negotiated</a> according to test <a href="#ats_core_job-creation-default-execution-mode">/conf/core/job-creation-default-execution-mode</a>.</p>
    </li>
    <li>
    <p id="_09e734bd-6f63-7c5d-3581-e2a1cac5c68a">Inspect the headers of the response and see if a <tt>Link</tt> header is included with <tt>rel=monitor</tt>.</p>
    </li>
    <li>
    <p id="_b279a2e8-6d24-55b0-9440-c452ab52832d">If the link exists, get the job status as per test <a href="#ats_core_job-op">/conf/core/job-op</a> and ensure that the job status is set to <tt>successful</tt>.</p>
    </li>
    </ol>
    </td></tr></tbody></table>
