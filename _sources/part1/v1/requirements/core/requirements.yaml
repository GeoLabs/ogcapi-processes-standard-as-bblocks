    <p id="_ba7dff1c-028f-169f-d9a0-e3cd3c388dcd">If the API definition specifies a maximum value for <tt>limit</tt> parameter, the response SHALL not contain more process summaries than this maximum value.</p>
    </td></tr></tbody></table>
  statement: ''
  parts:
  - <p id="_7577fcce-e8f0-6fb9-3545-a1c4baf15c52">The response SHALL not contain more process summaries than specified by the optional <tt>limit</tt> parameter.</p>
