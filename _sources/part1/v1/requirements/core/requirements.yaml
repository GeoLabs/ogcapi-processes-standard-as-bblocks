    <li>
    <p id="_5da3a7b8-c10d-5854-7829-deeae795ba9d">Get a description of each process offered by the server using test <a href="#ats_core_process">/conf/core/process</a>.</p>
    </li>
    <li>
    <p id="_60949952-dc7f-1098-12cb-28c62e76a574">Inspect the description of each process and identify the subset of processes that generate more than one output and that support the <tt>async-execute</tt> job control option.</p>
    </li>
    <li>
    <p id="_99d866e4-8ad7-b147-2a06-37d840d79c37">For each identified process construct an execute request according to test <a href="#ats_core_job-creation-request">/conf/core/job-creation-request</a> ensuring that asynchronous execution is <a href="#sc_execution_mode">negotiated</a> according to test <a href="#ats_core_job-creation-auto-execution-mode">/conf/core/job-creation-auto-execution-mode</a>, that the requested response type is <tt>raw</tt> (i.e. <tt>"response": "raw"</tt>) and that the output transmission is set to a mix of <tt>value</tt> (i.e. <tt>"outputTransmission": "value"</tt>) and <tt>reference</tt> (i.e. <tt>"outputTransmission": "reference"</tt>) according to requirement <a href="#req_core_job-creation-async-raw-mixed-multi">/req/core/job-creation-async-raw-mixed-multi</a>.</p>
    </li>
    <li>
    <p id="_6d03361b-2c98-f002-2110-f22e8da154c6">Periodically retrieve the status of the asynchronously execute job as per test <a href="#ats_core_job-op">/conf/core/job-op</a>.</p>
    </li>
    <li>
    <p id="_0a7393ee-9d45-44d8-59cf-2b93780e3415">When the job status is <tt>successful</tt>, get the results as per test <a href="#ats_core_job-results-op">/conf/core/job-results</a> and verify that they conform to requirement <a href="#req_core_job-results-async-raw-mixed-multi">/conf/core/job-results-async-raw-mixed-multi</a>.</p>
    </li>
    <li>
    <p id="_32ddc5cd-3fb1-07a8-2f4f-40d4c6da169e">For each output requested with <tt>"transmissionMode": "value"</tt> verify that the body of the corresponding part contains the output value.</p>
    </li>
    <li>
    <p id="_caf2a74f-ed1b-1a18-6c1d-82c82e859f89">For each output requested with <tt>"transmissionMode": "reference"</tt> verify that the body of the corresponding part is empty and the <tt>Content-Location</tt> header is included that points to the output value.</p>
    </li>
    </ol>
    </td></tr><tr><td class="recommend" colspan="2" style="vertical-align:top;"><div class="Note" id="_dd1d2271-a56d-fde6-0e5b-c88f2c47473f"><p><span class="note_label">NOTE  4</span>  In the case where a process supports both <tt>async-execute</tt> and <tt>sync-execute</tt> job control options there is a possibility that the server responds synchronously even though the <tt>Prefer</tt> headers asserts a <tt>respond-async</tt> preference.  In this case, the following additional test should be performed.</p></div></td></tr><tr><td class="recommend" style="vertical-align:top;">Test method</td><td class="recommend" style="vertical-align:top;"><ol type="1">
    <li>
    <p id="_ec146b7f-f1a2-8b6a-6872-e4438621ad9b">Inspect the headers of the synchronous response and see if a <tt>Link</tt> header is included with <tt>rel=monitor</tt>.</p>
    </li>
    <li>
    <p id="_5fb03076-aba8-6788-a2f8-6ced02ddc39f">If the link exists, get the job status as per test <a href="#ats_core_job-op">/conf/cor e/job-op</a> and ensure that the job status is set to <tt>successful</tt>.</p>
    </li>
    <li>
    <p id="_10213ee6-aaab-6faf-4a02-6450653b1416">Get the results as per test <a href="#ats_core_job-results-op">/conf/core/job-results</a> and verify that they conform to the test <a href="#ats_core_job-results-async-raw-mixed-multi">/conf/core/job-results-async-raw-mixed-multi</a>.</p>
    </li>
    <li>
    <p id="_43b883a3-3239-ca01-3125-3ca03155f946">If the link does not exist then verify that the synchronous response conforms to requirement <a href="#req_core_job-creation-sync-raw-mixed-multi">/req/core/job-creation-sync-raw-mixed-multi</a>.</p>
    </li>
    </ol>
    </td></tr></tbody></table>
