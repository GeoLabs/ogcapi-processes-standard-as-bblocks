  source-anchor: ats_core_job-creation-input-validation
  source-label: Abstract test A.28
  source-uri: /conf/core/job-creation-input-validation
  source-table-html: |-
    <table class="recommendtest" id="ats_core_job-creation-input-validation" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTestTitle">Abstract test A.28</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/conf/core/job-creation-input-validation</p></td></tr><tr><td class="recommend" style="vertical-align:top;">Requirement</td><td class="recommend" style="vertical-align:top;">
