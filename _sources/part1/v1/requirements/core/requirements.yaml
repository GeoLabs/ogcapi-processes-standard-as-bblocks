    <p id="_b82ee983-c14e-bd6b-c368-2f9732f1defd">Validate the contents of the POST request using the test <a href="#ats_core_job-creation-request">/conf/core/job-creation-request</a>.</p>
    </li>
    <li>
    <p id="_9e5cc646-0e24-3fe1-78a3-f44bf7f1a33f">Validate the creation of the job according the requirements <a data-source-href="#req_core_job-creation-default-execution-mode" href="https://docs.ogc.org/is/18-062r2/18-062r2.html#_9e5cc646-0e24-3fe1-78a3-f44bf7f1a33f" title="Unresolved reference in the published standard; opens its official source context, not an inferred target.">/req/core/job-creation-default-execution-mode</a>, <a data-source-href="#req_core_job-creation-auto-execution-mode" href="https://docs.ogc.org/is/18-062r2/18-062r2.html#_9e5cc646-0e24-3fe1-78a3-f44bf7f1a33f" title="Unresolved reference in the published standard; opens its official source context, not an inferred target.">/req/core/job-creation-auto-execution-mode</a>.</p>
