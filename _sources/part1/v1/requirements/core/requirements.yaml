    <p id="_f17acc50-c9ea-6fc8-2ca2-8b8c13b4c716">Validate that the server correctly handles the default execution mode for a process.</p>
    </td></tr><tr><td class="recommend" style="vertical-align:top;">Test method</td><td class="recommend" style="vertical-align:top;"><ol type="1">
    <li>
    <p id="_36445f9e-383d-4212-07a7-7dd22e51cccb">Get a description of each process offered by the server using test <a href="#ats_core_process">/conf/core/process</a>.</p>
    </li>
    <li>
    <p id="_96b30650-e409-3a93-71aa-5fe394173932">Inspect the description of each process and take note of the job control options for the process.</p>
    </li>
    <li>
    <p id="_a28cc1d1-3840-6469-5abe-900a17648fef">Without setting the HTTP <tt>Prefer</tt> header, construct an execute request according to test <a href="#ats_core_job-creation-request">/conf/core/job-creation-request</a>.</p>
    </li>
    <li>
    <p id="_9e5b6700-137f-625b-33c0-ffbf19058754">For processes that are supposed to execute asynchronously according to the <a href="#req_core_job-creation-default-execution-mode">/req/core/job-creation-default-execution-mode</a> requirement, verify the successful execution according to the <a href="#ats_core_job-creation-success-async">/conf/core/job-creation-success-async</a> test.</p>
