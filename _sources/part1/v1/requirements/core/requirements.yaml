    <li>
    <p id="_cd3befe3-cfd0-8b62-d338-57aabd292c9c">Get the results as per test <a href="#ats_core_job-results-op">/conf/core/job-results</a> and verify that they conform to the test <a href="#ats_core_job-results-async-raw-value-multi">/conf/core/job-results-async-raw-value-multi</a>.</p>
    </li>
    <li>
    <p id="_98901c58-4d5d-27f1-cbed-0cb627c7900a">If the link does not exist then verify that the synchronous response conforms to requirement <a data-source-href="#req_core_job-creation-sync-raw-value-one" href="https://docs.ogc.org/is/18-062r2/18-062r2.html#_89d14442-31b3-e5a3-5464-a43b883e3c4a" title="Unresolved reference in the published standard; opens its official source context, not an inferred target.">/req/core/job-creation-sync-raw-value-one</a>.</p>
