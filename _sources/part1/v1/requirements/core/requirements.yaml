    <li>
    <p id="_15dbf9c3-f01f-3d40-3b5d-9914e6e4ee3f">Issue an HTTP POST request to the URL ‘/processes/{processID}/execution’ for each execution mode according to requirements <a href="#ats_core_job-creation-default-execution-mode">/conf/core/job-creation-default-execution-mode</a> or <a href="#ats_core_job-creation-auto-execution-mode">/conf/core/job-creation-auto-execution-mode</a>.</p>
    </li>
