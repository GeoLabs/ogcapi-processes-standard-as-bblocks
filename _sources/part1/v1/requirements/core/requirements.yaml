    <table class="recommend" id="req_core_process-execute-input-inline-object" style="border-collapse:collapse;border-spacing:0;"><thead><tr><th class="recommend" colspan="2" scope="colgroup" style="vertical-align:top;"><p class="RecommendationTitle">Requirement 20</p></th></tr></thead><tbody><tr><td class="recommend" colspan="2" style="vertical-align:top;"><p>/req/core/process-execute-input-inline-object</p></td></tr><tr><td class="recommend" style="vertical-align:top;">Conditions</td><td class="recommend" style="vertical-align:top;">
