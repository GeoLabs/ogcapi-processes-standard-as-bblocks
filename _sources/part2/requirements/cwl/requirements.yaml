# Requirements class: CWL — DRAFT
# Class URI: https://www.opengis.net/spec/ogcapi-processes-2/1.0/req/cwl
# Source (draft, re-check before treating as final): https://docs.ogc.org/DRAFTS/20-044.html
#
# All 6 requirements of rc_cwl are transcribed here (the source's `requirement::` list has 6
# entries, not 7 — a `REQ_media-type-response.adoc` file exists on disk but is genuinely empty
# (0 bytes) and is not referenced by the requirements-class summary, so it is intentionally
# omitted here too).

standardization-target: Web API

depends-on:
  - uri: https://docs.ogc.org/is/18-062r2/18-062r2.html
    title: "OGC API — Processes — Part 1: Core"
  - bblock: ogc.api.processes.part2.requirements.core
  - bblock: ogc.api.processes.part2.requirements.ogcapppkg
  - uri: https://www.commonwl.org/v1.2/
    title: "Common Workflow Language v1.2"

requirements:

  - id: execution-unit-by-ref
    # Full URI: .../req/cwl/execution-unit-by-ref
    level: SHALL
    statement: >
      If passed by reference, the value of the `executionUnit` property SHALL be a link pointing
      to the CWL file describing the execution unit of the process. Both the `href` and `type`
      fields of the link SHALL be specified. If the encoding of the CWL is known to be JSON then
      the value of the `type` field SHALL be `application/cwl+json`. If the encoding of the CWL
      is known to be YAML then the value of the `type` field SHALL be `application/cwl+yaml`. If
      the specific encoding of the CWL is unknown then the value of the `type` field SHALL be the
      generic media type `application/cwl`.
    applies-to:
      bblock: ogc.api.processes.v1.schemas.link
      json-path: $
    tested-by:
      - cwl-execution-unit-by-ref-success

  - id: execution-unit-by-val
    level: SHALL
    statement: >
      If encoded in-line within an [OGC Application
      Package](bblocks://ogc.api.processes.part2.requirements.ogcapppkg), the CWL value of the
      `executionUnit` property SHALL be specified using a qualified value. Both the `mediaType`
      and `value` fields of the qualified value SHALL be specified. If the CWL value is specified
      as a JSON object then the value of the `mediaType` field SHALL be `application/cwl`. If the
      CWL value is specified as an embedded JSON string then the value of the `mediaType` field
      SHALL be `application/cwl+json`. If the CWL value is specified as an embedded YAML string
      then the value of the `mediaType` field SHALL be `application/cwl+yaml`.
    applies-to:
      bblock: ogc.api.processes.v2.schemas.executionUnitBase
      json-path: $

  - id: body
    level: SHALL
    statement: >
      The content of the request body of a Deploy or Replace operation SHALL be a CWL document
      (when the CWL document is sent directly, without being embedded in an OGC Application
      Package).
    applies-to:
      bblock: ogc.api.processes.part2.requirements.core

  - id: media-type-request
    level: SHALL
    statement: >
      The media type `application/cwl` SHALL be used to indicate that the request body contains a
      process description encoded as CWL of a generic encoding (JSON or YAML). If the CWL
      encoding is known to be a JSON document, the request MAY employ `application/cwl+json`
      instead of `application/cwl` to advertise it more explicitly. If the CWL encoding is known
      to be a YAML document, the request MAY employ `application/cwl+yaml` instead of
      `application/cwl` to advertise it more explicitly.
    applies-to:
      bblock: ogc.api.processes.part2.requirements.core

  - id: deploy-w-param
    level: SHALL
    statement: >
      If the CWL contains more than a single workflow identifier, an additional `w` query
      parameter SHALL be used to target a specific workflow identifier to be deployed. The `w`
      query parameter SHALL be a string, supplied via a non-required query parameter named `w`.
      If, in this case, the `w` query parameter is not specified, the first process found SHALL
      be deployed.
    note: >
      Upstream OpenAPI parameter fragment (openapi/parameters/processes-dru/w-param.yaml):
      `{name: w, in: query, required: false, schema: {type: string}}`. Reproduced inline here
      rather than as a separate imported/local parameter Building Block, since it is a single
      leaf-level query parameter with no further schema structure.

  - id: deploy-exception-workflow-not-found
    level: SHALL
    statement: >
      If the `w` parameter has a value that cannot be located within the request body, the server
      SHALL respond with an HTTP status code `400`. The content of that response SHALL validate
      against the [exception](bblocks://ogc.api.processes.v1.schemas.exception) schema. The
      `type` of the exception SHALL be
      `https://www.opengis.net/def/exceptions/ogcapi-processes-2/1.0/workflow-not-found`.
    applies-to:
      bblock: ogc.api.processes.v1.schemas.exception
      json-path: $
