# Requirements class: Deploy, Replace, Undeploy (DRU) — DRAFT
# Class URI: https://www.opengis.net/spec/ogcapi-processes-2/1.0/req/deploy-replace-undeploy
# Source (draft, re-check before treating as final): https://docs.ogc.org/DRAFTS/20-044.html
#
# All 22 requirements of rc_deploy-replace-undeploy are transcribed here. Test coverage is
# intentionally light for this checkpoint (mirroring Part 1's own "PoC scope" core class):
# only a couple of representative fixtures are provided, not full coverage of all 22.
#
# The `mutable` property (static-indicator requirement below) extends the `processSummary`
# schema per the draft, but that schema extension itself belongs to the future "OGC Application
# Package" conformance class (not yet built in this register) — this Core class only mandates
# the semantics of the flag, not the schema fragment that adds it.

standardization-target: Web API

depends-on:
  # Normative document dependencies (external standards, not local/imported BB dependencies)
  - uri: https://docs.ogc.org/is/18-062r2/18-062r2.html
    title: "OGC API — Processes — Part 1: Core"
  - uri: https://docs.ogc.org/DRAFTS/20-004r1.html
    title: "OGC API — Features — Part 4: Create, Replace, Update and Delete (DRAFT)"
  - uri: https://tools.ietf.org/html/rfc2616
    title: "RFC 2616 (HTTP/1.1)"

requirements:

  # --- Resource endpoints ---

  - id: resource-endpoints
    # Full URI: .../req/deploy-replace-undeploy/resource-endpoints
    level: SHALL
    statement: >
      For processes, the resources endpoints SHALL be URIs specified by the URI template
      `{landingPageUri}/processes`. The parameter `landingPageUri` SHALL be the URI of the
      Landing Page resource.

  - id: resource-endpoint
    level: SHALL
    statement: >
      For processes, the resource endpoints SHALL be URIs specified by the URI template
      `{landingPageUri}/processes/{processID}`. The parameter `landingPageUri` SHALL be the URI
      of the Landing Page resource. The parameter `processID` SHALL be each `id` property of each
      process present in the `processes` array (i.e., the response to a GET request to
      `{landingPageUri}/processes`).

  # --- Deploy: POST /processes ---

  - id: deploy-post-op
    level: SHALL
    statement: >
      The server SHALL support the HTTP POST operation at the resources endpoint
      (path `/processes`).
    tested-by:
      - deploy-success

  - id: deploy-body
    level: SHALL
    statement: >
      The body of the POST request SHALL contain a formal description of the process to be
      dynamically deployed to the API.

  - id: deploy-content-type
    level: SHALL
    statement: >
      The `Content-Type` header SHALL be used to declare the media type of the request body
      containing a description of the processes to be added to the API.

  - id: deploy-response-pid
    level: SHALL
    statement: >
      If the operation completes successfully, the server SHALL assign the processes identifier
      found in the processes description (i.e. `{processID}`) to the newly added processes.

  - id: deploy-response-success
    level: SHALL
    statement: >
      A successful execution of the operation SHALL be reported as a response with a HTTP status
      code `201`. A response with HTTP status code `201` SHALL include a `Location` header with
      the URI of the deployed processes (path: `/processes/{processID}`). If the operation is not
      executed immediately, but is added to a processing queue, the response SHALL have a HTTP
      status code `202`.

  - id: deploy-response-body
    level: SHALL
    statement: >
      The body of the response SHALL contain a summary description of the added process that
      conforms to the [processSummary](bblocks://ogc.api.processes.v1.schemas.processSummary)
      schema.
    applies-to:
      bblock: ogc.api.processes.v1.schemas.processSummary
      json-path: $
    tested-by:
      - deploy-success
      - deploy-response-missing-id-fail

  - id: deploy-unsupported-media-type
    level: SHALL
    statement: >
      If the server does not support the `Content-Type` header associated with the request body,
      the code of the response SHALL be `415 Unsupported Media Type`. The content of that
      response SHALL validate against the [exception](bblocks://ogc.api.processes.v1.schemas.exception)
      schema. The `type` of the exception SHALL be
      `https://www.opengis.net/def/exceptions/ogcapi-processes-2/1.0/unsupported-media-type`.
    applies-to:
      bblock: ogc.api.processes.v1.schemas.exception
      json-path: $

  - id: deploy-response-duplicate
    level: SHALL
    statement: >
      If a process with the same identifier already exists on the server, the code of the
      response SHALL be `409`. A response with HTTP status code `409` MAY include a `Location`
      header with the URI of the duplicated processes (path: `/processes/{processID}`). The
      content of that response SHALL be based upon the
      [exception](bblocks://ogc.api.processes.v1.schemas.exception) schema. The `type` of the
      exception SHALL be `https://www.opengis.net/def/exceptions/ogcapi-processes-2/1.0/duplicated-process`.
    applies-to:
      bblock: ogc.api.processes.v1.schemas.exception
      json-path: $

  - id: deploy-response-immutable
    level: SHALL
    statement: >
      If a process with the same identifier already exists on the server and is immutable, the
      code of the response SHALL be `403`. A response with HTTP status code `403` MAY include a
      `Location` header with the URI of the existing process (path: `/processes/{processID}`).
      The content of that response SHALL validate against the
      [exception](bblocks://ogc.api.processes.v1.schemas.exception) schema. The `type` of the
      exception SHALL be `https://www.opengis.net/def/exceptions/ogcapi-processes-2/1.0/immutable-process`.
    applies-to:
      bblock: ogc.api.processes.v1.schemas.exception
      json-path: $

  # --- Immutability flag ---

  - id: static-indicator
    level: SHALL
    statement: >
      The optional property `mutable` SHALL be used to indicate whether a process is a static or
      built-in process that is immutable, or a dynamically added process that is mutable. A value
      of `true` SHALL be used to indicate that a process is mutable and can thus be manipulated
      through an API request. A value of `false` SHALL be used to indicate that a process is
      immutable and can thus not be manipulated through an API request. The default value SHALL
      be `true`.
    note: >
      The schema fragment that adds this `mutable` property to the process summary is defined by
      the future "OGC Application Package" conformance class, not by this Core requirements
      class.

  # --- Replace: PUT /processes/{processID} ---

  - id: replace-put-op
    level: SHALL
    statement: >
      The server SHALL support the HTTP PUT operation at the resource endpoint
      (path `/processes/{processID}`). The parameter `processID` is each `id` property in the
      processes response (JSONPath: `$.processes[*].id`). The HTTP PUT operation SHALL only be
      supported for dynamically deployed resources (i.e. those where the value of the `mutable`
      property is set to `true`).

  - id: replace-body
    level: SHALL
    statement: >
      The body of a PUT request SHALL contain a formal description of the replacement process.

  - id: replace-content-type
    level: SHALL
    statement: >
      The `Content-Type` header SHALL be used to indicate the media type of a request body
      containing the description of the replacement processes.

  - id: replace-response
    level: SHALL
    statement: >
      A successful execution of the operation SHALL be reported as a response with a HTTP status
      code `200` or `204`. If the operation results in the immediate creation of a distinct
      process definition (rather than a literal replacement) which can be distinguished from the
      originally referenced `{processID}` by some versioning mechanism, the response SHALL have a
      HTTP status code `201` to hint clients about this separate resource — the `{processID}`
      SHALL then reference the newly created process definition used as replacement. If the
      operation is not executed immediately, but is added to a processing queue, the response
      SHALL have a HTTP status code `202`.

  - id: replace-response-body
    level: SHALL
    statement: >
      If the replacement response employs HTTP status code `200`, `201` or `202`, the response
      body SHALL conform to the [processSummary](bblocks://ogc.api.processes.v1.schemas.processSummary)
      schema. If the replacement response employs HTTP status code `204`, the response body SHALL
      be empty as per standard HTTP specification.
    applies-to:
      bblock: ogc.api.processes.v1.schemas.processSummary
      json-path: $

  # --- Undeploy: DELETE /processes/{processID} ---

  - id: undeploy-delete-op
    level: SHALL
    statement: >
      The server SHALL support the HTTP DELETE operation at the resource endpoint
      (path `/processes/{processID}`). The parameter `processID` is each `id` property in the
      process collection response (JSONPath: `$.processes[*].id`). The HTTP DELETE operation
      SHALL only be supported for dynamically deployed resources (i.e. those where the value of
      the `mutable` property is set to `true`).

  - id: undeploy-response
    level: SHALL
    statement: >
      A successful execution of the operation SHALL be reported as a response with a HTTP status
      code `204`.

  # --- Application package retrieval: GET /processes/{processID}/package ---

  - id: package-get-op
    level: SHALL
    statement: >
      For every process the server SHALL support the HTTP GET operation at the path
      `/processes/{processID}/package`. The parameter `processID` is each `id` property in the
      process collection response (JSONPath: `$.processes[*].id`). The operation SHALL only be
      supported for dynamically deployed processes (i.e. those where the value of the `mutable`
      property is set to `true`).

  - id: package-response-success
    level: SHALL
    statement: >
      A successful access to the resource SHALL be reported as a response with a HTTP status
      code `200`.

  - id: package-response-body
    level: SHALL
    statement: >
      The body of the response SHALL contain the last application package used to deploy the
      process.
    note: >
      The application package schema itself is defined by the future "OGC Application Package"
      conformance class, not by this Core requirements class.
