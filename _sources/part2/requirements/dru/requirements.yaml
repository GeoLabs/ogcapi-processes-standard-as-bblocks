# Source of truth: OGC 20-044 draft, https://docs.ogc.org/DRAFTS/20-044.html (retrieved 2026-11-05).
# Text transcribed verbatim from the draft; regenerate the document with bblocks-specgen.
#
# Requirements class https://www.opengis.net/spec/ogcapi-processes-2/1.0/req/deploy-replace-undeploy
# Statements are placed in description.md with <!-- requirement|recommendation|permission: <id> -->
# markers; abstract tests are laid out by the Annex A block (part2/annexes/ats).

class-id: deploy-replace-undeploy
title: Requirements Class ‘Deploy, Replace, Undeploy’
standardization-target: Web API
obligation: requirement
depends-on:
- uri: http://www.opengis.net/spec/ogcapi-processes-1/1.0/conf/core
  title: 'OGC API — Processes — Part 1: Core, Conformance Class ‘core’'
- uri: http://www.opengis.net/spec/ogcapi-features-4/1.0/conf/create-replace-delete
  title: 'OGC API — Features — Part 4: Create, Replace, Update and Delete, Conformance Class “Create/Replace/Delete”'
- uri: https://www.rfc-editor.org/info/rfc2616
  title: RFC 2616 (HTTP/1.1)
conformance-class:
  title: Deploy, Replace, Undeploy
requirements:
- id: deploy-replace-undeploy/additional-status-codes
  type: permission
  statement: Servers MAY support other HTTP protocol capabilities. Therefore, the server may return other
    status codes than those listed in [Table 2](#status_codes).
- id: deploy-replace-undeploy/static-indicator
  parts:
  - The optional property `mutable` SHALL be used to indicate whether a process is a static or built-in
    process that is immutable or a dynamically added process that is mutable.
  - A value of `true` SHALL be used to indicate that a processes is mutable and can thus be manipulated
    through an API request.
  - A value of `false` SHALL be used to indicate that a processes is immutable and can thus not be manipulated
    through an API request.
  - The default value SHALL be `true`.
- id: deploy-replace-undeploy/resource-endpoints
  parts:
  - For processes, the resources endpoints SHALL be URIs specified by the URI template `{landingPageUri}/processes`.
  - The parameter `landingPageUri` SHALL be the URI of the Landing Page resource.
- id: deploy-replace-undeploy/resource-endpoint
  parts:
  - For processes, the resource endpoints SHALL be URIs specified by the URI template `{landingPageUri}/processes/{processID}`.
  - The parameter `landingPageUri` SHALL be the URI of the Landing Page resource.
  - The parameter `processID` SHALL be each `id` property of each process present in the `processes` array
    (i.e., the response to a GET request to `{landingPageUri}/processes`).
- id: deploy-replace-undeploy/deploy-post-op
  statement: The server SHALL support the HTTP POST operation at the resources endpoint (path `/processes`).
- id: deploy-replace-undeploy/deploy-body
  statement: The body of the POST request SHALL contain a formal description of the process to be dynamically
    deployed to the API.
- id: deploy-replace-undeploy/deploy-body
  type: permission
  statement: A server MAY support any processes description encoding in the body of a HTTP POST operation.
- id: deploy-replace-undeploy/deploy-content-type
  statement: The `Content-Type` [header](https://tools.ietf.org/html/rfc2616#section-14.17) SHALL be used
    to declare the media type of the request body containing a description of the processes to be added
    to the API.
- id: deploy-replace-undeploy/deploy-body-ogcapppkg
  type: recommendation
  statement: If a process can be represented for the intended use as an [OGC Application Package](bblocks://ogc.api.processes.part2.requirements.ogcapppkg),
    implementations SHOULD consider supporting the [OGC Application Package Conformance Class](bblocks://ogc.api.processes.part2.requirements.ogcapppkg)
    for describing the process to be added to the API.
- id: deploy-replace-undeploy/deploy-body-cwl
  type: recommendation
  statement: If a process can be encoded for the intended use in [CWL](bblocks://ogc.api.processes.part2.requirements.cwl),
    implementations SHOULD consider supporting the [CWL Conformance Class](bblocks://ogc.api.processes.part2.requirements.cwl)
    for describing the process to be deployed to the API.
- id: deploy-replace-undeploy/deploy-response-pid
  statement: If the operation completes successfully, the server SHALL assign the processes identifier
    found in the processes description (i.e. `{processID}`) to the newly added processes.
- id: deploy-replace-undeploy/deploy-response-success
  parts:
  - A successful execution of the operation SHALL be reported as a response with a HTTP status code `201`.
  - 'A response with HTTP status code `201` SHALL include a `Location` header with the URI of the deployed
    processes (path: `/processes/{processID}`).'
  - If the operation is not executed immediately, but is added to a processing queue, the response SHALL
    have a HTTP status code `202`.
- id: deploy-replace-undeploy/deploy-response-body
  statement: |
    The body of the response SHALL contain a summary description of the added process that conforms to the following OpenAPI schema:

    ```yaml
    allOf:
      - $ref: "descriptionType.yaml"
      - type: object
        required:
          - id
          - version
        properties:
          id:
            type: string
          version:
            type: string
          jobControlOptions:
            type: array
            items:
              $ref: "jobControlOptions.yaml"
          links:
            type: array
            items:
              $ref: "link.yaml"
    ```
  applies-to:
    bblock: ogc.api.processes.part2.schemas.processSummary
    table: false
- id: deploy-replace-undeploy/deploy-unsupported-media-type
  parts:
  - If the server does not support the `Content-Type` header associated with the request body, the code
    of the response SHALL be `415 Unsupported Media Type`.
  - |
    The content of that response SHALL validate against the following OpenAPI schema fragment:

    ```yaml
    title: Exception Schema
    description: JSON schema for exceptions based on RFC 7807
    type: object
    required:
      - type
    properties:
      type:
        type: string
      title:
        type: string
      status:
        type: integer
      detail:
        type: string
      instance:
        type: string
    additionalProperties: true
    ```
  - The `type` of the exception SHALL be `"https://www.opengis.net/def/exceptions/ogcapi-processes-2/1.0/unsupported-media-type"`.
  applies-to:
    bblock: ogc.api.processes.v1.schemas.exception
    table: false
- id: deploy-replace-undeploy/deploy-response-duplicate
  parts:
  - If a process with the same identifier already exists on the server, the code of the response SHALL
    be `409`.
  - 'A response with HTTP status code `409` MAY include a `Location` header with the URI of the duplicated
    processes (path: `/processes/{processID}`).'
  - |
    The content of that response SHALL be based upon the OpenAPI schema fragment:

    ```yaml
    title: Exception Schema
    description: JSON schema for exceptions based on RFC 7807
    type: object
    required:
      - type
    properties:
      type:
        type: string
      title:
        type: string
      status:
        type: integer
      detail:
        type: string
      instance:
        type: string
    additionalProperties: true
    ```
  - The `type` of the exception SHALL be “https://www.opengis.net/def/exceptions/ogcapi-processes-2/1.0/duplicated-process”.
  applies-to:
    bblock: ogc.api.processes.v1.schemas.exception
    table: false
- id: deploy-replace-undeploy/deploy-response-immutable
  parts:
  - If a process with the same identifier already exists on the server and is immutable, the code of the
    response SHALL be `403`.
  - 'A response with HTTP status code `403` MAY include a `Location` header with the URI of the existing
    process (path: `/processes/{processID}`).'
  - |
    The content of that response SHALL validate against the following OpenAPI schema fragment:

    ```yaml
    title: Exception Schema
    description: JSON schema for exceptions based on RFC 7807
    type: object
    required:
      - type
    properties:
      type:
        type: string
      title:
        type: string
      status:
        type: integer
      detail:
        type: string
      instance:
        type: string
    additionalProperties: true
    ```
  - The `type` of the exception SHALL be “https://www.opengis.net/def/exceptions/ogcapi-processes-2/1.0/immutable-process”.
  applies-to:
    bblock: ogc.api.processes.v1.schemas.exception
    table: false
- id: deploy-replace-undeploy/replace-put-op
  parts:
  - The server SHALL support the HTTP PUT operation at the resource endpoint (path `/processes/{processID}`).
  - 'The parameter `processID` is each `id` property in the processes response (JSONPath: `$.processes[*].id`).'
  - The HTTP PUT operation SHALL only be supported for dynamically deployed resources (i.e. those where
    the value of the [`mutable`](#req-deploy-replace-undeploy-static-indicator) property is set to `true`).
- id: deploy-replace-undeploy/replace-body
  statement: The body of a PUT request SHALL contain a formal description of the replacement process.
- id: deploy-replace-undeploy/replace-body
  type: permission
  statement: A server MAY support any processes description encoding in the body of a HTTP PUT operation.
- id: deploy-replace-undeploy/replace-content-type
  statement: As per [HTTP 1.1](https://tools.ietf.org/html/rfc2616#section-14.17) the ‘Content-Type’ header
    SHALL be used to indicate the media type of a request body containing the description of the replacement
    processes.
- id: deploy-replace-undeploy/replace-body-ogcapppkg
  type: recommendation
  statement: If a process can be described for the intended use as an [OGC Application Package](bblocks://ogc.api.processes.part2.requirements.ogcapppkg),
    implementations SHOULD consider supporting the [OGC Application Package](bblocks://ogc.api.processes.part2.requirements.ogcapppkg)
    encoding for describing the replacement process.
- id: deploy-replace-undeploy/replace-body-cwl
  type: recommendation
  statement: If a process can be encoded for the intended use in [CWL](bblocks://ogc.api.processes.part2.requirements.cwl),
    implementations SHOULD consider supporting the [CWL](bblocks://ogc.api.processes.part2.requirements.cwl)
    encoding for describing the replacement process.
- id: deploy-replace-undeploy/replace-response
  parts:
  - A successful execution of the operation SHALL be reported as a response with a HTTP status code `200`
    or `204`.
  - If the operation results in the immediate creation of a distinct process definition (rather than a
    literal replacement) which can be distinguished from the originally referenced `{processID}` by some
    versioning mechanism, the response SHALL have a HTTP status code `201` to hint clients about this
    separate resource. The `{processID}` SHALL then reference the newly created process definition used
    as replacement.
  - If the operation is not executed immediately, but is added to a processing queue, the response SHALL
    have a HTTP status code `202`.
- id: deploy-replace-undeploy/replace-response-body
  parts:
  - If the replacement response employs HTTP status code `200`, `201` or `202` accordingly to requirement
    [/req/deploy-replace-undeploy/replace-response](#req-deploy-replace-undeploy-replace-response), the
    response body SHALL conform to the summary description of the process as per [processSummary.yaml](https://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/processSummary.yaml)
    schema.
  - If the replacement response employs HTTP status code `204`, the response body SHALL be empty as per
    standard HTTP specification.
  applies-to:
    bblock: ogc.api.processes.v1.schemas.processSummary
    table: false
- id: deploy-replace-undeploy/replace-response-insert
  type: permission
  parts:
  - 'A server MAY support immediate creation of the initial process definition when none exists using
    the HTTP PUT operation in an “upsert” fashion (i.e.: update or insert as applicable). In this case,
    the process creation SHOULD behave as if it was directly submitted for deployment as per [/req/deploy-replace-undeploy/deploy-post-op](#req-deploy-replace-undeploy-deploy-post-op).'
  - If the operation results in an insertion creating a new process definition rather than an update,
    it SHOULD reflect the appropriate HTTP status code as per the requirement [/req/deploy-replace-undeploy/replace-response](#req-deploy-replace-undeploy-replace-response).
- id: deploy-replace-undeploy/undeploy-delete-op
  parts:
  - The server SHALL support the HTTP DELETE operation at the resource endpoint (path `/processes/{processID}`).
  - 'The parameter `processID` is each `id` property in the process collection response (JSONPath: `$.processes[*].id`).'
  - The HTTP DELETE operation SHALL only be supported for dynamically deployed resources (i.e. those where
    the value of the [`mutable`](#req-deploy-replace-undeploy-static-indicator) property is set to `true`).
- id: deploy-replace-undeploy/undeploy-response
  statement: A successful execution of the operation SHALL be reported as a response with a HTTP status
    code ‘204’.
- id: deploy-replace-undeploy/package-get-op
  parts:
  - For every process the server SHALL support the HTTP GET operation at the path `/processes/{processID}/package`.
  - 'The parameter `processID` is each `id` property in the process collection response (JSONPath: `$.processes[*].id`).'
  - The operation SHALL only be supported for dynamically deployed processes (i.e. those where the value
    of the [`mutable`](#req-deploy-replace-undeploy-static-indicator) property is set to `true`).
- id: deploy-replace-undeploy/package-response-success
  statement: A successful access to the resource SHALL be reported as a response with a HTTP status code
    `200`.
- id: deploy-replace-undeploy/package-response-body
  statement: The body of the response SHALL contain the last [application package](bblocks://ogc.api.processes.part2.requirements.ogcapppkg)
    used to deploy the process.
abstract-tests:
- id: dru/static-indicator
  requirement:
    ref: deploy-replace-undeploy/static-indicator
    text: /req/deploy-replace-undeploy/static-indicator
  purpose: Validate that the process list contains processes with the mutable property.
  method: |
    1. Construct a path for each “rel=https://www.opengis.net/def/rel/ogc/1.0/processes” link on the landing page as well as for the {root}/processes path.
    2. Issue an HTTP GET request for each path
    3. Validate the process list is composed of processes that get the mutable Boolean parameter set to true or false
- id: dru/deploy-post-op
  requirement:
    ref: deploy-replace-undeploy/deploy-post-op
    text: /req/deploy-replace-undeploy/deploy/post-op
  purpose: Validate that the server support HTTP POST operation at the path /processes
  method: |
    1. Construct a path for each “rel=https://www.opengis.net/def/rel/ogc/1.0/processes” link on the landing page as well as for the {root}/processes path.
    2. Issue an HTTP POST request for each path.
    3. Validate that the response header does not contain `405 Method not allowed`
- id: dru/deploy-content-type
  requirement: deploy-replace-undeploy/deploy-content-type
  purpose: Validate that the server support the Content-type header to declare the media type of the request
    body
  method: |
    1. Construct a path for each “rel=https://www.opengis.net/def/rel/ogc/1.0/processes” link on the landing page as well as for the {root}/processes path.
    2. Issue an HTTP POST request associated with an unsupported media type, i.e. `text/plain`.
    3. Validate the response using [/conf/dru/deploy/unsupported-media-type](#ats-dru-deploy-unsupported-media-type)
- id: dru/deploy-unsupported-media-type
  requirement:
    ref: deploy-replace-undeploy/deploy-unsupported-media-type
    text: /req/deploy-replace-undeploy/deploy-unsupported-media-type
  purpose: Validate that the server returns a 415 status code with a relevant exception
  method: |
    1. Validate that a document was returned with an HTTP status code of `415` (Unsupported Media Type).
    2. Validate that the document in the response body is conform to the [exception.yaml](https://schemas.opengis.net/ogcapi/processes/part1/1.0/openapi/schemas/exception.yaml) schema.
    3. Validate that the type of the exception is \`”[https://www.opengis.net/def/exceptions/ogcapi-processes-2/1.0/unsupported-media-type](https://www.opengis.net/def/exceptions/ogcapi-processes-2/1.0/unsupported-media-type)\`”/\>.
- id: dru/replace-put-op
  requirement: deploy-replace-undeploy/replace-put-op
  purpose: Validate that the server supports HTTP PUT operation at the path /processes
  method: |
    1. Construct a path for each “rel=https://www.opengis.net/def/rel/ogc/1.0/processes” link on the landing page as well as for the {root}/processes path.
    2. Append `/{processID}` to each path, where `{processID}` is not an existing process id, i.e. `not-existing-process`.
    3. Issue an HTTP PUT request for each path.
    4. Validate that the response header does not contain `405 Method not allowed`.
- id: dru/replace-content-type
  requirement: deploy-replace-undeploy/replace-content-type
  purpose: Validate that the server supports the Content-type header to declare the media type of the
    request body
  method: |
    1. Construct a path for each “rel=https://www.opengis.net/def/rel/ogc/1.0/processes” link on the landing page as well as for the {root}/processes path.
    2. Append `/{processID}` to each path, where `{processID}` is a mutable process id.
    3. Issue an HTTP PUT request with an unsupported media type, i.e. `text/plain`, on each path.
    4. Validate the response using [/conf/dru/deploy/unsupported-media-type](#ats-dru-deploy-unsupported-media-type)
- id: dru/undeploy-delete-op
  requirement: deploy-replace-undeploy/undeploy-delete-op
  purpose: Validate that the server supports HTTP DELETE operation at the path /processes/{processID}
  method: |
    1. Construct a path for each “rel=https://www.opengis.net/def/rel/ogc/1.0/processes” link on the landing page as well as for the {root}/processes path.
    2. Append `/{processID}` to each path, where `{processID}` is not an existing process id, i.e. `not-existing-process`.
    3. Issue an HTTP DELETE request for each path.
    4. Validate that the response header does not contain `405 Method not allowed`.
- id: dru/undeploy-response
  requirement: deploy-replace-undeploy/undeploy-response
  purpose: Validate that the server returns a 204 status code when removing a mutable process
  method: |
    1. Construct a path for each “rel=https://www.opengis.net/def/rel/ogc/1.0/processes” link on the landing page as well as for the {root}/processes path.
    2. Append `/{processID}` to each path, where `{processID}` is a mutable process id.
    3. Issue an HTTP DELETE request on one path.
    4. Validate that no content was returned with an HTTP status code of 204.
- id: dru/undeploy-response-immutable
  requirement: deploy-replace-undeploy/deploy-response-immutable
  purpose: Validate that the server returns a 403 status code when removing an immutable process
  method: |
    1. Construct a path for each “rel=https://www.opengis.net/def/rel/ogc/1.0/processes” link on the landing page as well as for the {root}/processes path.
    2. Append `/{processID}` to each path, where `{processID}` is not a mutable process id.
    3. Issue an HTTP DELETE request on each path.
    4. Validate the response contains a document content, and was returned with an HTTP status code of 403
    5. Validate the document is conform to the [exception.yaml](https://raw.githubusercontent.com/opengeospatial/ogcapi-processes/master/openapi/schemas/common-core/exception.yaml) schema.
    6. Validate the type of the exception is “https://www.opengis.net/def/exceptions/ogcapi-processes-2/1.0/immutable-process”.
