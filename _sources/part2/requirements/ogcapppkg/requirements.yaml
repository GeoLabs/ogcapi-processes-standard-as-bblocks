# Requirements class: OGC Application Package — DRAFT
# Class URI: https://www.opengis.net/spec/ogcapi-processes-2/1.0/req/ogcapppkg
# Source (draft, re-check before treating as final): https://docs.ogc.org/DRAFTS/20-044.html
#
# All 5 requirements of rc_ogcapppkg are transcribed here. The executionUnit-schema requirement's
# schema fragment simplifies the Docker/OCI execution-unit branch (see
# ogc.api.processes.part2.schemas.executionUnitBase for the reason) since the "Docker"
# conformance class itself is not yet built in this register.

standardization-target: Web API

depends-on:
  - uri: https://docs.ogc.org/is/18-062r2/18-062r2.html
    title: "OGC API — Processes — Part 1: Core"
  - bblock: ogc.api.processes.part2.requirements.core

requirements:

  - id: schema
    # Full URI: .../req/ogcapppkg/schema
    level: SHALL
    statement: >
      The schema of an OGC Application Package document SHALL be defined by the
      [ogcapppkg](bblocks://ogc.api.processes.part2.schemas.ogcapppkg) OpenAPI schema.
    applies-to:
      bblock: ogc.api.processes.part2.schemas.ogcapppkg
      json-path: $

  - id: process-description
    level: SHALL
    statement: >
      The value of the `process` member of the `processDescription` property SHALL be defined by
      the [process](bblocks://ogc.api.processes.v1.schemas.process) schema.
    note: >
      The `processDescription` property is optional. If it is not included in the application
      package, the process interface must be inferred from the information in the execution unit.
    applies-to:
      bblock: ogc.api.processes.v1.schemas.process
      json-path: $

  - id: executionUnit-schema
    level: SHALL
    statement: >
      The value of the `executionUnit` property of an OGC Application Package SHALL be defined by
      the [executionUnit](bblocks://ogc.api.processes.part2.schemas.executionUnit) OpenAPI schema.
    applies-to:
      bblock: ogc.api.processes.part2.schemas.executionUnit
      json-path: $

  - id: body
    # Full URI: .../req/ogcapppkg/body (anchor in source is misspelled "req_ogcappkg_body")
    level: SHALL
    statement: >
      For the Deploy operation and the Replace operation, the media type
      `application/ogcapppkg+json` SHALL be used to indicate that the request body contains an
      OGC Application Package.
    applies-to:
      bblock: ogc.api.processes.part2.requirements.core

  - id: package-response-body
    level: SHALL
    statement: >
      For the Application Package retrieval operation, the media type
      `application/ogcapppkg+json` SHALL be used to indicate that the response body contains an
      OGC Application Package.
    applies-to:
      bblock: ogc.api.processes.part2.requirements.core
