# NOTE: the upstream draft (openapi/schemas/processes-dru/executionUnit.yaml) writes the array
# branch as `items: [$ref: executionUnitBase.yaml]` (a one-element list), which in JSON Schema
# denotes tuple validation for a single-item array rather than "array of executionUnitBase items".
# That reads as an authoring slip in the draft; reproduced here as a plain (non-tuple) `items`
# schema instead, since a homogeneous array is clearly the intent (an array of execution units).
oneOf:
  - $ref: bblocks://ogc.api.processes.part2.schemas.executionUnitBase
  - type: array
    items:
      $ref: bblocks://ogc.api.processes.part2.schemas.executionUnitBase
