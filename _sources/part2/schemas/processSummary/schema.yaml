# Source of truth: OGC 20-044 draft, https://docs.ogc.org/DRAFTS/20-044.html
allOf:
  - $ref: bblocks://ogc.api.processes.v1.schemas.descriptionType
  - type: object
    required:
      - id
      - version
    properties:
      id:
        type: string
      version:
        type: string
      jobControlOptions:
        type: array
        items:
          $ref: bblocks://ogc.api.processes.v1.schemas.jobControlOptions
      links:
        type: array
        items:
          $ref: bblocks://ogc.api.processes.v1.schemas.link
